<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BecaMob Plataforma de Mobilidade Urbana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #1a1a2e;
            font-size: 2.5em;
        }
        .logo span {
            color: #e94560;
        }
        .logo p {
            color: #666;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e94560;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }
        .error-message {
            background: #ffe0e0;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        .credentials {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 14px;
        }
        .credentials p {
            margin: 5px 0;
            color: #666;
        }
        .credentials strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Beca<span>Mob</span></h1>
            <p>BecaMob - Painel Administrativo</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        
        <div class="credentials">
        </div>
    </div>

    <script src="/js/rebeca-monitor.js"></script>
<script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                // Tentar login como admin primeiro, depois como sub-usuário
                let response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                let data = await response.json();
                
                // Se falhou como admin, tentar como sub-usuário
                if (!data.sucesso) {
                    const resp2 = await fetch('/api/usuarios/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: usuario, senha })
                    });
                    const data2 = await resp2.json();
                    if (data2.sucesso || data2.token) {
                        // Sub-usuário logado - normalizar formato
                        data = {
                            sucesso: true,
                            token: data2.token,
                            usuario: {
                                _id: data2.usuario?.adminId || data2.adminId,
                                id: data2.usuario?.adminId || data2.adminId,
                                nome: data2.usuario?.nome || usuario,
                                email: data2.usuario?.email || '',
                                empresa: data2.usuario?.empresa || '',
                                role: data2.usuario?.nivel || 'operador',
                                subUsuario: true,
                                subUsuarioId: data2.usuario?.id || data2.usuario?._id
                            }
                        };
                    }
                }
                // Usar data já populado acima
                
                if (data.sucesso) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = '/admin';
                } else {
                    errorDiv.textContent = data.error || 'Erro ao fazer login';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Erro de conexão com o servidor';
                errorDiv.style.display = 'block';
            }
        });

        // Se já estiver logado, redirecionar
        if (localStorage.getItem('token')) {
            window.location.href = '/admin';
        }
    </script>

<style id="mobile-responsive">
/* ===== RESPONSIVO GLOBAL MOBILE ===== */
* { box-sizing: border-box; }
img { max-width: 100%; }
.menu-toggle-global { display: none; background: none; border: none; color: white; font-size: 1.6em; cursor: pointer; padding: 5px 10px; }

@media (max-width: 768px) {
    .menu-toggle-global { display: block !important; }
    .sidebar, .nav-lateral { width: 100% !important; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .sidebar.aberto, .nav-lateral.aberto { max-height: 700px !important; }
    .container, .layout, .main-wrap { flex-direction: column !important; }
    .main-content, .content, .page-content { padding: 10px !important; width: 100% !important; }
    .cards, .grid, .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    .panel-grid { grid-template-columns: 1fr !important; }
    .card { padding: 12px !important; }
    .card .value { font-size: 1.3em !important; }
    table { font-size: 0.78em !important; display: block; overflow-x: auto; white-space: nowrap; }
    .btn { padding: 6px 10px !important; font-size: 0.8em !important; }
    .header, .top-bar { padding: 10px 12px !important; flex-wrap: wrap; gap: 8px; }
    .header h1, .top-bar h1 { font-size: 1.1em !important; }
    input, select, textarea { width: 100% !important; font-size: 16px !important; }
    .modal, .overlay-box { width: 95vw !important; max-width: 95vw !important; margin: 10px auto !important; }
    .form-row, .form-grid { flex-direction: column !important; }
    .col-2, .col-3, .col-4 { width: 100% !important; }
}

@media (max-width: 480px) {
    .cards, .grid, .stats-grid { grid-template-columns: 1fr 1fr !important; }
    .card-icon { font-size: 1.3em !important; }
    h1 { font-size: 1.2em !important; }
    h2 { font-size: 1em !important; }
}
</style>
<script>
// Toggle menu mobile global
function toggleMenuGlobal() {
    document.querySelectorAll('.sidebar, .nav-lateral').forEach(el => el.classList.toggle('aberto'));
}
// Auto-detectar mobile
(function() {
    function ajustar() {
        const isMobile = window.innerWidth <= 768;
        document.body.classList.toggle('is-mobile', isMobile);
        if (!isMobile) {
            document.querySelectorAll('.sidebar, .nav-lateral').forEach(el => el.classList.remove('aberto'));
        }
    }
    window.addEventListener('resize', ajustar);
    document.addEventListener('DOMContentLoaded', ajustar);
})();
// Fechar menu ao clicar em item
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.menu-item, .nav-item').forEach(item => {
        item.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                document.querySelectorAll('.sidebar, .nav-lateral').forEach(el => el.classList.remove('aberto'));
            }
        });
    });
});
</script>

</body>
</html>
