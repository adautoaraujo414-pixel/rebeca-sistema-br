<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍽️ Garçom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh}
.header{background:#1a1a2e;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f97316;position:sticky;top:0;z-index:100}
.header h1{font-size:1.1em;color:#f97316;font-weight:700}
.header-right{display:flex;align-items:center;gap:10px}
.badge-mesa{background:#f97316;color:#fff;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:.85em}
.btn-mesa{background:rgba(249,115,22,0.2);border:1px solid #f97316;color:#f97316;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85em;font-weight:600}

/* Login */
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:#1a1a2e;padding:32px 24px;border-radius:16px;width:100%;max-width:380px;border:1px solid rgba(249,115,22,0.3)}
.login-box h2{color:#f97316;text-align:center;margin-bottom:6px;font-size:1.5em}
.login-box p{color:#888;text-align:center;margin-bottom:24px;font-size:.9em}
.field{margin-bottom:16px}
.field label{display:block;color:#ccc;font-size:.85em;margin-bottom:6px}
.field input{width:100%;padding:12px;background:#0f0f1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em}
.field input:focus{outline:none;border-color:#f97316}
.btn-login{width:100%;padding:14px;background:#f97316;border:none;border-radius:8px;color:#fff;font-size:1em;font-weight:700;cursor:pointer}
.btn-login:active{opacity:.85}
.err{color:#ff4444;text-align:center;margin-top:10px;font-size:.85em}

/* Tabs */
.tabs{display:flex;background:#1a1a2e;border-bottom:1px solid #333;position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:12px 8px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-size:.85em;font-weight:600;color:#888}
.tab.active{border-bottom-color:#f97316;color:#f97316}
.tab .ct{background:#f97316;color:#fff;padding:1px 7px;border-radius:10px;font-size:.75em;margin-left:4px}

/* Cardápio */
.search-bar{padding:12px 16px;background:#1a1a2e;border-bottom:1px solid #222}
.search-bar input{width:100%;padding:10px 14px;background:#0f0f1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.95em}
.search-bar input:focus{outline:none;border-color:#f97316}
.cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#1a1a2e}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 14px;border-radius:20px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:.8em;white-space:nowrap}
.cat-btn.active{background:#f97316;border-color:#f97316;color:#fff;font-weight:600}
.itens-grid{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card{background:#1a1a2e;border-radius:12px;padding:14px;cursor:pointer;border:1px solid #222;transition:border-color .2s}
.item-card:active{border-color:#f97316;background:#1f1f3a}
.item-nome{font-weight:600;font-size:.95em;margin-bottom:4px}
.item-desc{font-size:.75em;color:#888;margin-bottom:8px;line-height:1.3}
.item-preco{color:#f97316;font-weight:700;font-size:1em}
.item-cat{font-size:.7em;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* Carrinho */
.carrinho-wrap{padding:16px}
.mesa-sel{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid rgba(249,115,22,0.3)}
.mesa-sel h3{color:#f97316;margin-bottom:10px;font-size:.95em}
.mesas-grid{display:flex;flex-wrap:wrap;gap:8px}
.mesa-btn{padding:10px 16px;border-radius:8px;border:1px solid #333;background:#0f0f1a;color:#ccc;cursor:pointer;font-weight:600;font-size:.9em}
.mesa-btn.sel{background:#f97316;border-color:#f97316;color:#fff}
.campo-mesa{display:flex;gap:8px;margin-top:10px}
.campo-mesa input{flex:1;padding:10px;background:#0f0f1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.9em}
.campo-mesa input:focus{outline:none;border-color:#f97316}
.cart-empty{text-align:center;padding:40px;color:#555}
.cart-item{background:#1a1a2e;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cart-item-info{flex:1}
.cart-item-nome{font-weight:600;font-size:.95em}
.cart-item-preco{color:#888;font-size:.8em;margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:10px}
.qty-btn{width:30px;height:30px;border-radius:50%;border:none;background:rgba(249,115,22,0.2);color:#f97316;font-size:1.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-btn:active{background:#f97316;color:#fff}
.qty-num{font-weight:700;min-width:20px;text-align:center}
.obs-box{background:#1a1a2e;border-radius:10px;padding:14px;margin-bottom:16px}
.obs-box label{display:block;color:#888;font-size:.8em;margin-bottom:6px}
.obs-box textarea{width:100%;background:#0f0f1a;border:1px solid #333;border-radius:8px;color:#fff;padding:10px;font-size:.9em;resize:none;height:70px}
.obs-box textarea:focus{outline:none;border-color:#f97316}
.cart-total{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.cart-total span{color:#ccc;font-size:.9em}
.cart-total strong{color:#f97316;font-size:1.2em}
.btn-enviar{width:100%;padding:16px;background:#f97316;border:none;border-radius:12px;color:#fff;font-size:1.05em;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-enviar:active{opacity:.85}
.btn-enviar:disabled{background:#333;color:#555;cursor:not-allowed}
.btn-limpar{width:100%;padding:12px;background:transparent;border:1px solid #444;border-radius:10px;color:#888;cursor:pointer;font-size:.9em}

/* Mesas (status) */
.mesas-status{padding:16px}
.mesa-card{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #f97316}
.mesa-card.tem-pronto{border-left-color:#00cc6a;animation:pulse-green 1.5s infinite}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(0,204,106,0)}50%{box-shadow:0 0 0 6px rgba(0,204,106,.2)}}
.mesa-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mesa-num{font-size:1.1em;font-weight:700;color:#f97316}
.mesa-total{color:#00cc6a;font-weight:700}
.pedido-mini{padding:8px 0;border-bottom:1px solid #222;font-size:.85em}
.pedido-mini:last-child{border:none}
.pedido-mini-head{display:flex;justify-content:space-between;align-items:center}
.pedido-num{color:#888}
.status-badge{padding:3px 10px;border-radius:10px;font-size:.75em;font-weight:700}
.s-novo{background:rgba(249,115,22,0.2);color:#f97316}
.s-preparando{background:rgba(243,156,18,0.2);color:#f39c12}
.s-pronto{background:rgba(0,204,106,0.2);color:#00cc6a}
.s-confirmado{background:rgba(52,152,219,0.2);color:#3498db}
.pronto-aviso{background:rgba(0,204,106,0.1);border:1px solid rgba(0,204,106,0.3);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.85em;color:#00cc6a;font-weight:600}

/* Modal item */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#1a1a2e;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-nome{font-size:1.2em;font-weight:700;margin-bottom:6px}
.modal-preco{color:#f97316;font-size:1.1em;font-weight:700;margin-bottom:12px}
.modal-desc{color:#888;font-size:.9em;margin-bottom:16px;line-height:1.4}
.modal-obs label{display:block;color:#888;font-size:.8em;margin-bottom:6px}
.modal-obs textarea{width:100%;background:#0f0f1a;border:1px solid #333;border-radius:8px;color:#fff;padding:10px;font-size:.9em;resize:none;height:60px}
.modal-obs textarea:focus{outline:none;border-color:#f97316}
.modal-qty{display:flex;align-items:center;gap:16px;justify-content:center;margin:16px 0}
.modal-qty .qty-btn{width:40px;height:40px;font-size:1.3em}
.modal-qty .qty-num{font-size:1.3em;font-weight:700}
.btn-add{width:100%;padding:14px;background:#f97316;border:none;border-radius:10px;color:#fff;font-weight:700;font-size:1em;cursor:pointer;margin-top:8px}
.btn-close-modal{width:100%;padding:10px;background:transparent;border:1px solid #333;border-radius:10px;color:#888;cursor:pointer;margin-top:8px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #f97316;color:#fff;padding:14px 24px;border-radius:12px;z-index:999;font-weight:600;font-size:.9em;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{border-color:#00cc6a;color:#00cc6a}
.toast.error{border-color:#ff4444;color:#ff4444}

/* Notif banner */
.notif-banner{position:fixed;top:0;left:0;right:0;background:#00cc6a;color:#fff;padding:14px;text-align:center;font-weight:700;font-size:.95em;z-index:999;display:none;cursor:pointer}
</style>
</head>
<body>

<div class="notif-banner" id="notifBanner" onclick="this.style.display='none'"></div>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <h2>🍽️ Garçom</h2>
    <p>Acesse com o token do restaurante</p>
    <div class="field">
      <label>Token do Restaurante</label>
      <input type="text" id="inputToken" placeholder="Cole o token aqui..." autocomplete="off">
    </div>
    <div class="field">
      <label>Seu nome</label>
      <input type="text" id="inputNome" placeholder="Ex: João" autocomplete="off">
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <h1 id="nomeRestaurante">🍽️ Garçom</h1>
    <div class="header-right">
      <span class="badge-mesa" id="badgeMesa">Sem mesa</span>
      <button class="btn-mesa" onclick="trocarMesa()">Mesa</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="mudarTab('cardapio')" id="tab-cardapio">🍔 Cardápio</div>
    <div class="tab" onclick="mudarTab('carrinho')" id="tab-carrinho">🛒 Pedido <span class="ct" id="ctCarrinho" style="display:none">0</span></div>
    <div class="tab" onclick="mudarTab('mesas')" id="tab-mesas">🪑 Mesas <span class="ct" id="ctProntos" style="display:none">!</span></div>
  </div>

  <!-- CARDÁPIO -->
  <div id="pg-cardapio">
    <div class="search-bar">
      <input type="text" id="busca" placeholder="🔍 Buscar item..." oninput="filtrarItens()">
    </div>
    <div class="cats" id="cats"></div>
    <div class="itens-grid" id="itensGrid"></div>
  </div>

  <!-- CARRINHO -->
  <div id="pg-carrinho" style="display:none">
    <div class="carrinho-wrap">
      <div class="mesa-sel">
        <h3>🪑 Mesa</h3>
        <div class="mesas-grid" id="mesasRapidas">
          <button class="mesa-btn" onclick="selecionarMesa('1')">1</button>
          <button class="mesa-btn" onclick="selecionarMesa('2')">2</button>
          <button class="mesa-btn" onclick="selecionarMesa('3')">3</button>
          <button class="mesa-btn" onclick="selecionarMesa('4')">4</button>
          <button class="mesa-btn" onclick="selecionarMesa('5')">5</button>
          <button class="mesa-btn" onclick="selecionarMesa('6')">6</button>
          <button class="mesa-btn" onclick="selecionarMesa('7')">7</button>
          <button class="mesa-btn" onclick="selecionarMesa('8')">8</button>
          <button class="mesa-btn" onclick="selecionarMesa('9')">9</button>
          <button class="mesa-btn" onclick="selecionarMesa('10')">10</button>
        </div>
        <div class="campo-mesa">
          <input type="number" id="mesaCustom" placeholder="Outra mesa..." min="1">
          <button class="mesa-btn sel" onclick="selecionarMesaCustom()">OK</button>
        </div>
      </div>

      <div id="carrinhoItens"><div class="cart-empty">Nenhum item adicionado</div></div>

      <div class="obs-box">
        <label>Observação geral</label>
        <textarea id="obsGeral" placeholder="Ex: sem cebola, prato separado..."></textarea>
      </div>

      <div class="cart-total">
        <span>Total do pedido</span>
        <strong id="totalCart">R$ 0,00</strong>
      </div>

      <button class="btn-enviar" id="btnEnviar" onclick="enviarPedido()">🚀 Enviar para Cozinha</button>
      <button class="btn-limpar" onclick="limparCarrinho()">🗑️ Limpar tudo</button>
    </div>
  </div>

  <!-- MESAS -->
  <div id="pg-mesas" style="display:none">
    <div class="mesas-status" id="mesasStatus">
      <div style="text-align:center;color:#555;padding:40px">Carregando mesas...</div>
    </div>
  </div>
</div>

<!-- MODAL ITEM -->
<div class="modal" id="modalItem">
  <div class="modal-box">
    <div class="modal-nome" id="mItemNome"></div>
    <div class="modal-preco" id="mItemPreco"></div>
    <div class="modal-desc" id="mItemDesc"></div>
    <div class="modal-obs">
      <label>Observação deste item</label>
      <textarea id="mItemObs" placeholder="Ex: sem pimenta, bem passado..."></textarea>
    </div>
    <div class="modal-qty">
      <button class="qty-btn" onclick="changeModalQty(-1)">−</button>
      <span class="qty-num" id="mItemQty">1</span>
      <button class="qty-btn" onclick="changeModalQty(1)">+</button>
    </div>
    <button class="btn-add" onclick="adicionarDoModal()">Adicionar ao Pedido</button>
    <button class="btn-close-modal" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
const API = '/api/delivery';
let token = localStorage.getItem('garcom_token') || '';
let nomeGarcom = localStorage.getItem('garcom_nome') || '';
let mesaAtual = localStorage.getItem('garcom_mesa') || '';
let cardapio = [];
let carrinho = [];
let catAtiva = 'todos';
let modalItem = null;
let modalQty = 1;

// ===== LOGIN =====
async function fazerLogin() {
    const t = document.getElementById('inputToken').value.trim();
    const n = document.getElementById('inputNome').value.trim();
    if (!t) { document.getElementById('loginErr').textContent = 'Informe o token'; return; }
    if (!n) { document.getElementById('loginErr').textContent = 'Informe seu nome'; return; }
    try {
        const r = await fetch(API + '/salon/cardapio', { headers: { Authorization: 'Bearer ' + t } });
        const d = await r.json();
        if (!d.sucesso) { document.getElementById('loginErr').textContent = 'Token inválido'; return; }
        token = t; nomeGarcom = n;
        localStorage.setItem('garcom_token', t);
        localStorage.setItem('garcom_nome', n);
        iniciarApp(d);
    } catch(e) { document.getElementById('loginErr').textContent = 'Erro de conexão'; }
}

function iniciarApp(d) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (d.nomeComercio) document.getElementById('nomeRestaurante').textContent = '🍽️ ' + d.nomeComercio;
    cardapio = d.cardapio || [];
    renderCats(d.categorias || []);
    renderItens();
    atualizarBadgeMesa();
    carregarMesas();
    setInterval(carregarMesas, 15000);
}

// ===== CARDÁPIO =====
function renderCats(cats) {
    const el = document.getElementById('cats');
    el.innerHTML = '<button class="cat-btn active" onclick="filtrarCat(\'todos\', this)">Todos</button>' +
        cats.map(c => '<button class="cat-btn" onclick="filtrarCat(\'' + c + '\', this)">' + c + '</button>').join('');
}

function filtrarCat(cat, btn) {
    catAtiva = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderItens();
}

function filtrarItens() {
    renderItens(document.getElementById('busca').value.toLowerCase());
}

function renderItens(busca = '') {
    const grid = document.getElementById('itensGrid');
    let lista = cardapio.filter(i => i.disponivel !== false);
    if (catAtiva !== 'todos') lista = lista.filter(i => i.categoria === catAtiva);
    if (busca) lista = lista.filter(i => i.nome.toLowerCase().includes(busca));
    if (!lista.length) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#555;padding:40px">Nenhum item</div>'; return; }
    grid.innerHTML = lista.map(i => `
        <div class="item-card" onclick="abrirModal(${JSON.stringify(i).replace(/"/g, '&quot;')})">
            <div class="item-cat">${i.categoria || ''}</div>
            <div class="item-nome">${i.nome}</div>
            <div class="item-desc">${i.descricao || ''}</div>
            <div class="item-preco">R$ ${(i.preco||0).toFixed(2).replace('.',',')}</div>
        </div>`).join('');
}

// ===== MODAL ITEM =====
function abrirModal(item) {
    modalItem = item; modalQty = 1;
    document.getElementById('mItemNome').textContent = item.nome;
    document.getElementById('mItemPreco').textContent = 'R$ ' + (item.preco||0).toFixed(2).replace('.',',');
    document.getElementById('mItemDesc').textContent = item.descricao || '';
    document.getElementById('mItemObs').value = '';
    document.getElementById('mItemQty').textContent = '1';
    document.getElementById('modalItem').classList.add('open');
}

function fecharModal() { document.getElementById('modalItem').classList.remove('open'); }

function changeModalQty(d) {
    modalQty = Math.max(1, modalQty + d);
    document.getElementById('mItemQty').textContent = modalQty;
}

function adicionarDoModal() {
    if (!modalItem) return;
    const obs = document.getElementById('mItemObs').value;
    const exist = carrinho.find(c => c._id === modalItem._id && c.obs === obs);
    if (exist) { exist.quantidade += modalQty; }
    else { carrinho.push({ ...modalItem, quantidade: modalQty, obs }); }
    fecharModal();
    renderCarrinho();
    showToast(modalQty + 'x ' + modalItem.nome + ' adicionado!', 'success');
}

// ===== CARRINHO =====
function renderCarrinho() {
    const ct = document.getElementById('ctCarrinho');
    const total = carrinho.reduce((s, i) => s + i.preco * i.quantidade, 0);
    const qtd = carrinho.reduce((s, i) => s + i.quantidade, 0);
    ct.textContent = qtd; ct.style.display = qtd ? 'inline' : 'none';
    document.getElementById('totalCart').textContent = 'R$ ' + total.toFixed(2).replace('.',',');

    const el = document.getElementById('carrinhoItens');
    if (!carrinho.length) { el.innerHTML = '<div class="cart-empty">Nenhum item adicionado</div>'; return; }
    el.innerHTML = carrinho.map((i, idx) => `
        <div class="cart-item">
            <div class="cart-item-info">
                <div class="cart-item-nome">${i.nome}${i.obs ? ' <span style="color:#888;font-size:.8em">- '+i.obs+'</span>' : ''}</div>
                <div class="cart-item-preco">R$ ${(i.preco*i.quantidade).toFixed(2).replace('.',',')} (${i.quantidade}x)</div>
            </div>
            <div class="cart-qty">
                <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
                <span class="qty-num">${i.quantidade}</span>
                <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
            </div>
        </div>`).join('');
}

function changeQty(idx, d) {
    carrinho[idx].quantidade += d;
    if (carrinho[idx].quantidade <= 0) carrinho.splice(idx, 1);
    renderCarrinho();
}

function limparCarrinho() {
    if (!confirm('Limpar carrinho?')) return;
    carrinho = []; renderCarrinho();
}

// ===== MESA =====
function selecionarMesa(m) {
    mesaAtual = m;
    localStorage.setItem('garcom_mesa', m);
    atualizarBadgeMesa();
    document.querySelectorAll('.mesa-btn').forEach(b => {
        b.classList.toggle('sel', b.textContent === m);
    });
}

function selecionarMesaCustom() {
    const v = document.getElementById('mesaCustom').value;
    if (v) selecionarMesa(v);
}

function trocarMesa() {
    mudarTab('carrinho');
    setTimeout(() => { document.getElementById('mesaCustom').focus(); }, 100);
}

function atualizarBadgeMesa() {
    document.getElementById('badgeMesa').textContent = mesaAtual ? 'Mesa ' + mesaAtual : 'Sem mesa';
}

// ===== ENVIAR PEDIDO =====
async function enviarPedido() {
    if (!mesaAtual) { showToast('Selecione uma mesa!', 'error'); return; }
    if (!carrinho.length) { showToast('Adicione itens ao pedido!', 'error'); return; }
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
        const r = await fetch(API + '/salon/pedido', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({
                mesa: mesaAtual,
                garcom: nomeGarcom,
                itens: carrinho.map(i => ({ nome: i.nome, preco: i.preco, quantidade: i.quantidade, obs: i.obs || '', categoria: i.categoria || '' })),
                observacao: document.getElementById('obsGeral').value
            })
        });
        const d = await r.json();
        if (d.sucesso) {
            showToast('✅ Pedido #' + d.numero + ' enviado para cozinha!', 'success');
            carrinho = []; renderCarrinho();
            document.getElementById('obsGeral').value = '';
            mudarTab('mesas');
        } else { showToast('Erro: ' + d.erro, 'error'); }
    } catch(e) { showToast('Erro de conexão', 'error'); }
    btn.disabled = false; btn.textContent = '🚀 Enviar para Cozinha';
}

// ===== MESAS STATUS =====
async function carregarMesas() {
    try {
        const r = await fetch(API + '/salon/mesas', { headers: { Authorization: 'Bearer ' + token } });
        const d = await r.json();
        if (!d.sucesso) return;
        renderMesas(d.mesas);
        const prontos = d.mesas.filter(m => m.pedidos.some(p => p.status === 'pronto'));
        const ct = document.getElementById('ctProntos');
        if (prontos.length) {
            ct.style.display = 'inline';
            const banner = document.getElementById('notifBanner');
            banner.textContent = '🔔 ' + prontos.length + ' mesa(s) com pedido pronto!';
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
        } else { ct.style.display = 'none'; }
    } catch(e) {}
}

function renderMesas(mesas) {
    const el = document.getElementById('mesasStatus');
    if (!mesas.length) { el.innerHTML = '<div style="text-align:center;color:#555;padding:40px">Nenhuma mesa ativa</div>'; return; }
    const statusLabel = { novo:'Novo', confirmado:'Confirmado', preparando:'Preparando', pronto:'✅ PRONTO' };
    const statusClass = { novo:'s-novo', confirmado:'s-confirmado', preparando:'s-preparando', pronto:'s-pronto' };
    el.innerHTML = mesas.map(m => {
        const temPronto = m.pedidos.some(p => p.status === 'pronto');
        return `<div class="mesa-card ${temPronto ? 'tem-pronto' : ''}">
            <div class="mesa-header">
                <span class="mesa-num">🪑 Mesa ${m.mesa}</span>
                <span class="mesa-total">R$ ${m.total.toFixed(2).replace('.',',')}</span>
            </div>
            ${temPronto ? '<div class="pronto-aviso">🔔 Pedido pronto para retirada!</div>' : ''}
            ${m.pedidos.map(p => `
                <div class="pedido-mini">
                    <div class="pedido-mini-head">
                        <span class="pedido-num">#${p.numero} · ${p.itens?.length || 0} itens</span>
                        <span class="status-badge ${statusClass[p.status] || 's-novo'}">${statusLabel[p.status] || p.status}</span>
                    </div>
                </div>`).join('')}
            <button onclick="fecharMesa('${m.mesa}')" style="margin-top:10px;width:100%;padding:8px;background:transparent;border:1px solid #444;border-radius:8px;color:#888;cursor:pointer;font-size:.8em">Fechar Mesa</button>
        </div>`;
    }).join('');
}

async function fecharMesa(mesa) {
    if (!confirm('Fechar mesa ' + mesa + '?')) return;
    await fetch(API + '/salon/mesa/' + mesa + '/fechar', { method: 'PUT', headers: { Authorization: 'Bearer ' + token } });
    showToast('Mesa ' + mesa + ' fechada!', 'success');
    carregarMesas();
}

// ===== TABS =====
function mudarTab(tab) {
    ['cardapio','carrinho','mesas'].forEach(t => {
        document.getElementById('pg-' + t).style.display = t === tab ? 'block' : 'none';
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    if (tab === 'mesas') carregarMesas();
}

// ===== TOAST =====
function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type + ' show';
    setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ===== INIT =====
window.onload = () => {
    if (token) {
        fetch(API + '/salon/cardapio', { headers: { Authorization: 'Bearer ' + token } })
            .then(r => r.json()).then(d => { if (d.sucesso) iniciarApp(d); else localStorage.clear(); })
            .catch(() => {});
    }
    if (mesaAtual) atualizarBadgeMesa();
};
</script>
