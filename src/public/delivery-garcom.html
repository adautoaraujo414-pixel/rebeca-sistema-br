<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garçom — Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f7;--surface:#ffffff;--surface2:#f0f0f2;--surface3:#e5e5ea;
  --border:#d1d1d6;--accent:#f97316;--accent2:#fb923c;--green:#16a34a;
  --blue:#2563eb;--red:#dc2626;--purple:#7c3aed;
  --text:#1c1c1e;--text2:#3a3a3c;--text3:#636366;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 60% 40%,#fff3e0 0%,var(--bg) 70%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.login-logo{font-size:2.4em;margin-bottom:8px;text-align:center}
.login-card h2{text-align:center;font-size:1.3em;font-weight:800;color:var(--text);margin-bottom:4px}
.login-card p{text-align:center;color:var(--text3);font-size:.85em;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78em;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.92em;font-family:inherit;transition:border .2s}
.field input:focus{outline:none;border-color:var(--accent)}
.btn-login{width:100%;padding:13px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.95em;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-login:hover{background:var(--accent2)}
#login-erro{color:var(--red);font-size:.82em;text-align:center;margin-top:10px;min-height:18px}

/* APP */
#app{display:none;height:100vh;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{font-size:1.3em;font-weight:800;color:var(--text)}
.header-logo span{color:var(--accent)}
.header-info{font-size:.82em;color:var(--text3);background:var(--surface2);padding:3px 10px;border-radius:20px}
.header-right{display:flex;align-items:center;gap:10px}
.clock{font-size:.85em;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.btn-sair{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.8em;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-sair:hover{border-color:var(--red);color:var(--red)}

/* LAYOUT */
.main-layout{display:grid;grid-template-columns:1fr 360px;flex:1;overflow:hidden;min-height:0}

/* PAINEL ESQUERDO — CARDÁPIO */
.left{display:flex;flex-direction:column;overflow:hidden;min-height:0;padding:16px;gap:12px}
.search-bar{position:relative}
.search-bar input{width:100%;padding:10px 14px 10px 36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.88em;font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--accent)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9em}
.cats-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-shrink:0}
.cats-scroll::-webkit-scrollbar{display:none}
.cat-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:.78em;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.items-area{flex:1;overflow-y:auto;min-height:0}
.cat-label{font-size:.72em;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.cat-label::after{content:'';flex:1;height:1px;background:var(--border)}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;overflow:hidden;position:relative}
.item-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(249,115,22,.12)}
.item-img-placeholder{width:100%;height:80px;background:linear-gradient(135deg,var(--surface3),var(--surface2));display:flex;align-items:center;justify-content:center;font-size:1.8em}
.item-info{padding:10px}
.item-name{font-size:.82em;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.item-tempo{font-size:.7em;color:var(--text3);margin-bottom:4px}
.item-price{font-size:.9em;font-weight:800;color:var(--accent)}
.item-add-btn{position:absolute;bottom:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.item-card:hover .item-add-btn{opacity:1}

/* PAINEL DIREITO — COMANDA */
.right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.comanda-header{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.comanda-title{font-size:.88em;font-weight:800;color:var(--text);margin-bottom:10px}
.mesa-selector{display:flex;gap:8px;align-items:center}
.mesa-selector label{font-size:.78em;font-weight:600;color:var(--text2);white-space:nowrap}
.mesa-input{flex:1;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9em;font-family:inherit}
.mesa-input:focus{outline:none;border-color:var(--accent)}
.cliente-input{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.85em;font-family:inherit;margin-top:8px}
.cliente-input:focus{outline:none;border-color:var(--accent)}
.comanda-itens{flex:1;overflow-y:auto;padding:12px 16px;min-height:0}
.comanda-vazia{text-align:center;color:var(--text3);padding:40px 20px;font-size:.88em}
.comanda-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.comanda-item:last-child{border-bottom:none}
.ci-qtd{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ci-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.9em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.ci-btn:hover{border-color:var(--accent);color:var(--accent)}
.ci-num{font-size:.85em;font-weight:700;min-width:20px;text-align:center}
.ci-nome{flex:1;font-size:.83em;color:var(--text)}
.ci-preco{font-size:.83em;font-weight:700;color:var(--accent);flex-shrink:0}
.ci-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.9em;padding:2px;transition:color .2s}
.ci-del:hover{color:var(--red)}
.obs-area{padding:0 16px 12px;flex-shrink:0}
.obs-input{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.83em;font-family:inherit;resize:none;height:60px}
.obs-input:focus{outline:none;border-color:var(--accent)}
.comanda-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.total-label{font-size:.85em;color:var(--text3)}
.total-val{font-size:1.2em;font-weight:800;color:var(--green)}
.btn-enviar{width:100%;padding:13px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.95em;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-enviar:hover{background:var(--accent2)}
.btn-enviar:disabled{background:var(--surface3);color:var(--text3);cursor:not-allowed}
.btn-limpar{width:100%;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text3);font-size:.82em;cursor:pointer;margin-top:6px;font-family:inherit;transition:all .2s}
.btn-limpar:hover{border-color:var(--red);color:var(--red)}

/* OVERLAY PEDIDO DE MESA (QR Code) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.overlay-box{background:var(--surface);border-radius:20px;padding:28px 24px;width:100%;max-width:400px;border:2px solid var(--accent)}
.overlay-title{font-size:.75em;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:700}
.overlay-mesa{font-size:1.8em;font-weight:800;color:var(--text)}
.overlay-cliente{color:var(--text3);font-size:.88em;margin:4px 0 16px}
.overlay-item{background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:.85em}
.overlay-timer{font-size:1.2em;font-weight:800;color:var(--blue);margin-top:12px;font-variant-numeric:tabular-nums}
.overlay-total{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-weight:700}
.btn-confirmar{width:100%;padding:13px;background:var(--green);border:none;color:#fff;border-radius:var(--radius-sm);font-weight:700;font-size:.95em;cursor:pointer;margin-top:14px;font-family:inherit}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:.85em;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* SUCCESS OVERLAY */
.success-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center}
.success-overlay.show{display:flex}
.success-box{background:var(--surface);border-radius:20px;padding:40px 32px;text-align:center;max-width:320px;width:90%}
.success-icon{font-size:3em;margin-bottom:12px}
.success-box h3{font-size:1.2em;font-weight:800;margin-bottom:8px}
.success-box p{color:var(--text3);font-size:.88em}
.btn-ok{padding:12px 32px;background:var(--accent);border:none;color:#fff;border-radius:var(--radius-sm);font-weight:700;cursor:pointer;margin-top:20px;font-family:inherit;font-size:.95em}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧑‍🍽️</div>
    <h2>Acesso Garçom</h2>
    <p>Entre com seu token de acesso</p>
    <div class="field">
      <label>Token GRC</label>
      <input type="text" id="inputToken" placeholder="GRC-XXXXXXXXXXXXXXXX" autocomplete="off">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="inputSenha" placeholder="Sua senha">
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <div id="login-erro"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column;height:100vh">
  <header>
    <div class="header-left">
      <div class="header-logo">🧑‍🍽️ <span>Garçom</span></div>
      <div class="header-info" id="nomeGarcom">—</div>
      
    </div>
    <div class="header-right">
      <div class="clock" id="clock">00:00</div>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="main-layout" style="flex:1;overflow:hidden">
    <!-- CARDÁPIO -->
    <div class="left">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar item..." oninput="filtrarItens()">
      </div>
      <div class="cats-scroll" id="categorias"></div>
      <div class="items-area" id="itensArea"></div>
    </div>

    <!-- COMANDA -->
    <div class="right">
      <div class="comanda-header">
        <div class="comanda-title">🧾 Nova Comanda</div>
        <div class="mesa-selector">
          <label>Mesa</label>
          <input type="number" class="mesa-input" id="numMesa" placeholder="Nº da mesa" min="1">
        </div>
        <input type="text" class="cliente-input" id="nomeCliente" placeholder="Nome do cliente (opcional)">
      </div>
      <div class="comanda-itens" id="comandaItens">
        <div class="comanda-vazia">🛒<br>Adicione itens do cardápio</div>
      </div>
      <div class="obs-area">
        <textarea class="obs-input" id="observacao" placeholder="Observações (ex: sem cebola, bem passado...)"></textarea>
      </div>
      <div class="comanda-footer">
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-val" id="totalVal">R$ 0,00</span>
        </div>
        <button class="btn-enviar" id="btnEnviar" onclick="enviarPedido()">✅ Enviar para Cozinha</button>
        <button class="btn-limpar" onclick="limparComanda()">Limpar comanda</button>
      </div>
    </div>
  </div>
</div>

<!-- OVERLAY PEDIDO QR -->
<div class="overlay" id="overlayQR">
  <div class="overlay-box">
    <div class="overlay-title">🔔 Pedido via QR Code</div>
    <div class="overlay-mesa" id="ovMesa">Mesa —</div>
    <div class="overlay-cliente" id="ovCliente">Cliente: —</div>
    <div id="ovItens"></div>
    <div class="overlay-timer" id="ovTimer">00:00</div>
    <div class="overlay-total">
      <span>Total</span>
      <span id="ovTotal" style="color:var(--green)">R$ 0,00</span>
    </div>
    <button class="btn-confirmar" onclick="confirmarQR()">✅ Confirmar — Em Preparo</button>
  </div>
</div>

<!-- OVERLAY SUCESSO -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <h3>Pedido Enviado!</h3>
    <p>Comanda enviada para a cozinha com sucesso.</p>
    <button class="btn-ok" onclick="fecharSucesso()">OK</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/delivery';
let token = '';
let cardapio = [];
let comanda = [];
let catAtiva = 'Todos';
let pedidosQRVistos = new Set();
let timerQR = null;
let timerSeg = 0;
let pedidoQRAtual = null;

// Pegar token da URL se vier como parâmetro
const urlParams = new URLSearchParams(location.search);
const tokenURL = urlParams.get('token');
if (tokenURL) {
  document.getElementById('inputToken').value = tokenURL;
}

// Relógio
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}, 1000);

// LOGIN
async function fazerLogin() {
  const tk = document.getElementById('inputToken').value.trim();
  const senha = document.getElementById('inputSenha').value.trim();
  const err = document.getElementById('login-erro');
  err.textContent = '';
  if (!tk) { err.textContent = 'Informe o token'; return; }

  try {
    const r = await fetch(API + '/garcons/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token: tk, senha })
    });
    const d = await r.json();
    if (!d.sucesso) { err.textContent = d.erro || 'Token ou senha inválidos'; return; }
    token = tk;
    document.getElementById('nomeGarcom').textContent = '👤 ' + (d.garcom?.nome || d.nome || 'Garçom');
    const nomeRest = document.getElementById('nomeRestaurante');
    if (d.nomeComercio) { nomeRest.textContent = d.nomeComercio; nomeRest.style.display = ''; }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    carregarCardapio();
    setInterval(verificarPedidosQR, 8000);
  } catch(e) { err.textContent = 'Erro de conexão: ' + e.message; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') fazerLogin();
});

// CARDÁPIO
async function carregarCardapio() {
  try {
    const r = await fetch(API + '/garcons/cardapio?garcomToken=' + token);
    const d = await r.json();
    if (!d.sucesso) return;
    cardapio = d.itens || [];
    renderCategorias();
    renderItens();
  } catch(e) { console.error(e); }
}

function renderCategorias() {
  const cats = ['Todos', ...new Set(cardapio.map(i => i.categoriaId?.nome || 'Outros').filter(Boolean))];
  const el = document.getElementById('categorias');
  el.innerHTML = cats.map(c =>
    `<div class="cat-chip${c===catAtiva?' active':''}" onclick="filtrarCat('${c}')">${c}</div>`
  ).join('');
}

function filtrarCat(cat) {
  catAtiva = cat;
  renderCategorias();
  renderItens();
}

function filtrarItens() { renderItens(); }

function renderItens() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const el = document.getElementById('itensArea');
  let itens = cardapio.filter(i => {
    const matchCat = catAtiva === 'Todos' || (i.categoriaId?.nome || 'Outros') === catAtiva;
    const matchBusca = !busca || i.nome.toLowerCase().includes(busca);
    return matchCat && matchBusca;
  });
  if (!itens.length) { el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px">Nenhum item encontrado</div>'; return; }

  const porCat = {};
  itens.forEach(i => {
    const c = i.categoriaId?.nome || 'Outros';
    if (!porCat[c]) porCat[c] = [];
    porCat[c].push(i);
  });

  el.innerHTML = Object.entries(porCat).map(([cat, its]) => `
    <div class="cat-label">${cat}</div>
    <div class="items-grid">
      ${its.map(i => `
        <div class="item-card" onclick='addItem(${JSON.stringify({_id:i._id,nome:i.nome,preco:i.preco||0,tempoPreparoMin:i.tempoPreparoMin||20})})'>
          <div class="item-img-placeholder">${i.categoriaId?.emoji || '🍽️'}</div>
          <div class="item-info">
            <div class="item-name">${i.nome}</div>
            <div class="item-tempo">⏱️ ~${i.tempoPreparoMin||20} min</div>
            <div class="item-price">R$ ${(i.preco||0).toFixed(2)}</div>
          </div>
          <button class="item-add-btn">+</button>
        </div>`).join('')}
    </div>`).join('');
}

// COMANDA
function addItem(item) {
  const ex = comanda.find(c => c._id === item._id);
  if (ex) ex.qtd++;
  else comanda.push({...item, qtd: 1});
  renderComanda();
  toast('Adicionado: ' + item.nome);
}

function renderComanda() {
  const el = document.getElementById('comandaItens');
  const total = comanda.reduce((s,i) => s + i.preco * i.qtd, 0);
  document.getElementById('totalVal').textContent = 'R$ ' + total.toFixed(2);
  if (!comanda.length) {
    el.innerHTML = '<div class="comanda-vazia">🛒<br>Adicione itens do cardápio</div>';
    return;
  }
  el.innerHTML = comanda.map((i, idx) => `
    <div class="comanda-item">
      <div class="ci-qtd">
        <button class="ci-btn" onclick="mudarQtd(${idx},-1)">−</button>
        <span class="ci-num">${i.qtd}</span>
        <button class="ci-btn" onclick="mudarQtd(${idx},1)">+</button>
      </div>
      <div class="ci-nome">${i.nome}</div>
      <div class="ci-preco">R$ ${(i.preco*i.qtd).toFixed(2)}</div>
      <button class="ci-del" onclick="removerItem(${idx})">✕</button>
    </div>`).join('');
}

function mudarQtd(idx, delta) {
  comanda[idx].qtd += delta;
  if (comanda[idx].qtd <= 0) comanda.splice(idx, 1);
  renderComanda();
}

function removerItem(idx) { comanda.splice(idx, 1); renderComanda(); }

function limparComanda() {
  comanda = [];
  document.getElementById('numMesa').value = '';
  document.getElementById('nomeCliente').value = '';
  document.getElementById('observacao').value = '';
  renderComanda();
}

async function enviarPedido() {
  const mesa = document.getElementById('numMesa').value.trim();
  const nomeCliente = document.getElementById('nomeCliente').value.trim();
  const obs = document.getElementById('observacao').value.trim();
  if (!mesa) { toast('Informe o número da mesa'); return; }
  if (!comanda.length) { toast('Adicione itens à comanda'); return; }
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await fetch(API + '/garcons/pedido', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        garcomToken: token,
        mesa,
        nomeCliente,
        observacao: obs,
        itens: comanda.map(i => ({itemId: i._id, nome: i.nome, preco: i.preco, quantidade: i.qtd}))
      })
    });
    const d = await r.json();
    if (d.sucesso) {
      limparComanda();
      document.getElementById('successOverlay').classList.add('show');
    } else { toast('Erro: ' + (d.erro || 'Falha ao enviar')); }
  } catch(e) { toast('Erro de conexão'); }
  finally { btn.disabled = false; btn.textContent = '✅ Enviar para Cozinha'; }
}

function fecharSucesso() { document.getElementById('successOverlay').classList.remove('show'); }

// PEDIDOS QR
async function verificarPedidosQR() {
  if (!token) return;
  try {
    const r = await fetch(API + '/mesa/pedidos-novos', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!r.ok) return;
    const d = await r.json();
    if (!d.pedidos?.length) return;
    const novo = d.pedidos.find(p => !pedidosQRVistos.has(p._id));
    if (!novo) return;
    pedidosQRVistos.add(novo._id);
    mostrarQR(novo);
  } catch(e) {}
}

function mostrarQR(pedido) {
  pedidoQRAtual = pedido;
  document.getElementById('ovMesa').textContent = 'Mesa ' + (pedido.mesa || '?');
  document.getElementById('ovCliente').textContent = 'Cliente: ' + (pedido.nomeCliente || 'Anônimo');
  const itens = pedido.itens || [];
  document.getElementById('ovItens').innerHTML = itens.map(i =>
    `<div class="overlay-item"><span>${i.quantidade||i.qtd||1}x ${i.nome}</span><span style="color:var(--accent)">R$ ${((i.preco||0)*(i.quantidade||i.qtd||1)).toFixed(2)}</span></div>`
  ).join('');
  document.getElementById('ovTotal').textContent = 'R$ ' + (pedido.total||0).toFixed(2);
  timerSeg = 0;
  if (timerQR) clearInterval(timerQR);
  timerQR = setInterval(() => {
    timerSeg++;
    const m = String(Math.floor(timerSeg/60)).padStart(2,'0');
    const s = String(timerSeg%60).padStart(2,'0');
    document.getElementById('ovTimer').textContent = '⏱️ ' + m + ':' + s + ' desde o pedido';
  }, 1000);
  document.getElementById('overlayQR').classList.add('show');
}

async function confirmarQR() {
  if (!pedidoQRAtual) return;
  try {
    await fetch(API + '/mesa/confirmar/' + pedidoQRAtual._id, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token }
    });
  } catch(e) {}
  if (timerQR) clearInterval(timerQR);
  document.getElementById('overlayQR').classList.remove('show');
  pedidoQRAtual = null;
  toast('Pedido confirmado — em preparo');
  setTimeout(verificarPedidosQR, 500);
}

function sair() { token = ''; location.reload(); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
