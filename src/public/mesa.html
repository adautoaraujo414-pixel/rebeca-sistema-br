<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#f97316;--accent-dim:rgba(249,115,22,.15);--accent-glow:rgba(249,115,22,.3);
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--surface3:#222;--border:rgba(255,255,255,.07);
  --text:#fff;--text2:#b0b0b0;--text3:#555;--green:#22c55e;--red:#ef4444;
  --radius:16px;--radius-sm:10px;--font:'Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
#loginWrap{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%;max-width:380px;text-align:center;animation:fadeUp .4s ease}
.login-logo{width:70px;height:70px;border-radius:16px;object-fit:cover;margin:0 auto 12px;display:block;border:2px solid var(--accent)}
.login-logo-ph{width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#ea580c);display:flex;align-items:center;justify-content:center;font-size:2em;margin:0 auto 12px}
.login-box h2{font-size:1.3em;font-weight:800;margin-bottom:4px}
.login-rest{color:var(--accent);font-weight:700;font-size:.95em;margin-bottom:16px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:.78em;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:1em;font-family:var(--font)}
.field input:focus{outline:none;border-color:var(--accent)}
.btn-entrar{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1em;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px}
.err{color:var(--red);font-size:.83em;margin-top:10px;min-height:18px}
#app{display:none}
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo-ph{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ea580c);display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0}
.header-nome{font-weight:800;font-size:1em}
.header-mesa{font-size:.75em;color:var(--text3);margin-top:1px}
.btn-chamar{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:7px 14px;font-size:.78em;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:65px;z-index:99}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:.82em;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:var(--font)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;font-size:.75em;font-weight:700;margin-left:3px}
.page{display:none;padding:14px;animation:fadeUp .3s ease}
.page.active{display:block}
.cats-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 0;scrollbar-width:none}
.cats-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:7px 16px;border-radius:20px;background:var(--surface2);color:var(--text2);font-size:.82em;font-weight:600;cursor:pointer;border:1px solid var(--border);transition:all .2s;font-family:var(--font)}
.cat-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-title{font-size:.75em;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;display:flex;align-items:stretch;min-height:100px;cursor:pointer;transition:border-color .2s;animation:fadeUp .3s ease}
.item-card:hover{border-color:rgba(249,115,22,.4)}
.item-body{flex:1;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.item-name{font-weight:700;font-size:.92em;line-height:1.3}
.item-desc{font-size:.76em;color:var(--text3);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-tempo{font-size:.72em;color:var(--text3);margin-top:5px}
.item-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.item-price{font-size:1em;font-weight:800;color:var(--accent)}
.item-img-wrap{width:110px;flex-shrink:0;overflow:hidden}
.item-img-wrap img{width:100%;height:100%;object-fit:cover}
.item-img-ph{width:110px;flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2em}
.btn-add{background:var(--accent);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.3em;cursor:pointer;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.btn-add:active{transform:scale(.88)}
.carrinho-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.carrinho-vazio{text-align:center;color:var(--text3);padding:50px 20px;font-size:.9em;line-height:2}
.total-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px}
.total-val{font-size:1.8em;font-weight:800;color:var(--green);margin:6px 0}
.btn-pedir{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1em;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:12px}
.btn-pedir:disabled{background:var(--surface3);color:var(--text3);cursor:not-allowed}
.conta-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.conta-status{font-size:.72em;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.total-conta{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-top:16px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 20px;border-radius:20px;font-size:.85em;font-weight:600;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlayOk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:32px}
#overlayOk.show{display:flex}

/* ── Modal histórico pessoa ── */
#modalHistoricoPessoa{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:flex-end;justify-content:center}
#modalHistoricoPessoa.open{display:flex}
.mhp-box{background:#141414;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px}
.mhp-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}

/* ── Modal histórico pessoa ── */
#modalHistoricoPessoa{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:flex-end;justify-content:center}
#modalHistoricoPessoa.open{display:flex}
.mhp-box{background:#141414;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px}
.mhp-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div style="color:var(--text3);font-size:.85em">Carregando cardápio...</div></div>
<div id="loginWrap" style="display:none">
  <div class="login-box">
    <div class="login-logo-ph" id="loginLogoWrap">🍽️</div>
    <h2 id="loginNomeRest">Bem-vindo!</h2>
    <div class="login-rest" id="loginSubtitle">Faça seu pedido</div>
    <div class="field"><label>Número da Mesa</label><input id="inputMesa" type="number" placeholder="Ex: 5" inputmode="numeric"></div>
    <div class="field"><label>Seu Nome</label><input id="inputNome" type="text" placeholder="Ex: João"></div>
    <button class="btn-entrar" onclick="entrar()">Entrar 🚀</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-logo-ph" id="appLogoWrap">🍽️</div>
        <div>
          <div class="header-nome" id="nomeRest">Restaurante</div>
          <div class="header-mesa" id="infoMesa"></div>
        </div>
      </div>
      <button class="btn-chamar" onclick="chamarGarcom()">🔔 Chamar</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-cardapio" onclick="mudarTab('cardapio')">🍔 Cardápio</div>
    <div class="tab" id="tab-carrinho" onclick="mudarTab('carrinho')">🛒<span class="badge" id="badgeCarrinho" style="display:none">0</span></div>
    <div class="tab" id="tab-conta" onclick="mudarTab('conta')">🧾 Conta</div>
  </div>
  <div id="pg-cardapio" class="page active">
    <div class="cats-scroll" id="catsScroll"></div>
    <div id="listaCardapio"></div>
  </div>
  <div id="pg-carrinho" class="page">
    <div id="listaCarrinho"><div class="carrinho-vazio">🛒<br>Carrinho vazio<br><small>Adicione itens do cardápio</small></div></div>
    <div class="total-box" id="totalBox" style="display:none">
      <div style="color:var(--text2);font-size:.85em">Total do pedido</div>
      <div class="total-val" id="totalVal">R$ 0,00</div>
      <button class="btn-pedir" id="btnPedir" onclick="enviarPedido()">✅ Enviar Pedido para Cozinha</button>
    </div>
  </div>
  <div id="pg-conta" class="page">
    <div id="listaConta"><div class="carrinho-vazio">🧾<br>Nenhum pedido ainda</div></div>
  </div>
</div>
<div id="overlayOk">
  <div style="font-size:3.5em;margin-bottom:16px">🎉</div>
  <div style="font-weight:800;font-size:1.3em;margin-bottom:8px">Pedido enviado!</div>
  <div style="color:var(--text2);font-size:.9em;margin-bottom:8px">Tempo estimado:</div>
  <div style="font-size:2.2em;font-weight:800;color:var(--accent)" id="overlayTempo">~20 min</div>
  <button onclick="fecharOverlay()" style="margin-top:24px;padding:14px 32px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1em;font-weight:700;cursor:pointer;font-family:var(--font)">Ver minha conta</button>
</div>
<div id="toast"></div>
<script src="/js/rebeca-realtime.js"></script>
<script>
const API='/api/delivery';
let adminSlug=new URLSearchParams(location.search).get('r')||'';
let mesa='',nomeCliente='',cardapio=[],carrinho=[];
let _adminId='',_logo='';
(async function(){
  try{
    const r=await fetch(API+'/mesa/cardapio?r='+adminSlug);
    const d=await r.json();
    if(d.sucesso){
      _logo=d.logo||'';_adminId=d.adminId||'';cardapio=d.itens||[];
      const nome=d.nomeEstabelecimento||'Bem-vindo!';
      document.getElementById('loginNomeRest').textContent=nome;
      document.getElementById('loginSubtitle').textContent=d.tipoNegocio||'Faça seu pedido';
      if(_logo){
        const wrap=document.getElementById('loginLogoWrap');
        wrap.className='';wrap.style.cssText='margin:0 auto 12px;width:70px;height:70px';
        const img=document.createElement('img');
        img.src=_logo;img.className='login-logo';
        img.onerror=()=>{wrap.innerHTML='🍽️';wrap.className='login-logo-ph';};
        wrap.innerHTML='';wrap.appendChild(img);
      }
    }
  }catch(e){}
  document.getElementById('loading').style.display='none';
  const sm=sessionStorage.getItem('mesa_num'),sn=sessionStorage.getItem('mesa_nome'),ss=sessionStorage.getItem('mesa_slug');
  if(sm&&sn&&ss===adminSlug&&cardapio.length){mesa=sm;nomeCliente=sn;mostrarApp();}
  else document.getElementById('loginWrap').style.display='flex';
})();
async function entrar(){
  const m=document.getElementById('inputMesa').value.trim();
  const n=document.getElementById('inputNome').value.trim();
  const err=document.getElementById('loginErr');err.textContent='';
  if(!m){err.textContent='Informe o número da mesa';return;}
  if(!n){err.textContent='Informe seu nome';return;}
  if(!adminSlug){err.textContent='QR Code inválido';return;}
  if(!cardapio.length){
    try{
      const r=await fetch(API+'/mesa/cardapio?r='+adminSlug);
      const d=await r.json();
      if(!d.sucesso){err.textContent=d.erro||'Restaurante não encontrado';return;}
      cardapio=d.itens||[];_adminId=d.adminId||'';_logo=d.logo||'';
    }catch(e){err.textContent='Erro de conexão';return;}
  }
  mesa=m;nomeCliente=n;
  sessionStorage.setItem('mesa_num',m);sessionStorage.setItem('mesa_nome',n);sessionStorage.setItem('mesa_slug',adminSlug);
  // Marcar mesa como ocupada no backend
  try {
    await fetch(API+'/mesa/entrar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminSlug,adminId:_adminId,mesa:m,nomeCliente:n})});
  } catch(e){}
  document.getElementById('loginWrap').style.display='none';
  mostrarApp();
}
function mostrarApp(){
  document.getElementById('nomeRest').textContent=document.getElementById('loginNomeRest').textContent;
  document.getElementById('infoMesa').textContent='Mesa '+mesa+' · Olá, '+nomeCliente+'!';
  if(_logo){
    const wrap=document.getElementById('appLogoWrap');
    wrap.className='';
    wrap.style.cssText='width:38px;height:38px;border-radius:10px;border:2px solid var(--accent);overflow:hidden;flex-shrink:0';
    const img=document.createElement('img');
    img.src=_logo;img.style.cssText='width:100%;height:100%;object-fit:cover';
    img.onerror=()=>{wrap.innerHTML='🍽️';wrap.className='header-logo-ph';};
    wrap.innerHTML='';wrap.appendChild(img);
  }
  document.getElementById('app').style.display='block';
  renderCardapio();carregarConta();
  setTimeout(conectarSSECardapio, 1000);
}
let catAtiva='todos';
function renderCardapio(){
  const cats={};
  cardapio.forEach(i=>{const cat=i.categoriaId?.nome||i.categoria||'Outros';if(!cats[cat])cats[cat]=[];cats[cat].push(i);});
  const nomes=Object.keys(cats);
  document.getElementById('catsScroll').innerHTML='<div class="cat-pill active" onclick="filtrarCat(\'todos\',this)">Todos</div>'+
    nomes.map(c=>'<div class="cat-pill" onclick="filtrarCat(\''+c.replace(/'/g,"\\'")+"',this)\">"+c+'</div>').join('');
  renderItens(cats);
}
function filtrarCat(cat,el){
  catAtiva=cat;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');
  const cats={};cardapio.forEach(i=>{const c=i.categoriaId?.nome||i.categoria||'Outros';if(!cats[c])cats[c]=[];cats[c].push(i);});
  renderItens(cat==='todos'?cats:{[cat]:cats[cat]||[]});
}
function renderItens(cats){
  const el=document.getElementById('listaCardapio');
  if(!cardapio.length){el.innerHTML='<div class="carrinho-vazio">Cardápio não disponível</div>';return;}
  el.innerHTML=Object.entries(cats).map(([cat,itens])=>{
    const disponiveis = itens.filter(i => i.disponivel !== false && i.ativo !== false);
    const esgotados   = itens.filter(i => i.disponivel === false || i.ativo === false);
    const renderItem  = (i, esgotado) => {
      const foto  = i.imagem||i.foto||'';
      const preco = 'R$ '+Number(i.preco||0).toFixed(2).replace('.',',');
      const tempo = i.tempoPreparoMin||20;
      const estoque = i.estoqueAtivo && i.estoqueAtual >= 0 ? i.estoqueAtual : null;
      const d = encodeURIComponent(JSON.stringify({_id:i._id,nome:i.nome,preco:i.preco||0,imagem:foto,descricao:i.descricao||'',tempoPreparoMin:tempo}));
      const imgHtml = foto ? '<div class="item-img-wrap"><img src="'+foto+'" loading="lazy" onerror="this.style.display=\'none\'"></div>' : '';
      if (esgotado) {
        return '<div class="item-card" style="opacity:.45;pointer-events:none;filter:grayscale(1)">'
          + '<div class="item-body">'
          + '<div>'
          + '<div class="item-name" style="text-decoration:line-through">'+i.nome+'</div>'
          + (i.descricao?'<div class="item-desc">'+i.descricao+'</div>':'')
          + '</div>'
          + '<div class="item-footer">'
          + '<div class="item-price" style="color:#888">'+preco+'</div>'
          + '<span style="background:#fee2e2;color:#ef4444;border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700">Esgotado</span>'
          + '</div>'
          + '</div>'
          + imgHtml
          + '</div>';
      }
      return '<div class="item-card" data-item="'+d+'" onclick="abrirItemEl(this)">'
        + '<div class="item-body">'
        + '<div>'
        + '<div class="item-name">'+i.nome+'</div>'
        + (i.descricao?'<div class="item-desc">'+i.descricao+'</div>':'')
        + '<div class="item-tempo">&#x23F1;&#xFE0F; ~'+tempo+' min'+(estoque!==null&&estoque<=10?'&nbsp;&middot;&nbsp;<span style="color:#f59e0b;font-weight:700">&#x26A0;&#xFE0F; &Uacute;ltimas '+estoque+' unid.</span>':'')+'</div>'
        + '</div>'
        + '<div class="item-footer">'
        + '<div class="item-price">'+preco+'</div>'
        + '<button class="btn-add" data-item="'+d+'" onclick="event.stopPropagation();addCarrinhoEl(this)">+</button>'
        + '</div>'
        + '</div>'
        + imgHtml
        + '</div>';
    };
    return '<div class="cat-title">'+cat+'</div>'+
      disponiveis.map(i=>renderItem(i,false)).join('')+
      (esgotados.length?'<div style="font-size:.7em;color:#555;margin:8px 0 4px;letter-spacing:1px">ESGOTADOS</div>'+esgotados.map(i=>renderItem(i,true)).join(''):'');
  }).join('');
}


function abrirItemEl(el){
  try{abrirItem(JSON.parse(decodeURIComponent(el.dataset.item)));}catch(e){console.error(e);}
}
function addCarrinhoEl(el){
  try{addCarrinho(JSON.parse(decodeURIComponent(el.dataset.item)));}catch(e){console.error(e);}
}
function abrirItem(item){
  const foto=item.imagem||item.foto||'';
  const modal=document.createElement('div');
  modal.id='modalItem';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML='<div style="background:#141414;border-radius:20px 20px 0 0;width:100%;max-width:480px;overflow:hidden">'+
    (foto?'<img src="'+foto+'" style="width:100%;height:210px;object-fit:cover">':'<div style="height:120px;background:#1c1c1c;display:flex;align-items:center;justify-content:center;font-size:3em">🍽️</div>')+
    '<div style="padding:20px">'+
      '<div style="font-weight:800;font-size:1.1em">'+item.nome+'</div>'+
      (item.descricao?'<div style="color:#999;font-size:.85em;margin-top:6px;line-height:1.5">'+item.descricao+'</div>':'')+
      '<div style="font-size:.75em;color:#555;margin-top:6px">⏱️ ~'+(item.tempoPreparoMin||20)+' min</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">'+
        '<div style="font-size:1.4em;font-weight:800;color:#f97316">R$ '+Number(item.preco||0).toFixed(2).replace('.',',')+'</div>'+
        '<button onclick="addCarrinho('+JSON.stringify(item).replace(/"/g,"'").replace(/'/g,"&#39;")+");document.getElementById('modalItem').remove()\" style=\"background:#f97316;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:700;font-size:.9em;cursor:pointer\">+ Adicionar</button>"+
      '</div>'+
      '<button onclick="document.getElementById(\'modalItem\').remove()" style="width:100%;margin-top:10px;padding:12px;background:#222;border:none;color:#888;border-radius:10px;font-size:.88em;cursor:pointer">Fechar</button>'+

async function enviarChamada(motivo) {

async function carregarConta(){
  if(!mesa||!adminSlug)return;
  try{
    const r=await fetch(API+'/mesa/conta?r='+adminSlug+'&mesa='+mesa);
    const d=await r.json();
    const el=document.getElementById('listaConta');
    if(!d.pedidos||!d.pedidos.length){
      el.innerHTML='<div class="carrinho-vazio">🧾<br>Nenhum pedido ainda nesta mesa</div>';
      return;
    }

    const statusIcon={novo:'🆕',confirmado:'✅',preparando:'🍳',pronto:'🔔',entregue:'📦',pago:'💰',cancelado:'❌'};
    const statusLabel={novo:'Recebido',confirmado:'Confirmado',preparando:'Preparando',pronto:'Pronto p/ servir',entregue:'Entregue',pago:'Pago',cancelado:'Cancelado'};

    // ── Agrupar por pessoa ──────────────────────────────────────
    const porPessoa = {};
    let totalMesa = 0;

    d.pedidos.forEach(p => {
      if(p.status==='cancelado') return;
      const nome = p.clienteNome || p.nomeComanda || p.nomeCliente || 'Cliente';
      if(!porPessoa[nome]) porPessoa[nome] = { pedidos:[], total:0 };
      porPessoa[nome].pedidos.push(p);
      porPessoa[nome].total += (p.total||0);
      totalMesa += (p.total||0);
    });

    // Cache para o modal de histórico individual
    window._dadosMesa = {};
    const cores = ['#f97316','#3b82f6','#22c55e','#a855f7','#ec4899','#14b8a6'];
    Object.entries(porPessoa).forEach(([nome, dados], idx) => {
      window._dadosMesa[nome] = { ...dados, cor: cores[idx % cores.length] };
    });
    const pessoas = Object.entries(porPessoa);

    let html = '';

    // ── Cabeçalho resumo da mesa ───────────────────────────────
    html += `
    <div style="background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:800;font-size:1em">🪑 Mesa ${mesa}</div>
        <div style="font-size:.75em;color:#888">${pessoas.length} pessoa${pessoas.length!==1?'s':''} · ${d.pedidos.filter(p=>p.status!=='cancelado').length} pedido${d.pedidos.length!==1?'s':''}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${Math.min(pessoas.length,3)},1fr);gap:8px;margin-bottom:12px">
        ${pessoas.map(([nome,dados],idx)=>`
          <div onclick="verHistoricoPessoa('${encodeURIComponent(nome)}')" style="background:#111;border:1px solid ${cores[idx%cores.length]}33;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor='${cores[idx%cores.length]}'" onmouseout="this.style.borderColor='${cores[idx%cores.length]}33'">
            <div style="font-size:1.3em">👤</div>
            <div style="font-size:.78em;font-weight:700;color:${cores[idx%cores.length]};margin-top:3px;word-break:break-word">${nome}</div>
            <div style="font-size:.85em;font-weight:800;color:#fff;margin-top:4px">R$ ${dados.total.toFixed(2)}</div>
            <div style="font-size:.65em;color:#555;margin-top:3px">toque p/ ver</div>
          </div>`).join('')}
      </div>
      <div style="border-top:1px solid #333;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:.82em;color:#aaa">Total da mesa</div>
        <div style="font-size:1.5em;font-weight:800;color:#22c55e">R$ ${totalMesa.toFixed(2)}</div>
      </div>
    </div>`;

    // ── Cards por pessoa ───────────────────────────────────────
    pessoas.forEach(([nome, dados], idx) => {
      const cor = cores[idx % cores.length];
      html += `
      <div style="background:#111;border:2px solid ${cor}44;border-radius:14px;padding:14px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div onclick="verHistoricoPessoa('${encodeURIComponent(nome)}')" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <div style="width:32px;height:32px;border-radius:50%;background:${cor}22;border:2px solid ${cor};display:flex;align-items:center;justify-content:center;font-size:.9em">👤</div>
            <div style="font-weight:800;font-size:.95em;color:${cor}">${nome} <span style="font-size:.65em;color:#555">▶ histórico</span></div>
          </div>
          <div style="font-size:.9em;font-weight:800;color:#fff">R$ ${dados.total.toFixed(2)}</div>
        </div>`;

      // Pedidos desta pessoa
      dados.pedidos.forEach(p => {
        const hora = new Date(p.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        const stIcon = statusIcon[p.status] || '•';
        const stLabel = statusLabel[p.status] || p.status;
        const stCor = p.status==='pronto'||p.status==='entregue'?'#22c55e':p.status==='preparando'?'#f59e0b':'#888';

        html += `
        <div style="background:#1a1a1a;border-radius:10px;padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:.72em;color:#555">Pedido #${p.numero||'?'} · ${hora}</div>
            <div style="font-size:.72em;font-weight:700;color:${stCor}">${stIcon} ${stLabel}</div>
          </div>`;

        (p.itens||[]).forEach(it => {
          const sub = ((it.precoUnitario||0)*(it.quantidade||1)).toFixed(2);
          html += `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #222">
            <div>
              <span style="font-size:.85em;font-weight:600">${it.quantidade}x ${it.nome}</span>
              ${it.observacao?`<div style="font-size:.72em;color:#888">↳ ${it.observacao}</div>`:''}
            </div>
            <span style="font-size:.82em;color:#aaa">R$ ${sub}</span>
          </div>`;
        });

        html += `
          <div style="display:flex;justify-content:flex-end;margin-top:6px">
            <span style="font-size:.8em;font-weight:700;color:#fff">Subtotal: R$ ${(p.total||0).toFixed(2)}</span>
          </div>
        </div>`;
      });

      html += `
        <div style="border-top:1px solid ${cor}33;padding-top:8px;display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:.78em;color:#888">Total de ${nome}</div>
          <div style="font-size:1.1em;font-weight:800;color:${cor}">R$ ${dados.total.toFixed(2)}</div>
        </div>
      </div>`;
    });

    // ── Botão fechar conta ─────────────────────────────────────
    html += `
    <div style="background:#111;border:1px solid #333;border-radius:14px;padding:16px;text-align:center">
      <div style="font-size:.8em;color:#888;margin-bottom:8px">O garçom virá até sua mesa para fechar a conta</div>
      <button id="btnPedirConta" onclick="pedirConta()" style="width:100%;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:10px;color:#fff;font-weight:800;font-size:.95em;cursor:pointer">
        💰 Pedir a Conta — R$ ${totalMesa.toFixed(2)}
      </button>
    </div>`;

    el.innerHTML = html;
  }catch(e){console.error(e);}
}

function mudarTab(tab){

function verHistoricoPessoa(nomeEnc) {
  const nome = decodeURIComponent(nomeEnc);
  const modal = document.getElementById('modalHistoricoPessoa');
  const conteudo = document.getElementById('mhp-conteudo');
  
  // Buscar dados do _dadosMesa (cache da última carregarConta)
  const dados = window._dadosMesa && window._dadosMesa[nome];
  if (!dados) { modal.classList.add('open'); conteudo.innerHTML='<div style="text-align:center;color:#888;padding:20px">Sem dados</div>'; return; }

  const statusIcon={novo:'🆕',confirmado:'✅',preparando:'🍳',pronto:'🔔',entregue:'📦',pago:'💰'};
  const statusLabel={novo:'Recebido',confirmado:'Confirmado',preparando:'Preparando',pronto:'Pronto p/ servir',entregue:'Entregue',pago:'Pago'};
  const cor = dados.cor || '#f97316';

  let html = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="width:40px;height:40px;border-radius:50%;background:${cor}22;border:2px solid ${cor};display:flex;align-items:center;justify-content:center;font-size:1.1em">👤</div>
      <div>
        <div style="font-weight:800;font-size:1.05em;color:${cor}">${nome}</div>
        <div style="font-size:.75em;color:#888">${dados.pedidos.length} pedido${dados.pedidos.length!==1?'s':''} · Mesa ${mesa}</div>
      </div>
      <button onclick="document.getElementById('modalHistoricoPessoa').classList.remove('open')" style="margin-left:auto;background:#222;border:none;border-radius:50%;width:32px;height:32px;color:#aaa;font-size:1em;cursor:pointer">✕</button>
    </div>`;

  // Todos os itens pedidos por esta pessoa (linha do tempo)
  dados.pedidos.forEach(p => {
    const hora = new Date(p.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const stIcon = statusIcon[p.status] || '•';
    const stLabel = statusLabel[p.status] || p.status;
    const stCor = p.status==='pronto'||p.status==='entregue'?'#22c55e':p.status==='preparando'?'#f59e0b':'#666';

    html += `
    <div style="background:#1a1a1a;border-radius:12px;padding:12px;margin-bottom:10px;border-left:3px solid ${cor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:.72em;color:#555">🕐 ${hora} — Pedido #${p.numero||'?'}</div>
        <div style="font-size:.72em;font-weight:700;color:${stCor}">${stIcon} ${stLabel}</div>
      </div>`;

    (p.itens||[]).forEach(it => {
      const sub = ((it.precoUnitario||0)*(it.quantidade||1)).toFixed(2);
      html += `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2a2a2a">
        <div>
          <span style="font-size:.88em;font-weight:600">${it.quantidade}x ${it.nome}</span>
          ${it.observacao?`<div style="font-size:.72em;color:#888">↳ ${it.observacao}</div>`:''}
        </div>
        <span style="font-size:.82em;color:#aaa;flex-shrink:0;margin-left:8px">R$ ${sub}</span>
      </div>`;
    });

    html += `
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <span style="font-size:.78em;color:#aaa">Subtotal: <b style="color:#fff">R$ ${(p.total||0).toFixed(2)}</b></span>
      </div>
    </div>`;
  });

  // Total desta pessoa
  html += `
    <div style="background:${cor}15;border:1px solid ${cor}44;border-radius:12px;padding:14px;text-align:center;margin-top:4px">
      <div style="font-size:.8em;color:#aaa;margin-bottom:4px">Total a pagar — ${nome}</div>
      <div style="font-size:1.8em;font-weight:800;color:${cor}">R$ ${dados.total.toFixed(2)}</div>
    </div>`;

  conteudo.innerHTML = html;
  modal.classList.add('open');
}

async function recarregarCardapio() {
  if (!adminSlug) return;
  try {
    const r = await fetch(API + '/mesa/cardapio?r=' + adminSlug);
    const d = await r.json();
    if (d.sucesso && d.itens) {
      cardapio = d.itens;
      renderCardapio();
    }
  } catch(e) {}
}

// SSE para atualização instantânea quando admin editar cardápio
function conectarSSECardapio() {
  if (!_adminId) return;
  try {
    const es = new EventSource(API + '/sse?adminId=' + _adminId);
    es.addEventListener('cardapio_atualizado', function() {
      recarregarCardapio();
    });
    es.onerror = function() {
      setTimeout(conectarSSECardapio, 8000);
      es.close();
    };
  } catch(e) {}
}
