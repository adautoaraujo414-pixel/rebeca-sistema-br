<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozinha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d0d0f;color:#fff;min-height:100vh}
.header{background:#111;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f97316;position:sticky;top:0;z-index:100}
.header h1{font-size:1.2em;color:#f97316;font-weight:800;letter-spacing:1px}
.header-right{display:flex;gap:10px;align-items:center}
.btn-som{background:transparent;border:1px solid #f97316;color:#f97316;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.82em;font-weight:600}
.badge-total{background:#f97316;color:#fff;padding:5px 14px;border-radius:20px;font-weight:800;font-size:1em}
.tabs{display:flex;background:#111;border-bottom:1px solid #222;position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:13px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;font-size:.9em;color:#555;transition:.2s}
.tab.active{border-bottom-color:#f97316;color:#f97316}
.tab .ct{background:#f97316;color:#fff;padding:2px 7px;border-radius:10px;font-size:.75em;margin-left:5px}
.tab.tab-prep .ct{background:#f59e0b}
.tab.tab-pronto .ct{background:#22c55e}
.lista{padding:12px;max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.vazio{text-align:center;padding:80px 20px;color:#333;font-size:1.1em;grid-column:1/-1}

/* CARD */
.card{background:#18181b;border-radius:14px;border-left:5px solid #f97316;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s}
.card.preparando{border-left-color:#f59e0b}
.card.pronto{border-left-color:#22c55e}
.card.urgente{box-shadow:0 0 0 2px #ef4444;animation:pulseCard 1s infinite}
@keyframes pulseCard{0%,100%{box-shadow:0 0 0 2px #ef4444}50%{box-shadow:0 0 0 4px #ef444488}}

.card-head{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:1px solid #222}
.card-num{font-size:1.3em;font-weight:900;color:#f97316}
.card.preparando .card-num{color:#f59e0b}
.card.pronto .card-num{color:#22c55e}
.card-info{flex:1}
.card-origem{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tag-mesa{background:#f97316;color:#fff;padding:3px 10px;border-radius:6px;font-size:.78em;font-weight:800}
.tag-delivery{background:#3b82f6;color:#fff;padding:3px 10px;border-radius:6px;font-size:.78em;font-weight:800}
.tag-balcao{background:#8b5cf6;color:#fff;padding:3px 10px;border-radius:6px;font-size:.78em;font-weight:800}
.tag-status{padding:3px 10px;border-radius:6px;font-size:.75em;font-weight:700}
.tag-novo{background:#f97316;color:#fff}
.tag-preparando{background:#f59e0b;color:#000}
.tag-pronto{background:#22c55e;color:#fff}
.card-garcom{font-size:.78em;color:#888;margin-top:2px}

/* CRONÔMETRO */
.cronometro{text-align:right;min-width:60px}
.crono-time{font-size:1.4em;font-weight:900;font-family:monospace;color:#22c55e}
.crono-time.amarelo{color:#f59e0b}
.crono-time.vermelho{color:#ef4444}
.crono-label{font-size:.65em;color:#555;text-align:center;margin-top:1px}

/* ITENS */
.card-body{padding:10px 14px;flex:1}
.item-row{padding:7px 0;border-bottom:1px solid #222;display:flex;flex-direction:column;gap:3px}
.item-row:last-child{border:none}
.item-top{display:flex;justify-content:space-between;align-items:center}
.item-nome{font-weight:700;font-size:.92em}
.item-qtd{background:#f97316;color:#fff;border-radius:5px;padding:2px 7px;font-size:.78em;font-weight:800;white-space:nowrap}
.item-complemento{font-size:.78em;color:#f59e0b;padding-left:6px;border-left:2px solid #f59e0b;margin-top:2px}
.item-adicional{font-size:.78em;color:#34d399;padding-left:6px;border-left:2px solid #34d399;margin-top:1px}
.item-remover{font-size:.78em;color:#ef4444;padding-left:6px;border-left:2px solid #ef4444;margin-top:1px}
.item-obs{font-size:.78em;color:#f97316;font-style:italic;padding-left:6px;border-left:2px solid #f97316;margin-top:1px}

/* OBS GERAL */
.obs-geral{background:#1f1500;border:1px solid #f59e0b;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.82em;color:#f59e0b}
.obs-geral::before{content:'⚠️ ';font-style:normal}

/* FOOTER */
.card-foot{padding:10px 14px 12px;border-top:1px solid #222;display:flex;flex-direction:column;gap:8px}
.foot-info{display:flex;justify-content:space-between;align-items:center;font-size:.82em;color:#666}
.foot-cliente{color:#aaa}
.foot-pgto{color:#888}
.foot-total{font-weight:800;color:#22c55e;font-size:1em}
.btns{display:flex;gap:7px;flex-wrap:wrap}
.btn{padding:9px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85em;flex:1;transition:.15s}
.btn:active{transform:scale(.95)}
.btn-iniciar{background:#f59e0b;color:#000}
.btn-pronto{background:#22c55e;color:#fff}
.btn-despachar{background:#3b82f6;color:#fff}
.btn-rejeitar{background:transparent;border:1px solid #ef4444;color:#ef4444;flex:0;padding:9px 12px}

/* NOTIF */
.notif{position:fixed;top:0;left:0;right:0;background:#f97316;color:#fff;padding:16px;text-align:center;font-weight:800;font-size:1em;z-index:9999;display:none;cursor:pointer;animation:pulseNotif .7s infinite}
@keyframes pulseNotif{0%,100%{opacity:1}50%{opacity:.7}}

/* HORA PEDIDO */
.hora-pedido{font-size:.72em;color:#444;margin-top:3px}
</style>
</head>
<body>

<div class="notif" id="notif" onclick="this.style.display='none'">🔔 NOVO PEDIDO! Toque para fechar</div>

<div class="header">
  <h1>👨‍🍳 COZINHA</h1>
  <div class="header-right">
    <button class="btn-som" id="btnSom" onclick="toggleSom()">🔔 Som ON</button>
    <div class="badge-total" id="badgeTotal">0</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-novos" onclick="mudarTab('novos')">Novos <span class="ct" id="ct-novos">0</span></div>
  <div class="tab tab-prep" id="tab-preparando" onclick="mudarTab('preparando')">Preparando <span class="ct" id="ct-preparando">0</span></div>
  <div class="tab tab-pronto" id="tab-pronto" onclick="mudarTab('pronto')">Prontos <span class="ct" id="ct-pronto">0</span></div>
</div>

<div class="lista" id="lista"><div class="vazio">🍳 Nenhum pedido</div></div>

<script>
var TK = new URLSearchParams(location.search).get('token') || localStorage.getItem('cozinha_token');
var B = '/api/delivery';
var tabAtual = 'novos';
var somAtivo = true;
var pedidosAnteriores = new Set();
var timers = {};
var todosPedidos = [];

if(!TK) {
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0d0f;color:#aaa;font-family:sans-serif;flex-direction:column;gap:16px"><span style="font-size:2em">🔒</span><p>Token inválido.</p><a href="/delivery-admin" style="color:#f97316;text-decoration:none;border:1px solid #f97316;padding:8px 20px;border-radius:8px;">Ir para o painel</a></div>';
} else {
  localStorage.setItem('cozinha_token', TK);
  carregar();
  setInterval(carregar, 5000);
  setInterval(atualizarCronometros, 1000);
}

function toggleSom() {
  somAtivo = !somAtivo;
  document.getElementById('btnSom').textContent = somAtivo ? '🔔 Som ON' : '🔕 Som OFF';
}

function mudarTab(t) {
  tabAtual = t;
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + t).classList.add('active');
  renderizar();
}

function bip() {
  if(!somAtivo) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 150, 300].forEach(function(delay) {
      setTimeout(function() {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        o.start(); o.stop(ctx.currentTime + 0.2);
      }, delay);
    });
  } catch(e) {}
}

async function carregar() {
  try {
    var r = await fetch(B + '/cozinha/pedidos', { headers: { 'Authorization': 'Bearer ' + TK } });
    var dados = await r.json();
    if(!Array.isArray(dados)) return;
    todosPedidos = dados;

    var ids = new Set(dados.map(function(p) { return p._id; }));
    var novos = dados.filter(function(p) { return !pedidosAnteriores.has(p._id) && p.status === 'novo'; });
    if(novos.length > 0 && pedidosAnteriores.size > 0) {
      bip();
      var n = document.getElementById('notif');
      n.style.display = 'block';
      setTimeout(function() { n.style.display = 'none'; }, 5000);
    }
    pedidosAnteriores = ids;

    var nov = dados.filter(function(p) { return p.status === 'novo'; }).length;
    var prep = dados.filter(function(p) { return p.status === 'preparando'; }).length;
    var pron = dados.filter(function(p) { return p.status === 'pronto'; }).length;
    document.getElementById('ct-novos').textContent = nov;
    document.getElementById('ct-preparando').textContent = prep;
    document.getElementById('ct-pronto').textContent = pron;
    document.getElementById('badgeTotal').textContent = nov + prep;
    renderizar();
  } catch(e) {}
}

function renderizar() {
  var filtro = { novos: 'novo', preparando: 'preparando', pronto: 'pronto' }[tabAtual];
  var lista = todosPedidos.filter(function(p) { return p.status === filtro; });
  lista.sort(function(a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });

  var el = document.getElementById('lista');
  if(!lista.length) { el.innerHTML = '<div class="vazio">🍳 Nenhum pedido</div>'; return; }

  el.innerHTML = lista.map(function(p) { return renderCard(p); }).join('');
}

function renderCard(p) {
  var agora = Date.now();
  var criado = new Date(p.createdAt).getTime();
  var segs = Math.floor((agora - criado) / 1000);
  var urgente = segs > 900; // 15 min
  var corCrono = segs < 300 ? '' : segs < 600 ? 'amarelo' : 'vermelho';

  var origemTag = '';
  if(p.tipoLocal === 'mesa') origemTag = '<span class="tag-mesa">🍽️ MESA ' + (p.numeroMesa || p.mesa || '?') + '</span>';
  else if(p.tipoLocal === 'delivery' || p.tipo === 'delivery') origemTag = '<span class="tag-delivery">🛵 DELIVERY</span>';
  else origemTag = '<span class="tag-balcao">🏪 BALCÃO</span>';

  var statusTag = '<span class="tag-status tag-' + p.status + '">' + {novo:'NOVO',preparando:'PREPARANDO',pronto:'PRONTO'}[p.status] + '</span>';

  var garcomInfo = p.garcom ? '<div class="card-garcom">👤 ' + p.garcom + '</div>' : '';

  var horaStr = new Date(p.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  // Itens
  var itensHtml = (p.itens || []).map(function(it) {
    var comps = '';
    if(it.complementos && it.complementos.length) {
      comps += it.complementos.map(function(c) {
        return '<div class="item-complemento">+ ' + c.nome + (c.preco ? ' (+R$' + Number(c.preco).toFixed(2) + ')' : '') + '</div>';
      }).join('');
    }
    if(it.adicionais && it.adicionais.length) {
      comps += it.adicionais.map(function(a) {
        return '<div class="item-adicional">➕ ' + a.nome + (a.preco ? ' (+R$' + Number(a.preco).toFixed(2) + ')' : '') + '</div>';
      }).join('');
    }
    if(it.remover && it.remover.length) {
      comps += it.remover.map(function(r) {
        return '<div class="item-remover">❌ SEM ' + r + '</div>';
      }).join('');
    }
    var obs = it.observacao || it.obs ? '<div class="item-obs">' + (it.observacao || it.obs) + '</div>' : '';
    return '<div class="item-row"><div class="item-top"><span class="item-nome">' + it.nome + '</span><span class="item-qtd">x' + (it.quantidade || it.qty || 1) + '</span></div>' + comps + obs + '</div>';
  }).join('');

  var obsGeral = (p.observacao || p.obs) ? '<div class="obs-geral">' + (p.observacao || p.obs) + '</div>' : '';

  // Botões
  var btns = '';
  if(p.status === 'novo') {
    btns = '<button class="btn btn-iniciar" onclick="acao(\'' + p._id + '\',\'preparando\')">▶ Iniciar Preparo</button>' +
           '<button class="btn btn-rejeitar" onclick="acao(\'' + p._id + '\',\'cancelado\')">✕</button>';
  } else if(p.status === 'preparando') {
    btns = '<button class="btn btn-pronto" onclick="acao(\'' + p._id + '\',\'pronto\')">✅ Marcar Pronto</button>' +
           '<button class="btn btn-rejeitar" onclick="acao(\'' + p._id + '\',\'cancelado\')">✕</button>';
  } else if(p.status === 'pronto') {
    var labelDesp = p.tipoLocal === 'mesa' ? '🍽️ Despachar p/ Mesa' : '🛵 Despachar p/ Entrega';
    btns = '<button class="btn btn-despachar" onclick="acao(\'' + p._id + '\',\'entregue\')">' + labelDesp + '</button>';
  }

  var clienteNome = p.cliente && p.cliente.nome ? p.cliente.nome : (p.nomeCliente || '');
  var pgto = {pix:'PIX',dinheiro:'Dinheiro',cartao:'Cartão',na_entrega:'Na entrega'}[p.formaPagamento] || p.formaPagamento || '';

  return '<div class="card ' + p.status + (urgente ? ' urgente' : '') + '" data-id="' + p._id + '" data-criado="' + p.createdAt + '">' +
    '<div class="card-head">' +
      '<div class="card-info">' +
        '<div class="card-origem">' + origemTag + statusTag + '</div>' +
        '<div style="font-size:.82em;color:#666;margin-top:3px">Pedido <strong style="color:#f97316">#' + (p.numero || p._id.slice(-4)) + '</strong> · <span class="hora-pedido">' + horaStr + '</span></div>' +
        garcomInfo +
      '</div>' +
      '<div class="cronometro"><div class="crono-time ' + corCrono + '" data-id="' + p._id + '">' + formatarTempo(segs) + '</div><div class="crono-label">tempo</div></div>' +
    '</div>' +
    '<div class="card-body">' + itensHtml + obsGeral + '</div>' +
    '<div class="card-foot">' +
      '<div class="foot-info"><span class="foot-cliente">' + (clienteNome || 'Cliente') + '</span><span class="foot-pgto">' + pgto + '</span><span class="foot-total">R$ ' + Number(p.total || 0).toFixed(2) + '</span></div>' +
      '<div class="btns">' + btns + '</div>' +
    '</div>' +
  '</div>';
}

function formatarTempo(segs) {
  var m = Math.floor(segs / 60);
  var s = segs % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function atualizarCronometros() {
  document.querySelectorAll('.crono-time[data-id]').forEach(function(el) {
    var card = el.closest('.card');
    if(!card) return;
    var criado = card.getAttribute('data-criado');
    if(!criado) return;
    var segs = Math.floor((Date.now() - new Date(criado).getTime()) / 1000);
    el.textContent = formatarTempo(segs);
    el.className = 'crono-time ' + (segs < 300 ? '' : segs < 600 ? 'amarelo' : 'vermelho');
    if(segs > 900) card.classList.add('urgente'); else card.classList.remove('urgente');
  });
}

async function acao(id, status) {
  try {
    await fetch(B + '/cozinha/pedido/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TK },
      body: JSON.stringify({ status: status })
    });
    await carregar();
  } catch(e) {}
}
</script>
</body>
</html>
