<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebeca Delivery - Cozinha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh}
.header{background:#1a1a2e;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6b35}
.header h1{font-size:1.3em;color:#ff6b35}
.badge{background:#ff6b35;color:#fff;padding:4px 12px;border-radius:20px;font-weight:bold}
.tabs{display:flex;background:#1a1a2e;border-bottom:1px solid #333}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab.active{border-bottom-color:#ff6b35;color:#ff6b35}
.tab .ct{background:#ff6b35;color:#fff;padding:2px 8px;border-radius:10px;font-size:.8em;margin-left:5px}
.pedidos{padding:10px;max-width:800px;margin:0 auto}
.card{background:#1a1a2e;border-radius:12px;padding:15px;margin-bottom:12px;border-left:4px solid #ff6b35}
.card.preparando{border-left-color:#f39c12}
.card.pronto{border-left-color:#00cc6a}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.num{font-size:1.2em;font-weight:bold;color:#ff6b35}
.tempo{font-size:.85em;color:#aaa}
.cliente{font-size:.9em;color:#ccc;margin-bottom:8px}
.itens{margin:10px 0}
.it{padding:6px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between}
.it:last-child{border:none}
.it-nome{font-weight:500}
.it-obs{color:#f39c12;font-size:.85em;font-style:italic}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #333}
.total{font-size:1.1em;font-weight:bold;color:#00cc6a}
.pgto{font-size:.85em;color:#aaa}
.end{font-size:.85em;color:#87ceeb;margin-top:5px}
.bebida{background:#1a3a5c;padding:6px 10px;border-radius:8px;margin-top:8px;font-size:.85em;color:#87ceeb}
.obs-card{background:#2a1a0d;border:1px solid #f39c12;padding:6px 10px;border-radius:8px;margin-top:8px;font-size:.85em;color:#f39c12}
.btn{padding:10px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:.95em}
.btn:active{transform:scale(.95)}
.btn-ok{background:#00cc6a;color:#fff}
.btn-pronto{background:#f39c12;color:#fff}
.btn-rej{background:#c0392b;color:#fff;font-size:.85em;padding:8px 14px}
.btns{display:flex;gap:8px}
.vazio{text-align:center;padding:60px 20px;color:#666}
.tag{padding:3px 10px;border-radius:10px;font-size:.8em;font-weight:bold}
.tag-novo{background:#ff6b35;color:#fff}
.tag-preparando{background:#f39c12;color:#fff}
.tag-pronto{background:#00cc6a;color:#fff}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.troco{background:#f39c12;color:#000;padding:4px 8px;border-radius:6px;font-size:.85em;font-weight:bold;margin-top:5px;display:inline-block}
.notif-banner{position:fixed;top:0;left:0;right:0;background:#ff6b35;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:16px;z-index:9999;display:none;cursor:pointer;animation:pulse .8s infinite}
.som-btn{background:none;border:1px solid #666;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.urgente{background:#2a0d0d;border:1px solid #ff4444;padding:6px 10px;border-radius:8px;margin-top:8px;font-size:.85em;color:#ff6666;font-weight:bold}
</style>
</head>
<body>
<div id="notifBanner" class="notif-banner" onclick="this.style.display='none';filtrar('novo')">
  🔔 NOVO PEDIDO! Toque para ver
</div>
<div class="header">
  <h1>🍳 COZINHA</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="som-btn" id="btnSom" onclick="toggleSom()">🔔 Som ON</button>
    <span class="badge" id="tot">0</span>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="filtrar('novo')" id="t-novo">Novos <span class="ct" id="c-novo">0</span></div>
  <div class="tab" onclick="filtrar('preparando')" id="t-prep">Preparando <span class="ct" id="c-prep">0</span></div>
  <div class="tab" onclick="filtrar('pronto')" id="t-pront">Prontos <span class="ct" id="c-pront">0</span></div>
</div>
<div class="pedidos" id="lista"><div class="vazio">🍳 Nenhum pedido</div></div>

<script>
var TK=localStorage.getItem('delivery_token')||new URLSearchParams(location.search).get('token')||'';
var B='/api/delivery';
var F='novo';
var pedidosAnteriores=new Set();
var somAtivo=localStorage.getItem('cozinha_som')!=='off';
if(TK)localStorage.setItem('delivery_token',TK);

// ===== SOM REAL =====
var audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function tocarSom(){
  if(!somAtivo)return;
  try{
    var ctx=getAudioCtx();
    // Toca 3 bips seguidos — som de pedido novo
    [0,0.3,0.6].forEach(function(delay){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=880;
      osc.type='sine';
      gain.gain.setValueAtTime(0.8,ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+0.25);
      osc.start(ctx.currentTime+delay);
      osc.stop(ctx.currentTime+delay+0.25);
    });
  }catch(e){}
}
function toggleSom(){
  somAtivo=!somAtivo;
  localStorage.setItem('cozinha_som',somAtivo?'on':'off');
  document.getElementById('btnSom').textContent=somAtivo?'🔔 Som ON':'🔕 Som OFF';
}
document.getElementById('btnSom').textContent=somAtivo?'🔔 Som ON':'🔕 Som OFF';

// Desbloquear audio no primeiro toque
document.addEventListener('click',function(){try{getAudioCtx().resume();}catch(e){}},{once:true});

function filtrar(s){
  F=s;
  ['novo','preparando','pronto'].forEach(function(t){
    document.getElementById('t-'+t).classList.toggle('active',t===s);
  });
  carregar();
}

function tempoDecorrido(d){
  if(!d)return'';
  var m=Math.floor((Date.now()-new Date(d).getTime())/60000);
  if(m<1)return'agora';
  if(m<60)return m+'min';
  return Math.floor(m/60)+'h'+(m%60?m%60+'m':'');
}

async function carregar(){
  try{
    var r=await fetch(B+'/cozinha/pedidos?token='+TK);
    var ps=await r.json();
    if(!Array.isArray(ps))return;
    var nv=ps.filter(function(p){return p.status==='novo';});
    var pr=ps.filter(function(p){return p.status==='preparando';});
    var pt=ps.filter(function(p){return p.status==='pronto';});

    document.getElementById('c-novo').textContent=nv.length;
    document.getElementById('c-prep').textContent=pr.length;
    document.getElementById('c-pront').textContent=pt.length;
    document.getElementById('tot').textContent=ps.length;

    // Detectar novos pedidos
    var idsAtuais=new Set(nv.map(function(p){return p._id;}));
    var novos=nv.filter(function(p){return !pedidosAnteriores.has(p._id);});
    if(novos.length>0&&pedidosAnteriores.size>0){
      tocarSom();
      document.getElementById('notifBanner').textContent='🔔 '+novos.length+' NOVO(S) PEDIDO(S)! Toque para ver';
      document.getElementById('notifBanner').style.display='block';
      setTimeout(function(){document.getElementById('notifBanner').style.display='none';},8000);
    }
    pedidosAnteriores=idsAtuais;

    var ls=F==='novo'?nv:F==='preparando'?pr:pt;
    if(!ls.length){document.getElementById('lista').innerHTML='<div class="vazio">Nenhum pedido</div>';return;}

    var h='';
    ls.forEach(function(p){
      var fm={pix:'PIX',dinheiro:'Dinheiro',cartao:'Cartão',na_entrega:'Na entrega'};
      var temBebida=false;
      var ih='';
      (p.itens||[]).forEach(function(it){
        if(it.nome&&it.nome.toLowerCase().match(/(coca|refri|suco|guarana|agua|cerveja|fanta|sprite|bebida)/))temBebida=true;
        ih+='<div class="it"><div><span class="it-nome">'+it.quantidade+'x '+it.nome+'</span>';
        if(it.observacao)ih+='<br><span class="it-obs">📝 '+it.observacao+'</span>';
        ih+='</div><span>R$ '+(it.subtotal||0).toFixed(2)+'</span></div>';
      });

      h+='<div class="card '+p.status+'">';
      // Origem e local
      var origemIcon=p.origemPedido==='caixa'?'🧾 Caixa':'📱 WhatsApp';
      var localInfo='';
      if(p.tipoLocal==='mesa')localInfo='<span style="background:#f97316;color:#fff;padding:3px 10px;border-radius:8px;font-weight:700;font-size:14px;">🍽️ MESA '+p.numeroMesa+'</span>';
      else if(p.tipoLocal==='balcao')localInfo='<span style="background:#3b82f6;color:#fff;padding:3px 10px;border-radius:8px;font-weight:700;font-size:14px;">🏪 BALCÃO</span>';
      else if(p.tipoLocal==='delivery'||p.tipoEntrega==='delivery')localInfo='<span style="background:#22c55e;color:#fff;padding:3px 10px;border-radius:8px;font-weight:700;font-size:14px;">🛵 DELIVERY</span>';

      h+='<div class="card-head">';
      h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
      h+='<span class="num">#'+(p.numero||'?')+'</span>';
      h+=localInfo;
      h+='<span style="font-size:11px;color:#888;">'+origemIcon+'</span>';
      h+='</div>';
      h+='<div style="text-align:right;">';
      h+='<span class="tag tag-'+p.status+'">'+p.status.toUpperCase()+'</span>';
      h+='<br><span class="tempo">⏱️ '+tempoDecorrido(p.createdAt)+'</span>';
      h+='</div>';
      h+='</div>';
      h+='<div class="cliente">👤 '+(p.clienteNome||'Cliente')+' — '+(p.clienteTelefone||'')+'</div>';
      h+='<div class="itens">'+ih+'</div>';
      // Observações DESTACADAS
      if(p.observacao||p.observacoes){
        var obs=p.observacao||p.observacoes;
        h+='<div style="background:#7c2d12;border:2px solid #f97316;padding:10px;border-radius:8px;margin-top:8px;font-size:14px;font-weight:700;color:#fed7aa;">⚠️ OBS: '+obs+'</div>';
      }
      if(temBebida)h+='<div class="bebida" style="font-weight:700;font-size:14px;">🧊 ⚠️ TEM BEBIDA — SEPARAR GELADA!</div>';
      // Endereço destacado para delivery
      if(p.enderecoEntrega)h+='<div style="background:#1e3a5f;border:1px solid #3b82f6;padding:8px;border-radius:8px;margin-top:6px;font-size:13px;color:#93c5fd;">📍 ENTREGAR EM: <strong>'+p.enderecoEntrega+'</strong></div>';
      h+='<div class="foot"><div>';
      h+='<span class="total">R$ '+(p.total||p.valorTotal||0).toFixed(2)+'</span>';
      h+='<br><span class="pgto">'+(fm[p.formaPagamento]||p.formaPagamento||'')+'</span>';
      if(p.formaPagamento==='dinheiro'&&p.trocoPara)h+='<br><span class="troco">TROCO P/ R$ '+Number(p.trocoPara).toFixed(2)+'</span>';
      h+='</div><div class="btns">';
      if(p.status==='novo'){
        h+='<button class="btn btn-rej" onclick="rejeitar(\''+p._id+'\')">❌ Rejeitar</button>';
        h+='<button class="btn btn-ok pulse" onclick="aceitar(\''+p._id+'\')">✅ ACEITAR</button>';
      }else if(p.status==='preparando'){
        h+='<button class="btn btn-pronto" onclick="pronto(\''+p._id+'\')">✅ PRONTO</button>';
      }
      h+='</div></div></div>';
    });
    document.getElementById('lista').innerHTML=h;
  }catch(e){console.error(e);}
}

async function aceitar(id){
  await fetch(B+'/cozinha/'+id+'/aceitar?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});
  carregar();
}
async function pronto(id){
  await fetch(B+'/cozinha/'+id+'/pronto?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});
  carregar();
}
async function rejeitar(id){
  var m=prompt('Motivo do cancelamento:');
  if(!m)return;
  await fetch(B+'/cozinha/'+id+'/rejeitar?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({motivo:m})});
  carregar();
}

carregar();
setInterval(carregar,5000);
</script>
</body>
</html>
