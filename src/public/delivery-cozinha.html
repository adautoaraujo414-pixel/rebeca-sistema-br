<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebeca Delivery - Cozinha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh}
.header{background:#16213e;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #e94560}
.header h1{font-size:1.3em;color:#e94560}
.badge{background:#e94560;color:#fff;padding:4px 12px;border-radius:20px;font-weight:bold}
.tabs{display:flex;background:#16213e;border-bottom:1px solid #333}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab.active{border-bottom-color:#e94560;color:#e94560}
.tab .ct{background:#e94560;color:#fff;padding:2px 8px;border-radius:10px;font-size:.8em;margin-left:5px}
.pedidos{padding:10px;max-width:800px;margin:0 auto}
.card{background:#16213e;border-radius:12px;padding:15px;margin-bottom:12px;border-left:4px solid #e94560}
.card.preparando{border-left-color:#f39c12}
.card.pronto{border-left-color:#27ae60}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.num{font-size:1.2em;font-weight:bold;color:#e94560}
.tempo{font-size:.85em;color:#aaa}
.cliente{font-size:.9em;color:#ccc;margin-bottom:8px}
.itens{margin:10px 0}
.it{padding:6px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between}
.it:last-child{border:none}
.it-nome{font-weight:500}
.it-obs{color:#f39c12;font-size:.85em;font-style:italic}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #333}
.total{font-size:1.1em;font-weight:bold;color:#27ae60}
.pgto{font-size:.85em;color:#aaa}
.end{font-size:.85em;color:#87ceeb;margin-top:5px}
.bebida{background:#1a3a5c;padding:6px 10px;border-radius:8px;margin-top:8px;font-size:.85em;color:#87ceeb}
.btn{padding:10px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:.95em}
.btn:active{transform:scale(.95)}
.btn-ok{background:#27ae60;color:#fff}
.btn-pronto{background:#f39c12;color:#fff}
.btn-rej{background:#c0392b;color:#fff;font-size:.85em;padding:8px 14px}
.btns{display:flex;gap:8px}
.vazio{text-align:center;padding:60px 20px;color:#666}
.tag{padding:3px 10px;border-radius:10px;font-size:.8em;font-weight:bold}
.tag-novo{background:#e94560;color:#fff}
.tag-preparando{background:#f39c12;color:#fff}
.tag-pronto{background:#27ae60;color:#fff}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.troco{background:#f39c12;color:#000;padding:4px 8px;border-radius:6px;font-size:.85em;font-weight:bold;margin-top:5px;display:inline-block}
</style>
</head>
<body>
<div class="header">
<h1>&#x1F373; COZINHA</h1>
<div style="display:flex;gap:10px;align-items:center">
<button onclick="somAtivo=!somAtivo;this.textContent=somAtivo?'&#x1F514; Som':'&#x1F515; Mudo'" style="background:none;border:1px solid #666;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer">&#x1F514; Som</button>
<span class="badge" id="tot">0</span>
</div>
</div>
<div class="tabs">
<div class="tab active" onclick="filtrar('novo')" id="t-novo">Novos <span class="ct" id="c-novo">0</span></div>
<div class="tab" onclick="filtrar('preparando')" id="t-prep">Preparando <span class="ct" id="c-prep">0</span></div>
<div class="tab" onclick="filtrar('pronto')" id="t-pront">Prontos <span class="ct" id="c-pront">0</span></div>
</div>
<div class="pedidos" id="lista"><div class="vazio">&#x1F373; Nenhum pedido</div></div>
<script>
var TK=localStorage.getItem('delivery_token')||new URLSearchParams(location.search).get('token')||'';
var B='/api/delivery';
var F='novo';
var PA=0;
var somAtivo=true;
if(TK)localStorage.setItem('delivery_token',TK);

function filtrar(s){F=s;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
if(s==='novo')document.getElementById('t-novo').classList.add('active');
if(s==='preparando')document.getElementById('t-prep').classList.add('active');
if(s==='pronto')document.getElementById('t-pront').classList.add('active');
carregar();}

function tempo(d){if(!d)return'';var m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<1)return'agora';if(m<60)return m+'min';return Math.floor(m/60)+'h'+(m%60)+'m';}

async function carregar(){
try{
var r=await fetch(B+'/cozinha/pedidos?token='+TK);
var ps=await r.json();
if(!Array.isArray(ps))return;
var nv=ps.filter(function(p){return p.status==='novo'});
var pr=ps.filter(function(p){return p.status==='preparando'});
var pt=ps.filter(function(p){return p.status==='pronto'});
document.getElementById('c-novo').textContent=nv.length;
document.getElementById('c-prep').textContent=pr.length;
document.getElementById('c-pront').textContent=pt.length;
document.getElementById('tot').textContent=ps.length;
if(nv.length>PA&&somAtivo&&PA>0){try{new Audio('data:audio/wav;base64,UklGRl9vT19teleXRlIFdhcm5teleQ=').play();}catch(e){}}
PA=nv.length;
var ls=F==='novo'?nv:F==='preparando'?pr:pt;
if(ls.length===0){document.getElementById('lista').innerHTML='<div class="vazio">Nenhum pedido '+F+'</div>';return;}
var h='';
for(var i=0;i<ls.length;i++){
var p=ls[i];
var fm={pix:'PIX',dinheiro:'Dinheiro',cartao:'Cartao',na_entrega:'Na entrega'};
var tb=false;
var ih='';
for(var j=0;j<(p.itens||[]).length;j++){
var it=p.itens[j];
if(it.nome&&it.nome.toLowerCase().match(/(coca|refri|suco|guarana|agua|cerveja|fanta|sprite)/))tb=true;
ih+='<div class="it"><div><span class="it-nome">'+it.quantidade+'x '+it.nome+'</span>';
if(it.observacao)ih+='<br><span class="it-obs">'+it.observacao+'</span>';
ih+='</div><span>R$ '+(it.subtotal||0).toFixed(2)+'</span></div>';
}
h+='<div class="card '+p.status+'">';
h+='<div class="card-head"><span class="num">#'+(p.numero||'?')+'</span>';
h+='<span class="tag tag-'+p.status+'">'+p.status.toUpperCase()+'</span>';
h+='<span class="tempo">'+tempo(p.createdAt)+'</span></div>';
h+='<div class="cliente">'+(p.clienteNome||'Cliente')+' - '+(p.clienteTelefone||'')+'</div>';
h+='<div class="itens">'+ih+'</div>';
if(tb)h+='<div class="bebida">&#x1F9CA; TEM BEBIDA - Separar gelada</div>';
if(p.enderecoEntrega)h+='<div class="end">&#x1F4CD; '+p.enderecoEntrega+'</div>';
h+='<div class="foot"><div><span class="total">R$ '+(p.total||0).toFixed(2)+'</span>';
h+='<br><span class="pgto">'+(fm[p.formaPagamento]||'')+'</span>';
if(p.formaPagamento==='dinheiro'&&p.trocoPara)h+='<br><span class="troco">TROCO P/ R$ '+p.trocoPara.toFixed(2)+'</span>';
h+='</div><div class="btns">';
if(p.status==='novo'){
h+='<button class="btn btn-rej" onclick="rejeitar(''+p._id+'')">Rejeitar</button>';
h+='<button class="btn btn-ok pulse" onclick="aceitar(''+p._id+'')">ACEITAR</button>';
}else if(p.status==='preparando'){
h+='<button class="btn btn-pronto" onclick="pronto(''+p._id+'')">PRONTO &#x2705;</button>';
}
h+='</div></div></div>';
}
document.getElementById('lista').innerHTML=h;
}catch(e){console.error(e);}
}

async function aceitar(id){await fetch(B+'/cozinha/'+id+'/aceitar?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});carregar();}
async function pronto(id){await fetch(B+'/cozinha/'+id+'/pronto?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});carregar();}
async function rejeitar(id){var m=prompt('Motivo:');if(!m)return;await fetch(B+'/cozinha/'+id+'/rejeitar?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({motivo:m})});carregar();}

carregar();
setInterval(carregar,5000);
</script>
</body>
</html>
