<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entregador">
<title>Rebeca Delivery - Entregador</title>
<link rel="manifest" href="/delivery-entregador-manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;max-width:480px;margin:0 auto}
.header{background:#1a1a2e;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00d4ff;position:sticky;top:0;z-index:100}
.header h1{font-size:1.1em;color:#00d4ff;font-weight:700}
.header-left{display:flex;align-items:center;gap:10px}
.badge-total{background:#00d4ff;color:#000;padding:3px 10px;border-radius:20px;font-weight:bold;font-size:13px;min-width:28px;text-align:center}
.gps-dot{width:9px;height:9px;border-radius:50%;background:#444;display:inline-block}
.gps-dot.ativo{background:#00cc6a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;background:#1a1a2e;border-bottom:1px solid #333;position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:13px 8px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;font-size:14px;color:#555;transition:all .2s}
.tab.active{border-bottom-color:#00d4ff;color:#00d4ff}
.tab .ct{background:#00d4ff;color:#000;padding:2px 7px;border-radius:10px;font-size:11px;margin-left:4px;font-weight:bold}
.lista{padding:12px;padding-bottom:70px}
.card{background:#1a1a2e;border-radius:14px;padding:16px;margin-bottom:14px;border-left:4px solid #f39c12;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.card.em-entrega{border-left-color:#00d4ff}
.card.urgente{border-left-color:#ff4444;animation:urg 1.5s infinite}
@keyframes urg{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(255,68,68,0)}}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.num{font-size:1.2em;font-weight:bold;color:#00d4ff}
.tag{padding:4px 11px;border-radius:12px;font-size:12px;font-weight:bold}
.tag-pronto{background:#f39c12;color:#fff}
.tag-entrega{background:#00d4ff;color:#000}
.info-box{background:#0d1626;border-radius:10px;padding:12px;margin:8px 0}
.info-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:14px;line-height:1.4}
.info-row:last-child{margin-bottom:0}
.info-icon{font-size:15px;min-width:20px}
.info-text{color:#ddd}
.info-label{color:#888;font-size:11px;display:block;margin-bottom:2px}
.itens-lista{margin:8px 0}
.item-linha{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #1e1e2e;font-size:13px;color:#ccc}
.item-linha:last-child{border-bottom:none}
.item-qtd{background:#252542;color:#00d4ff;padding:2px 7px;border-radius:6px;font-weight:bold;font-size:12px;min-width:28px;text-align:center}
.item-obs{font-size:11px;color:#f39c12}
.bebida-aviso{background:#0d2a3e;border:1px solid #00d4ff;border-radius:8px;padding:8px 12px;font-size:13px;color:#87ceeb;margin:6px 0;display:flex;align-items:center;gap:6px}
.obs-aviso{background:#2a1a0d;border:1px solid #f39c12;border-radius:8px;padding:8px 12px;font-size:13px;color:#f39c12;margin:6px 0}
.urgente-aviso{background:#2a0d0d;border:1px solid #ff4444;border-radius:8px;padding:8px 12px;font-size:13px;color:#ff6666;margin:6px 0;font-weight:bold}
.pgto-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.troco-badge{background:#f39c12;color:#000;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:bold}
.total-val{font-size:1.2em;font-weight:bold;color:#00cc6a}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{padding:13px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-pegar{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000}
.btn-entregue{background:linear-gradient(135deg,#00cc6a,#009948);color:#fff}
.btn-maps{background:linear-gradient(135deg,#4285f4,#2860d4);color:#fff}
.btn-conversa{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.vazio{text-align:center;padding:60px 20px;color:#555;font-size:15px}
.notif-banner{position:fixed;top:0;left:0;right:0;background:#ff4444;color:#fff;padding:14px 16px;text-align:center;font-weight:bold;font-size:14px;z-index:9999;display:none;cursor:pointer;max-width:480px;margin:0 auto}
.gps-bar{background:#1a1a2e;padding:6px 16px;font-size:11px;color:#555;border-top:1px solid #222;text-align:center;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto}
.loading{text-align:center;padding:40px;color:#555}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #333;border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="notifBanner" class="notif-banner" onclick="this.style.display='none';filtrar('pronto')"></div>
<div class="header">
  <div class="header-left">
    <h1>🏍️ ENTREGADOR</h1>
    <span class="gps-dot" id="gpsDot"></span>
  </div>
  <span class="badge-total" id="tot">0</span>
</div>
<div class="tabs">
  <div class="tab active" onclick="filtrar('pronto')" id="t-pr">Prontos <span class="ct" id="c-pr">0</span></div>
  <div class="tab" onclick="filtrar('saiu_entrega')" id="t-en">Em Entrega <span class="ct" id="c-en">0</span></div>
</div>
<div class="lista" id="lista">
  <div class="loading"><div class="spinner"></div><p>Carregando pedidos...</p></div>
</div>
<div class="gps-bar" id="gpsBar">GPS aguardando...</div>
<script>
var TK=localStorage.getItem('delivery_token')||new URLSearchParams(location.search).get('token')||'';
var ENAME=localStorage.getItem('entregador_nome')||'';
var urlEId=new URLSearchParams(location.search).get('entregadorId')||'';
var B='/api/delivery';
var F='pronto';
var GPS={lat:null,lng:null};
var entregaAtiva=null;
var pedidosAnteriores=new Set();
if(TK)localStorage.setItem('delivery_token',TK);

async function carregar(){
  try{
    var r=await fetch(B+'/entregador/pedidos?token='+TK);
    var ps=await r.json();
    if(!Array.isArray(ps))return;
    var pr=ps.filter(function(p){return p.status==='pronto';});
    var en=ps.filter(function(p){return p.status==='saiu_entrega';});
    var idsAtuais=new Set(pr.map(function(p){return p._id;}));
    var novos=pr.filter(function(p){return !pedidosAnteriores.has(p._id);});
    if(novos.length>0&&pedidosAnteriores.size>0){
      mostrarBanner('🔔 '+novos.length+' pedido(s) novo(s) prontos!');
      if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
    }
    pedidosAnteriores=idsAtuais;
    document.getElementById('c-pr').textContent=pr.length;
    document.getElementById('c-en').textContent=en.length;
    document.getElementById('tot').textContent=ps.length;
    var ls=F==='pronto'?pr:en;
    if(!ls.length){
      document.getElementById('lista').innerHTML='<div class="vazio">Nenhum pedido '+(F==='pronto'?'pronto':'em entrega')+'</div>';
      return;
    }
    var h='';
    ls.forEach(function(p){
      var urgente=p.urgente||p.prioridade==='urgente';
      var temBebida=false;
      var itensHtml='';
      (p.itens||[]).forEach(function(it){
        if(it.nome&&it.nome.toLowerCase().match(/(coca|refri|suco|guarana|agua|cerveja|fanta|sprite|bebida)/))temBebida=true;
        itensHtml+='<div class="item-linha"><span class="item-qtd">'+it.quantidade+'x</span> '+it.nome+(it.observacao?' <span class="item-obs">('+it.observacao+')</span>':'')+'</div>';
      });
      var pgtoMap={pix:'PIX',dinheiro:'Dinheiro',cartao:'Cartao',na_entrega:'Na entrega'};
      h+='<div class="card'+(p.status==='saiu_entrega'?' em-entrega':'')+(urgente?' urgente':'')+'"">';
      h+='<div class="card-head"><span class="num">#'+(p.numero||'?')+'</span>';
      h+='<span class="tag '+(p.status==='pronto'?'tag-pronto':'tag-entrega')+'">'+(p.status==='pronto'?'PRONTO':'EM ENTREGA')+'</span></div>';
      if(urgente)h+='<div class="urgente-aviso">🚨 PEDIDO URGENTE!</div>';
      h+='<div class="info-box">';
      h+='<div class="info-row"><span class="info-icon">📍</span><span class="info-text"><span class="info-label">Endereço</span>'+(p.enderecoEntrega||'Retirada no local')+'</span></div>';
      if(p.observacaoEntrega)h+='<div class="info-row"><span class="info-icon">📝</span><span class="info-text"><span class="info-label">Obs entrega</span>'+p.observacaoEntrega+'</span></div>';
      h+='<div class="info-row"><span class="info-icon">👤</span><span class="info-text"><span class="info-label">Cliente</span>'+(p.clienteNome||p.nomeCliente||'—')+' '+(p.clienteTelefone||p.telefoneCliente||'')+'</span></div>';
      h+='</div>';
      if(itensHtml)h+='<div class="itens-lista">'+itensHtml+'</div>';
      if(temBebida)h+='<div class="bebida-aviso">🧊 Tem bebida neste pedido</div>';
      if(p.observacoes&&p.observacoes!==p.observacaoEntrega)h+='<div class="obs-aviso">📝 '+p.observacoes+'</div>';
      h+='<div class="pgto-row"><span>'+(pgtoMap[p.formaPagamento]||'—')+'</span><span class="total-val">R$ '+(p.total||0).toFixed(2).replace('.',',')+'</span></div>';
      if(p.formaPagamento==='dinheiro'&&p.trocoPara)h+='<div><span class="troco-badge">TROCO P/ R$ '+Number(p.trocoPara).toFixed(2).replace('.',',')+'</span></div>';
      h+='<div class="btns">';
      if(p.status==='pronto'){
        h+='<button class="btn btn-conversa" onclick="falarCliente(\''+p._id+'\',\''+(p.clienteNome||'Cliente')+'\')">💬 Falar com Cliente</button>';
        h+='<button class="btn btn-pegar" onclick="pegar(\''+p._id+'\')">🏍️ PEGAR PEDIDO</button>';
      }else{
        h+='<button class="btn btn-maps" onclick="abrirMaps(\''+encodeURIComponent(p.enderecoEntrega||'')+'\')">📍 ABRIR NO MAPS</button>';
        h+='<button class="btn btn-entregue" onclick="entregue(\''+p._id+'\')">✅ MARCAR ENTREGUE</button>';
      }
      h+='</div></div>';
    });
    document.getElementById('lista').innerHTML=h;
  }catch(e){console.error(e);}
}

function filtrar(s){
  F=s;
  document.getElementById('t-pr').classList.toggle('active',s==='pronto');
  document.getElementById('t-en').classList.toggle('active',s==='saiu_entrega');
  carregar();
}

async function pegar(id){
  await fetch(B+'/entregador/'+id+'/pegar?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregadorNome:ENAME||'Entregador',entregadorId:urlEId})});
  entregaAtiva=id;
  iniciarGPS();
  filtrar('saiu_entrega');
}

async function entregue(id){
  await fetch(B+'/entregador/'+id+'/entregue?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});
  entregaAtiva=null;
  filtrar('pronto');
}

function abrirMaps(end){window.open('https://www.google.com/maps/search/'+end,'_blank');}

function falarCliente(pedidoId,nomeCliente){
  if(!confirm('Iniciar conversa com '+nomeCliente+' via Rebeca?'))return;
  fetch('/api/delivery/pedido/'+pedidoId+'/contato-cliente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregadorNome:ENAME||'Entregador'})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.sucesso)alert('Mensagem enviada! Rebeca esta intermediando.');
    else alert('Erro: '+(d.erro||'falha'));
  }).catch(function(){alert('Erro de conexao');});
}

function iniciarGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(function(pos){
    GPS.lat=pos.coords.latitude;GPS.lng=pos.coords.longitude;
    document.getElementById('gpsDot').classList.add('ativo');
    document.getElementById('gpsBar').textContent='📍 GPS: '+GPS.lat.toFixed(5)+', '+GPS.lng.toFixed(5);
    if(entregaAtiva){
      fetch(B+'/entregador/'+entregaAtiva+'/gps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:GPS.lat,longitude:GPS.lng})}).catch(function(){});
    }
  },function(err){document.getElementById('gpsBar').textContent='GPS: '+err.message;},{enableHighAccuracy:true,maximumAge:10000});
}

function mostrarBanner(msg){
  var b=document.getElementById('notifBanner');
  b.textContent=msg;b.style.display='block';
  setTimeout(function(){b.style.display='none';},8000);
}

if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
iniciarGPS();
carregar();
setInterval(carregar,8000);
</script>
</body>
</html>
