<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;max-width:480px;margin:0 auto}
.header{background:#1a1a2e;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00d4ff;position:sticky;top:0;z-index:100}
.header h1{font-size:1.05em;color:#00d4ff;font-weight:700}
.header-right{display:flex;align-items:center;gap:8px}
.gps-dot{width:9px;height:9px;border-radius:50%;background:#444;display:inline-block}
.gps-dot.ativo{background:#00cc6a;animation:gp 2s infinite}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.3}}
.badge{background:#00d4ff;color:#000;padding:3px 10px;border-radius:20px;font-weight:bold;font-size:13px;min-width:28px;text-align:center}
.tabs{display:flex;background:#1a1a2e;border-bottom:1px solid #333;position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:11px 4px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;font-size:12px;color:#555}
.tab.active{border-bottom-color:#00d4ff;color:#00d4ff}
.tab .ct{background:#00d4ff;color:#000;padding:2px 5px;border-radius:8px;font-size:10px;margin-left:2px;font-weight:bold}
.tab.ok.active{border-bottom-color:#00cc6a;color:#00cc6a}
.tab.ok .ct{background:#00cc6a}
.lista{padding:10px;padding-bottom:80px}
.rota-bar{background:#1a1a2e;border:1px solid #00d4ff;border-radius:10px;margin:10px;padding:12px;display:none}
.rota-bar h3{color:#00d4ff;font-size:13px;margin-bottom:8px}
.rota-btn{background:linear-gradient(135deg,#4285f4,#2860d4);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;width:100%}
.card{background:#1a1a2e;border-radius:14px;padding:14px;margin-bottom:12px;border-left:4px solid #f39c12;position:relative}
.card.em-entrega{border-left-color:#00d4ff}
.card.entregue-ok{border-left-color:#00cc6a}
.ordem-badge{position:absolute;top:10px;right:10px;background:#252542;border:1px solid #333;border-radius:8px;padding:4px 8px;font-size:12px;color:#888;display:flex;align-items:center;gap:4px}
.ordem-badge select{background:transparent;border:none;color:#00d4ff;font-weight:bold;font-size:13px;cursor:pointer;outline:none}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-right:75px}
.num{font-size:1.1em;font-weight:bold;color:#00d4ff}
.tag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.tag-pronto{background:#f39c12;color:#fff}
.tag-entrega{background:#00d4ff;color:#000}
.tag-entregue{background:#00cc6a;color:#000}
.info-box{background:#0d1626;border-radius:8px;padding:10px;margin:6px 0;font-size:13px}
.info-row{display:flex;gap:7px;margin-bottom:5px;align-items:flex-start;line-height:1.4}
.info-row:last-child{margin:0}
.info-icon{min-width:18px}
.info-text{color:#ddd}
.info-label{color:#888;font-size:11px;display:block}
.itens-resumo{font-size:12px;color:#aaa;margin:4px 0}
.bebida{background:#0d2a3e;border:1px solid #00d4ff;border-radius:6px;padding:5px 10px;font-size:12px;color:#87ceeb;margin:4px 0}
.obs{background:#2a1a0d;border:1px solid #f39c12;border-radius:6px;padding:5px 10px;font-size:12px;color:#f39c12;margin:4px 0}
.urgente{background:#2a0d0d;border:1px solid #ff4444;border-radius:6px;padding:5px 10px;font-size:12px;color:#ff6666;margin:4px 0;font-weight:bold}
.pgto-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:13px}
.troco{background:#f39c12;color:#000;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.total{font-size:1.1em;font-weight:bold;color:#00cc6a}
.btns{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.btn{padding:12px;border:none;border-radius:9px;font-weight:bold;cursor:pointer;font-size:13px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-saindo{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000}
.btn-entregue{background:linear-gradient(135deg,#00cc6a,#009948);color:#fff}
.btn-maps{background:linear-gradient(135deg,#4285f4,#2860d4);color:#fff}
.btn-conversa{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn-outline{background:transparent;border:1px solid #333;color:#aaa;padding:8px}
/* TEMPOS */
.tempos-box{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:8px;padding:10px;margin:8px 0}
.tempos-box h4{color:#00cc6a;font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.tempo-linha{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.tempo-linha:last-child{margin:0;padding-top:5px;border-top:1px solid #1a3a1a;font-weight:bold}
.tempo-label{color:#888}
.tempo-val{color:#00cc6a;font-weight:bold}
.tempo-val.lento{color:#f39c12}
.tempo-val.total{color:#fff;font-size:13px}
.vazio{text-align:center;padding:50px 20px;color:#555}
.notif-banner{position:fixed;top:0;left:0;right:0;background:#ff4444;color:#fff;padding:12px;text-align:center;font-weight:bold;font-size:13px;z-index:9999;display:none;cursor:pointer;max-width:480px;margin:0 auto}
.gps-bar{background:#1a1a2e;padding:5px 16px;font-size:11px;color:#555;border-top:1px solid #222;text-align:center;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto}
.loading{text-align:center;padding:40px;color:#555}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid #333;border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.resumo-dia{background:#1a1a2e;border:1px solid #333;border-radius:10px;margin:10px;padding:12px;display:flex;gap:15px;justify-content:center}
.resumo-item{text-align:center}
.resumo-item .val{font-size:1.3em;font-weight:bold;color:#00cc6a}
.resumo-item .lab{font-size:11px;color:#888;margin-top:2px}
</style>

  <style id="rebeca-global-fix">
  /* ===== CORREÇÕES GLOBAIS REBECA ===== */

  /* Scroll geral — nunca travar o body */
  html, body {
    overflow-x: hidden !important;
    scroll-behavior: smooth;
  }

  /* Z-index ordenado — evitar sobreposição */
  /* FAB: 9999 | Drawer: 9998 | Banner PWA: 10000 | Modais: 9001+ | Toast: 99999 */

  /* Modais — garantir scroll interno */
  [class*="modal"], [id*="modal"] {
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
  }

  /* Tabelas — scroll horizontal em mobile */
  @media(max-width:768px){
    table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    /* Evitar sobreposição do FAB com conteúdo */
    body { padding-bottom: 80px !important; }

    /* Cards empilhados corretamente */
    .stats-grid, [class*="grid"] {
      grid-template-columns: 1fr 1fr !important;
    }

    /* Inputs e botões — tamanho mínimo tocável */
    input, select, button, textarea {
      min-height: 40px;
      font-size: 14px !important;
    }

    /* Padding adequado nas páginas */
    .page, .panel, .content, main {
      padding: 10px !important;
    }

    /* Header não sobrepõe conteúdo */
    .header, header {
      position: sticky !important;
      top: 0;
      z-index: 100;
    }
  }

  /* Fix duplo clique em botões — evitar submit duplo */
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  </style>

<body>
<div id="notifBanner" class="notif-banner" onclick="this.style.display='none'"></div>
<div class="header">
  <img src="/logo-rebeca.png" style="height:38px;object-fit:contain;filter:brightness(0) invert(1)">
  <div class="header-right">
    <span class="gps-dot" id="gpsDot"></span>
    <span class="badge" id="tot">0</span>
    <button id="btn-sair-ent" onclick="sairEntregador()" style="display:none;background:#ff4444;color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:bold;cursor:pointer;">Sair</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="filtrar('fila')" id="t-fila">Fila <span class="ct" id="c-fila">0</span></div>
  <div class="tab" onclick="filtrar('saiu_entrega')" id="t-en">Saindo <span class="ct" id="c-en">0</span></div>
  <div class="tab ok" onclick="filtrar('entregue')" id="t-ok">Entregues <span class="ct" id="c-ok">0</span></div>
</div>
<div id="rotaBar" class="rota-bar">
  <h3>🗺️ Rota — <span id="rotaQtd">0</span> entrega(s) pendente(s)</h3>
  <button class="rota-btn" onclick="abrirRotaMaps()">🗺️ Abrir Rota Completa no Maps</button>
</div>
<div id="resumoDia" class="resumo-dia" style="display:none">
  <div class="resumo-item"><div class="val" id="resQtd">0</div><div class="lab">Entregas</div></div>
  <div class="resumo-item"><div class="val" id="resTotal">R$0</div><div class="lab">Faturado</div></div>
  <div class="resumo-item"><div class="val" id="resTempo">-</div><div class="lab">Tempo médio</div></div>
</div>
<div id="login-screen-ent" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px;background:#0a0a1a;">
  <img src="/logo-rebeca.png" style="height:60px;object-fit:contain;filter:brightness(0) invert(1);margin-bottom:28px">
  <div style="background:#1a1a2e;border:1px solid #00d4ff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;">
    <h2 style="color:#00d4ff;text-align:center;margin-bottom:20px;font-size:1.2em;">🛵 Entrar como Entregador</h2>
    <input id="login-tel" type="tel" placeholder="Telefone (somente números)"
      style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0d1626;color:#fff;font-size:15px;margin-bottom:12px;box-sizing:border-box;">
    <input id="login-senha" type="password" placeholder="Senha"
      style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0d1626;color:#fff;font-size:15px;margin-bottom:16px;box-sizing:border-box;">
    <button onclick="fazerLoginEntregador()"
      style="width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;border:none;border-radius:9px;font-weight:bold;font-size:15px;cursor:pointer;">
      Entrar
    </button>
    <p id="login-erro-ent" style="color:#ff4444;text-align:center;margin-top:12px;font-size:13px;min-height:18px;"></p>
  </div>
</div>
<div id="app-ent">
<div class="lista" id="lista">
  <div class="loading"><div class="spinner"></div><p>Carregando...</p></div>
</div>
<div class="gps-bar" id="gpsBar">GPS aguardando...</div>

<script src="/js/rebeca-realtime.js"></script>
<script src="/js/rebeca-monitor.js"></script>
<script src="/js/rebeca-notify.js"></script>
<script src="/js/rebeca-pwa.js"></script>
<script>
// ===== LOGIN =====
var TK=localStorage.getItem('delivery_token')||new URLSearchParams(location.search).get('token')||'';
var ENAME=localStorage.getItem('entregador_nome')||'Entregador';
var urlEId=new URLSearchParams(location.search).get('entregadorId')||localStorage.getItem('entregador_id')||'';

async function fazerLoginEntregador(){
  var tel=document.getElementById('login-tel').value.replace(/\D/g,'');
  var sen=document.getElementById('login-senha').value;
  if(!tel||!sen){alert('Preencha telefone e senha');return;}
  try{
    var r=await fetch('/api/delivery/entregador/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefone:tel,senha:sen})});
    var d=await r.json();
    if(d.token){
      localStorage.setItem('delivery_token',d.token);
      localStorage.setItem('entregador_nome',d.entregador.nome);
      localStorage.setItem('entregador_id',d.entregador._id);
      TK=d.token;ENAME=d.entregador.nome;urlEId=d.entregador._id;
      document.getElementById('login-screen-ent').style.display='none';
      document.getElementById('app-ent').style.display='block';
      carregar();
    }else{
      document.getElementById('login-erro-ent').textContent=d.erro||'Erro ao entrar';
    }
  }catch(e){document.getElementById('login-erro-ent').textContent='Erro de conexão';}
}

function sairEntregador(){
  localStorage.removeItem('delivery_token');
  localStorage.removeItem('entregador_nome');
  localStorage.removeItem('entregador_id');
  location.reload();
}

// Verificar se já tem token
if(!TK){
  document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('login-screen-ent').style.display='flex';
    document.getElementById('app-ent').style.display='none';
  });
}
var B='/api/delivery';
var F='fila';

// ===== SSE: receber notificações em tempo real =====
var _sseEnt = null;
function conectarSSEEntregador() {
  if (!TK) return;
  if (_sseEnt) _sseEnt.close();
  _sseEnt = new EventSource(B + '/entregador/eventos?token=' + TK);
  _sseEnt.addEventListener('novo_pedido_disponivel', function(e) {
    var d = JSON.parse(e.data);
    mostrarPopupAceitar(d);
    if (navigator.vibrate) navigator.vibrate([400,100,400,100,400]);
  });
  _sseEnt.onerror = function() {
    setTimeout(conectarSSEEntregador, 5000); // reconectar
  };
}
if (TK) conectarSSEEntregador();

function mostrarPopupAceitar(d) {
  // Remover popup anterior se existir
  var ant = document.getElementById('popupAceitar');
  if (ant) ant.remove();

  var popup = document.createElement('div');
  popup.id = 'popupAceitar';
  popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
  popup.innerHTML =
    '<div style="background:#1a1a2e;border:2px solid #f97316;border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center;">' +
    '<div style="font-size:2em;margin-bottom:8px;">🏍️</div>' +
    '<div style="color:#f97316;font-size:1.1em;font-weight:900;margin-bottom:4px;">NOVO PEDIDO!</div>' +
    '<div style="color:#fff;font-size:1.3em;font-weight:800;margin-bottom:8px;">#' + (d.numero||'?') + '</div>' +
    '<div style="color:#93c5fd;font-size:.9em;margin-bottom:4px;">📍 ' + (d.endereco||'Retirada') + '</div>' +
    '<div style="color:#aaa;font-size:.82em;margin-bottom:4px;">' + (d.itens||'') + '</div>' +
    '<div style="color:#22c55e;font-size:1.1em;font-weight:800;margin-bottom:16px;">R$ ' + Number(d.total||0).toFixed(2).replace('.',',') + '</div>' +
    '<div id="popupTimer" style="color:#f97316;font-size:.85em;margin-bottom:12px;font-weight:700;">⏱️ <span id="popupSeg">180</span>s para aceitar</div>' +
    '<button onclick="aceitarPedidoPopup(" + d.pedidoId + ",this)" style="width:100%;padding:14px;background:linear-gradient(135deg,#f97316,#ea580c);border:none;border-radius:10px;color:#fff;font-size:1em;font-weight:900;cursor:pointer;margin-bottom:8px;">✅ ACEITAR ENTREGA</button>' +
    '<button onclick="document.getElementById(\"popupAceitar\").remove();clearInterval(window._popupTimer);" style="width:100%;padding:10px;background:rgba(239,68,68,.15);border:1px solid #ef4444;border-radius:10px;color:#ef4444;font-size:.85em;cursor:pointer;">❌ Recusar</button>' +
    '</div>';
  document.body.appendChild(popup);

  // Countdown
  var seg = 180;
  window._popupTimer = setInterval(function() {
    seg--;
    var el = document.getElementById('popupSeg');
    if (el) el.textContent = seg;
    if (seg <= 0) {
      clearInterval(window._popupTimer);
      var p = document.getElementById('popupAceitar');
      if (p) p.remove();
    }
  }, 1000);
}

async function aceitarPedidoPopup(pedidoId, btn) {
  btn.disabled = true;
  btn.textContent = 'Aceitando...';
  try {
    var r = await fetch(B + '/entregador/' + pedidoId + '/aceitar?token=' + TK, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    var d = await r.json();
    clearInterval(window._popupTimer);
    document.getElementById('popupAceitar').remove();
    if (r.ok && d.sucesso) {
      mostrarBanner('✅ Pedido aceito! Você está na rota.');
      _entregasAtivas.add(pedidoId);
      iniciarGPS();
      filtrar('saiu_entrega');
      carregar();
    } else {
      mostrarBanner('⚠️ ' + (d.erro || 'Pedido já foi aceito por outro entregador.'));
      carregar();
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✅ ACEITAR ENTREGA';
    mostrarBanner('Erro de conexão. Tente novamente.');
  }
}
var GPS={lat:null,lng:null};
var pedidosAnteriores=new Set();
var todosPedidos=[];
var pedidosEntregues=[];
var _gpsWatch=null;
var _entregasAtivas=new Set();
if(TK){
  localStorage.setItem('delivery_token',TK);
  document.addEventListener('DOMContentLoaded',function(){
    var btnSair=document.getElementById('btn-sair-ent');
    if(btnSair)btnSair.style.display='block';
  });
}

function minutos(val){
  if(val===null||val===undefined)return'—';
  if(val<1)return'<1min';
  if(val<60)return val+'min';
  return Math.floor(val/60)+'h'+(val%60?val%60+'m':'');
}
async function classTempo(min,limiteOk){
  if(min===null||min===undefined)return'';
  return min>limiteOk?'lento':'';
}

async function carregar(){
  try{
    var r=await fetch(B+'/entregador/rota?token='+TK);
    if(!r.ok)r=await fetch(B+'/entregador/pedidos?token='+TK);
    var ps=await r.json();
    if(!Array.isArray(ps))ps=[];
    todosPedidos=ps;

    var fila=ps.filter(function(p){return p.status==='pronto';});
    var saindo=ps.filter(function(p){return p.status==='saiu_entrega';});

    var idsAtuais=new Set(fila.map(function(p){return p._id;}));
    var novos=fila.filter(function(p){return !pedidosAnteriores.has(p._id);});
    if(novos.length>0&&pedidosAnteriores.size>0){
      mostrarBanner('🔔 '+novos.length+' pedido(s) novo(s) na fila!');
      if(navigator.vibrate)navigator.vibrate([300,100,300]);
    }
    pedidosAnteriores=idsAtuais;

    document.getElementById('c-fila').textContent=fila.length;
    document.getElementById('c-en').textContent=saindo.length;
    document.getElementById('tot').textContent=fila.length+saindo.length;

    var rotaBar=document.getElementById('rotaBar');
    if(fila.length+saindo.length>0){
      rotaBar.style.display='block';
      document.getElementById('rotaQtd').textContent=fila.length+saindo.length;
    } else rotaBar.style.display='none';

    if(F==='fila')renderFila(fila);
    else if(F==='saiu_entrega')renderFila(saindo);

    // GPS ativo nos pedidos em entrega
    saindo.forEach(function(p){_entregasAtivas.add(p._id);});
    if(saindo.length>0)iniciarGPS();
  }catch(e){console.error(e);}
}

async function carregarEntregues(){
  try{
    var r=await fetch(B+'/entregador/entregues?token='+TK);
    var ps=await r.json();
    if(!Array.isArray(ps))ps=[];
    pedidosEntregues=ps;
    document.getElementById('c-ok').textContent=ps.length;
    renderEntregues(ps);
  }catch(e){}
}

function renderFila(ls){
  ls.sort(function(a,b){return (a.ordemEntrega||99)-(b.ordemEntrega||99);});
  if(!ls.length){document.getElementById('lista').innerHTML='<div class="vazio">'+(F==='fila'?'Nenhum pedido na fila':'Nenhum pedido saindo')+'</div>';return;}
  var h='';
  ls.forEach(function(p){
    var urgente=p.urgente||p.prioridade==='urgente';
    var temBebida=false;
    var itensTexto=(p.itens||[]).map(function(it){
      if(it.nome&&it.nome.toLowerCase().match(/(coca|refri|suco|guarana|agua|cerveja|fanta|sprite|bebida)/))temBebida=true;
      return it.quantidade+'x '+it.nome+(it.observacao?' ('+it.observacao+')':'');
    }).join(', ');
    var pgtoMap={pix:'PIX',dinheiro:'Dinheiro',cartao:'Cartao',na_entrega:'Na entrega'};

    h+='<div class="card'+(p.status==='saiu_entrega'?' em-entrega':'')+'">';
    h+='<div class="ordem-badge">📍<select onchange="salvarOrdem(\''+p._id+'\',this.value)">';
    for(var n=1;n<=10;n++)h+='<option value="'+n+'"'+(p.ordemEntrega==n?' selected':'')+'>'+n+'ª</option>';
    h+='</select></div>';
    // Destacar primeiro da fila
    var isPrimeiro=ls.indexOf(p)===0&&F==='fila';
    if(isPrimeiro)h+='<div style="background:#f97316;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:6px;">⭐ PRÓXIMA ENTREGA</div>';
    h+='<div class="card-head"><span class="num">#'+(p.numero||'?')+'</span>';
    h+='<span class="tag '+(p.status==='pronto'?'tag-pronto':'tag-entrega')+'">'+(p.status==='pronto'?'PRONTO':'SAINDO')+'</span></div>';
    if(urgente)h+='<div class="urgente">🚨 URGENTE!</div>';
    // Observação DESTACADA
    var obsGeral=p.observacao||p.observacoes||'';
    if(obsGeral)h+='<div style="background:#7c2d12;border:2px solid #f97316;padding:8px;border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:700;color:#fed7aa;">⚠️ OBS: '+obsGeral+'</div>';
    h+='<div class="info-box">';
    // Endereço destacado
    h+='<div class="info-row"><span class="info-icon">📍</span><span class="info-text" style="font-weight:700;color:#93c5fd;font-size:14px;"><span class="info-label">Endereço</span>'+(p.enderecoEntrega||'Retirada/Balcão')+'</span></div>';
    if(p.observacaoEntrega)h+='<div class="info-row"><span class="info-icon">🏠</span><span class="info-text" style="color:#fbbf24;font-weight:600;"><span class="info-label">Complemento</span>'+p.observacaoEntrega+'</span></div>';
    h+='<div class="info-row"><span class="info-icon">👤</span><span class="info-text"><span class="info-label">Cliente</span>'+(p.clienteNome||'—')+' '+(p.clienteTelefone||'')+'</span></div>';
    h+='</div>';
    if(itensTexto)h+='<div class="itens-resumo">'+itensTexto+'</div>';
    if(temBebida)h+='<div class="bebida">🧊 ⚠️ TEM BEBIDA — SEPARAR GELADA!</div>';
    h+='<div class="pgto-row"><span>'+(pgtoMap[p.formaPagamento]||'—')+'</span><span class="total">R$ '+(p.total||p.valorTotal||0).toFixed(2).replace('.',',')+'</span></div>';
    if(p.formaPagamento==='dinheiro'&&p.trocoPara)h+='<div><span class="troco">TROCO P/ R$ '+Number(p.trocoPara).toFixed(2).replace('.',',')+'</span></div>';
    h+='<div class="btns">';
    if(p.status==='pronto'){
      h+='<button class="btn btn-maps" onclick="abrirMapsEndereco(\''+encodeURIComponent(p.enderecoEntrega||'')+'\')">🗺️ Ver no Maps</button>';
      h+='<button class="btn btn-conversa" onclick="falarCliente(\''+p._id+'\',\''+(p.clienteNome||'Cliente')+'\')">💬 Falar com Cliente</button>';
      h+='<button class="btn btn-saindo" onclick="iniciarEntrega(\''+p._id+'\',\''+p.numero+'\')">🏍️ SAINDO PARA ENTREGA</button>';
    }else{
      h+='<button class="btn btn-maps" onclick="abrirMapsEndereco(\''+encodeURIComponent(p.enderecoEntrega||'')+'\')">📍 Navegar no Maps</button>';
      h+='<button class="btn btn-entregue" onclick="marcarEntregue(\''+p._id+'\')">✅ ENTREGUE</button>';
    }
    h+='</div></div>';
  });
  document.getElementById('lista').innerHTML=h;
}

function renderEntregues(ps){
  document.getElementById('rotaBar').style.display='none';
  if(!ps.length){
    document.getElementById('lista').innerHTML='<div class="vazio">Nenhuma entrega hoje ainda</div>';
    document.getElementById('resumoDia').style.display='none';
    return;
  }
  // Resumo do dia
  var totalFaturado=ps.reduce(function(s,p){return s+(p.total||p.valorTotal||0);},0);
  var temposValidos=ps.filter(function(p){return p.tempos&&p.tempos.total;});
  var mediaTotal=temposValidos.length?Math.round(temposValidos.reduce(function(s,p){return s+p.tempos.total;},0)/temposValidos.length):null;
  document.getElementById('resQtd').textContent=ps.length;
  document.getElementById('resTotal').textContent='R$'+totalFaturado.toFixed(0);
  document.getElementById('resTempo').textContent=mediaTotal?mediaTotal+'min':'—';
  document.getElementById('resumoDia').style.display='flex';

  var h='';
  ps.forEach(function(p){
    var t=p.tempos||{};
    h+='<div class="card entregue-ok">';
    h+='<div class="card-head"><span class="num">#'+(p.numero||'?')+'</span>';
    h+='<span class="tag tag-entregue">ENTREGUE ✅</span></div>';
    h+='<div class="info-box">';
    h+='<div class="info-row"><span class="info-icon">📍</span><span class="info-text"><span class="info-label">Endereço</span>'+(p.enderecoEntrega||'—')+'</span></div>';
    h+='<div class="info-row"><span class="info-icon">👤</span><span class="info-text"><span class="info-label">Cliente</span>'+(p.clienteNome||'—')+'</span></div>';
    h+='</div>';
    var itensTexto=(p.itens||[]).map(function(it){return it.quantidade+'x '+it.nome;}).join(', ');
    if(itensTexto)h+='<div class="itens-resumo">'+itensTexto+'</div>';
    h+='<div class="pgto-row"><span style="color:#aaa;font-size:12px;">'+(p.formaPagamento||'')+'</span><span class="total">R$ '+(p.total||p.valorTotal||0).toFixed(2).replace('.',',')+'</span></div>';
    // TEMPOS DETALHADOS
    h+='<div class="tempos-box">';
    h+='<h4>⏱️ Tempos do pedido</h4>';
    h+='<div class="tempo-linha"><span class="tempo-label">⏳ Coleta (pedido → cozinha)</span><span class="tempo-val '+classTempo(t.coleta,5)+'">'+minutos(t.coleta)+'</span></div>';
    h+='<div class="tempo-linha"><span class="tempo-label">🍳 Produção (cozinha)</span><span class="tempo-val '+classTempo(t.producao,20)+'">'+minutos(t.producao)+'</span></div>';
    h+='<div class="tempo-linha"><span class="tempo-label">🏍️ Entrega (saiu → chegou)</span><span class="tempo-val '+classTempo(t.entrega,30)+'">'+minutos(t.entrega)+'</span></div>';
    h+='<div class="tempo-linha"><span class="tempo-label">📦 Total do pedido</span><span class="tempo-val total">'+minutos(t.total)+'</span></div>';
    h+='</div>';
    h+='</div>';
  });
  document.getElementById('lista').innerHTML=h;
}

function filtrar(s){
  F=s;
  ['fila','saiu_entrega','entregue'].forEach(function(t){
    document.getElementById('t-'+t).classList.toggle('active',t===s);
  });
  if(s==='entregue'){carregarEntregues();return;}
  var fila=todosPedidos.filter(function(p){return p.status==='pronto';});
  var saindo=todosPedidos.filter(function(p){return p.status==='saiu_entrega';});
  renderFila(s==='fila'?fila:saindo);
}

async function salvarOrdem(id,ordem){
  try{
    await fetch(B+'/entregador/'+id+'/ordem?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ordem:parseInt(ordem)})});
    todosPedidos.forEach(function(p){if(p._id===id)p.ordemEntrega=parseInt(ordem);});
    var fila=todosPedidos.filter(function(p){return p.status==='pronto';});
    var saindo=todosPedidos.filter(function(p){return p.status==='saiu_entrega';});
    renderFila(F==='fila'?fila:saindo);
  }catch(e){}
}

async function iniciarEntrega(id,numero){
  if(!confirm('Confirma saída para o pedido #'+numero+'?\n\nO cliente receberá o link de rastreio em tempo real! 🏍️'))return;
  try{
    var r=await fetch(B+'/entregador/'+id+'/iniciar-entrega?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregadorNome:ENAME,entregadorId:urlEId})});
    if(r.ok){
      _entregasAtivas.add(id);
      iniciarGPS();
      mostrarBanner('✅ Saindo! Link de rastreio enviado para o cliente.');
      filtrar('saiu_entrega');
      carregar();
    }
  }catch(e){alert('Erro ao iniciar entrega');}
}

async function marcarEntregue(id){
  if(!confirm('Confirmar entrega realizada?'))return;
  try{
    _entregasAtivas.delete(id);
    await fetch(B+'/entregador/'+id+'/entregue?token='+TK,{method:'PUT',headers:{'Content-Type':'application/json'}});
    mostrarBanner('✅ Entrega confirmada!');
    filtrar('fila');
    carregar();
  }catch(e){}
}

function abrirMapsEndereco(end){
  window.open('https://www.google.com/maps/dir/?api=1&destination='+end+'&travelmode=driving','_blank');
}

function abrirRotaMaps(){
  var todos=todosPedidos.filter(function(p){return p.status==='pronto'||p.status==='saiu_entrega';});
  todos.sort(function(a,b){return (a.ordemEntrega||99)-(b.ordemEntrega||99);});
  if(!todos.length)return alert('Nenhum pedido na rota');
  var origin=GPS.lat?'&origin='+GPS.lat+','+GPS.lng:'';
  var dest=encodeURIComponent(todos[todos.length-1].enderecoEntrega||'');
  var wp=todos.slice(0,-1).map(function(p){return encodeURIComponent(p.enderecoEntrega||'');}).join('|');
  var url='https://www.google.com/maps/dir/?api=1'+origin+'&destination='+dest+(wp?'&waypoints='+wp:'')+'&travelmode=driving';
  window.open(url,'_blank');
}

function falarCliente(pedidoId,nomeCliente){
  if(!confirm('Falar com '+nomeCliente+' via Rebeca?'))return;
  fetch('/api/delivery/pedido/'+pedidoId+'/contato-cliente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregadorNome:ENAME})})
  .then(function(r){return r.json();}).then(function(d){alert(d.sucesso?'Mensagem enviada!':'Erro: '+(d.erro||'falha'));}).catch(function(){alert('Erro');});
}

function iniciarGPS(pedidoId){
  if(pedidoId)_entregasAtivas.add(pedidoId);
  if(_gpsWatch)return;
  if(!navigator.geolocation)return;
  _gpsWatch=navigator.geolocation.watchPosition(function(pos){
    GPS.lat=pos.coords.latitude;GPS.lng=pos.coords.longitude;
    document.getElementById('gpsDot').classList.add('ativo');
    document.getElementById('gpsBar').textContent='📍 GPS ativo: '+GPS.lat.toFixed(5)+', '+GPS.lng.toFixed(5);
    _entregasAtivas.forEach(function(pid){
      fetch(B+'/entregador/'+pid+'/gps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:GPS.lat,longitude:GPS.lng})}).catch(function(){});
    });
  },function(err){document.getElementById('gpsBar').textContent='GPS: '+err.message;},{enableHighAccuracy:true,maximumAge:2000});
}

function mostrarBanner(msg){
  var b=document.getElementById('notifBanner');
  b.textContent=msg;b.style.display='block';
  setTimeout(function(){b.style.display='none';},6000);
}

if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
carregar();
window._ivEntregador = RebecaRealtime.register("entregador-status", carregar, 20000, "alta", false);
document.addEventListener('visibilitychange', function() {
  if (document.hidden) { clearInterval(window._ivEntregador); }
  else { carregar(); window._ivEntregador = // [removido duplicata]; }
});
</script>

  <script id="rebeca-anti-double-click">
  // Prevenir duplo clique em botões de ação
  document.addEventListener('DOMContentLoaded', function(){
    document.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if(!btn) return;
      // Não bloquear FAB nem drawer
      if(btn.id && (btn.id.includes('fab') || btn.id.includes('pwa'))) return;
      // Botões de confirmar/salvar/enviar
      if(btn.textContent.match(/salvar|confirmar|enviar|cadastrar|criar|atualizar/i)){
        if(btn.dataset.clicking) { e.preventDefault(); e.stopPropagation(); return; }
        btn.dataset.clicking = '1';
        setTimeout(function(){ delete btn.dataset.clicking; }, 2000);
      }
    }, true);
  });
  </script>

    <button onclick="recusarCorrida()" style="background:#ef4444;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer">✕ Recusar</button>

<script id="rebeca-corrida-fns">
// Funções de aceitar/recusar corrida para o popupAceitar
window._corridaAtual = null;

function mostrarPopupCorrida(corrida) {
  window._corridaAtual = corrida;
  var popup = document.getElementById('popupAceitar');
  var info  = document.getElementById('popupAceitarInfo');
  if (!popup) return;
  if (info) {
    info.textContent = (corrida.enderecoEntrega || corrida.destino || 'Nova corrida')
      + (corrida.valor ? ' — R$ ' + parseFloat(corrida.valor).toFixed(2) : '');
  }
  popup.style.display = 'flex';
  // Auto-fechar após 30s
  window._corridaTimer = setTimeout(function() {
    recusarCorrida();
  }, 30000);
}

function aceitarCorrida() {
  var popup = document.getElementById('popupAceitar');
  if (popup) popup.style.display = 'none';
  clearTimeout(window._corridaTimer);
  if (!window._corridaAtual) return;
  var token = localStorage.getItem('delivery_token') || '';
  fetch('/api/delivery/corridas/' + window._corridaAtual._id + '/aceitar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ token: token })
  })
  .then(r => r.json())
  .then(d => {
    if (d.sucesso || d.ok) {
      if (typeof carregarPedidos === 'function') carregarPedidos();
    } else {
      alert(d.erro || 'Erro ao aceitar corrida');
    }
  })
  .catch(e => console.error('aceitarCorrida:', e));
}

function recusarCorrida() {
  var popup = document.getElementById('popupAceitar');
  if (popup) popup.style.display = 'none';
  clearTimeout(window._corridaTimer);
  window._corridaAtual = null;
}
</script>
