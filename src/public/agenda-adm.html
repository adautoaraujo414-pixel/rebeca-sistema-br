
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="/agenda-icon-180.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Rebeca Agenda — Painel Gerencial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand */
  --cor:#f97316;--cor2:#ea580c;--cor3:#fff7ed;
  /* Semantic */
  --verde:#16a34a;--verde-bg:#f0fdf4;
  --amarelo:#d97706;--amarelo-bg:#fffbeb;
  --vermelho:#dc2626;--vermelho-bg:#fef2f2;
  --azul:#2563eb;--azul-bg:#eff6ff;
  --cinza:#6b7280;--cinza-bg:#f9fafb;
  /* Typography */
  --texto:#0f172a;--texto2:#334155;--texto3:#64748b;--texto4:#94a3b8;
  /* Surfaces */
  --borda:#e2e8f0;--borda2:#f1f5f9;--bg:#f8fafc;--white:#ffffff;--branco:#ffffff;
  /* Layout */
  --sidebar:240px;--header:64px;
  /* Shadows — Stripe-like */
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 8px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 24px rgba(0,0,0,.07),0 4px 8px rgba(0,0,0,.04);
  --shadow-xl:0 20px 40px rgba(0,0,0,.08),0 8px 16px rgba(0,0,0,.04);
  /* Radii */
  --radius:10px;--radius-sm:7px;--radius-lg:14px;--radius-xl:20px;
  /* Transitions */
  --transition:.15s ease;--transition-md:.2s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--texto);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv02","cv03","cv04","cv11"}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:'Inter',sans-serif}
input,select,textarea{font-family:'Inter',sans-serif}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ─── LOGIN ─── */
.login-wrap{min-height:100vh;display:flex;align-items:stretch;width:100%;overflow:hidden;background:#0d0d0d}
.login-left{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:48px 48px 48px 56px;background:linear-gradient(135deg,#0d0d0d 0%,#1a1a2e 100%);position:relative;overflow-y:auto;overflow-x:hidden}
.login-left::before{content:'';position:absolute;top:-200px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(255,107,0,.12) 0%,transparent 70%);pointer-events:none}
.login-left::after{content:'';position:absolute;bottom:-150px;left:-50px;width:400px;height:400px;background:radial-gradient(circle,rgba(255,107,0,.06) 0%,transparent 70%);pointer-events:none}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:56px}
.login-brand-icon{width:40px;height:40px;background:#ff6b00;border-radius:11px;display:flex;align-items:center;justify-content:center}
.login-brand-icon svg{width:22px;height:22px;fill:#fff}
.login-brand-txt{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:#fff}
.login-brand-txt span{color:#ff6b00}
.login-headline{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,2.5vw,2.6rem);font-weight:800;color:#fff;line-height:1.15;letter-spacing:-1px;margin-bottom:20px}
.login-headline span{color:#ff6b00}
.login-sub{font-size:.95rem;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:40px;max-width:380px}
.login-features{display:flex;flex-direction:column;gap:14px}
.login-feat{display:flex;align-items:center;gap:12px;font-size:.88rem;color:rgba(255,255,255,.7)}
.login-feat-icon{width:32px;height:32px;border-radius:9px;background:rgba(255,107,0,.15);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.login-chats{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.lc-label{font-size:.72rem;font-weight:700;color:rgba(255,107,0,.9);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.lc-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:7px;backdrop-filter:blur(8px)}
.lc-row{display:flex}.lc-row.r{justify-content:flex-end}
.lc-bubble{display:inline-block;border-radius:12px;padding:8px 12px;font-size:.75rem;line-height:1.5;max-width:82%}
.lc-bubble.c{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);border-bottom-left-radius:3px}
.lc-bubble.r{background:#ff6b00;color:#fff;border-bottom-right-radius:3px}
.login-right{width:480px;display:flex;flex-direction:column;justify-content:center;padding:60px 48px;background:#fff}
.login-card{background:transparent;border-radius:0;padding:0;width:100%;max-width:100%;box-shadow:none}
.login-logo{text-align:left;margin-bottom:36px}
.login-logo-icon{display:none}
.login-logo-txt{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#0d0d0d;margin-bottom:6px}
.login-logo-txt span{color:#ff6b00}
.login-logo p{color:#6b7280;font-size:.88rem;margin-top:0}
.login-card h2{font-size:1.6rem;font-weight:800;font-family:'Syne',sans-serif;color:#0d0d0d;margin-bottom:6px}
.login-card>p{color:#6b7280;font-size:.9rem;margin-bottom:32px}
@media(max-width:820px){.login-left{display:none}.login-right{width:100%;padding:40px 24px}}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82em;font-weight:600;color:var(--texto2);margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.9em;outline:none;transition:var(--transition);background:#fff;color:var(--texto);letter-spacing:-.01em}
.form-group input:focus{border-color:var(--cor);box-shadow:0 0 0 3px rgba(249,115,22,.12);background:#fff}
.btn-login{width:100%;padding:12px;background:var(--cor);color:#fff;border:none;border-radius:var(--radius-sm);font-size:.95em;font-weight:600;transition:var(--transition);letter-spacing:-.01em}
.btn-login:hover{background:var(--cor2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(249,115,22,.3)}
.btn-login:active{transform:translateY(0)}
.login-erro{color:var(--vermelho);font-size:.82em;text-align:center;margin-top:10px;display:none}
.login-link{text-align:center;margin-top:20px;font-size:.85em;color:var(--texto3)}
.login-link a{color:var(--cor);font-weight:600}

/* ─── LAYOUT PRINCIPAL ─── */
.app{display:none;width:100%;max-width:100vw;overflow-x:hidden}
.app.show{display:block}

/* ─── SIDEBAR ─── */
.sidebar{width:var(--sidebar);background:#fafafa;border-right:1px solid var(--borda2);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:var(--transition-md)}
.sidebar-header{padding:20px 16px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:10px}
.sidebar-logo-icon{width:32px;height:32px;background:var(--cor);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1em;flex-shrink:0;box-shadow:0 2px 8px rgba(249,115,22,.25)}
.sidebar-logo-txt{font-weight:700;font-size:.9em;line-height:1.2;letter-spacing:-.02em;color:var(--texto)}
.sidebar-logo-sub{font-size:.68em;color:var(--texto4);font-weight:400;letter-spacing:.01em}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-group-label{font-size:.63em;font-weight:600;color:var(--texto4);letter-spacing:.1em;text-transform:uppercase;padding:14px 12px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);font-size:.835em;font-weight:500;color:var(--texto3);margin-bottom:1px;border:none;background:none;width:100%;text-align:left;letter-spacing:-.01em;position:relative}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--texto2)}
.nav-item.ativo{background:rgba(249,115,22,.08);color:var(--cor);font-weight:600}
.nav-item.ativo .nav-icon{color:var(--cor)}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.55}
.nav-item.ativo .nav-icon{opacity:1}
.nav-item:hover .nav-icon{opacity:.8}
.nav-badge{margin-left:auto;background:var(--vermelho);color:#fff;font-size:.65em;font-weight:700;padding:2px 6px;border-radius:10px}
.nav-item.ativo .nav-badge{background:var(--cor)}
.sidebar-footer{padding:16px;border-top:1px solid var(--borda)}
.sidebar-plano{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid rgba(249,115,22,.15);border-radius:var(--radius-sm);padding:12px}
.sidebar-plano-icon{font-size:1em;margin-bottom:4px}
.sidebar-plano-nome{font-size:.8em;font-weight:700;color:var(--texto)}
.sidebar-plano-exp{font-size:.72em;color:var(--texto3);margin:2px 0 8px}
.sidebar-plano-btn{display:block;width:100%;text-align:center;padding:7px;background:var(--cor);color:#fff;border-radius:6px;font-size:.73em;font-weight:600;border:none;transition:var(--transition);letter-spacing:-.01em}
.sidebar-plano-btn:hover{background:var(--cor2);box-shadow:0 2px 8px rgba(249,115,22,.3)}

/* ─── MAIN ─── */
.main{margin-left:var(--sidebar);min-height:100svh;display:flex;flex-direction:column;width:calc(100% - var(--sidebar));overflow-x:hidden;min-width:0}

/* ─── HEADER DESKTOP ─── */
.header{height:56px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda2);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:90}
.header-unidade{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);cursor:pointer;font-size:.83em;font-weight:600;color:var(--texto2);background:#fff;transition:.2s}
.header-unidade:hover{border-color:var(--cor)}
.header-unidade svg{color:var(--cinza)}
.header-search{flex:1;max-width:400px;position:relative}
.header-search input{width:100%;padding:7px 14px 7px 36px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.83em;outline:none;background:var(--bg);transition:var(--transition);color:var(--texto);letter-spacing:-.01em}
.header-search input:focus{border-color:var(--cor);background:#fff;box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.header-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--cinza)}
.header-search-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.68em;color:var(--texto3);background:var(--borda);padding:2px 6px;border-radius:4px}
.header-spacer{flex:1}
.header-btn{width:34px;height:34px;background:transparent;border:1px solid var(--borda);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:var(--transition)}
.header-btn:hover{border-color:var(--borda);background:var(--bg)}
.header-notif-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--vermelho);color:#fff;font-size:.6em;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.header-ajuda{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.83em;font-weight:500;color:var(--texto3);cursor:pointer;background:#fff;transition:.2s}
.header-ajuda:hover{border-color:var(--cor);color:var(--cor)}
.header-perfil{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);cursor:pointer;transition:.2s}
.header-perfil:hover{border-color:var(--cor)}
.header-avatar{width:30px;height:30px;background:var(--cor);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8em}
.header-perfil-info{line-height:1.3}
.header-perfil-nome{font-size:.82em;font-weight:700}
.header-perfil-cargo{font-size:.7em;color:var(--texto3)}

/* ─── CONTENT ─── */
.content{flex:1;padding:28px 24px;box-sizing:border-box;width:100%;min-width:0;min-height:calc(100svh - 56px)}


/* ─── MOBILE DRAWER ─── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;pointer-events:none;opacity:0;transition:opacity .25s}
.sidebar-overlay.show{opacity:1;pointer-events:auto;display:block}
.mobile-menu-btn{display:none;width:36px;height:36px;background:transparent;border:1px solid var(--borda);border-radius:var(--radius-sm);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* ─── RESPONSIVIDADE ─── */
@media(max-width:1024px){
  :root{--sidebar:220px}
}
@media(max-width:768px){
  /* ── Reset arquitetural mobile ── */
  html,body{
    width:100%!important;
    max-width:100vw!important;
    overflow-x:hidden!important;
    -webkit-overflow-scrolling:touch;
  }
  body{padding-bottom:0!important}
  input,select,textarea{font-size:16px!important}

  /* ── Sidebar — oculta, desliza quando .open ── */
  .sidebar{
    display:flex!important;
    flex-direction:column!important;
    position:fixed!important;
    top:0;left:0;bottom:0;
    width:280px!important;
    transform:translateX(-100%);
    z-index:1000;
    background:#fff;
    box-shadow:0 0 40px rgba(0,0,0,.2);
    transition:transform .25s ease;
    overflow:hidden!important;
  }
  .sidebar-nav{
    flex:1!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))!important;
  }
  .sidebar-header{flex-shrink:0!important;padding-top:max(20px,env(safe-area-inset-top,20px))!important}
  .sidebar-footer{flex-shrink:0!important;padding-bottom:max(16px,env(safe-area-inset-bottom,16px))!important}
  .sidebar.open{transform:translateX(0)!important;height:100%!important;height:100dvh!important;overflow:hidden!important}
  .sidebar-overlay{display:block}

  /* ── Overscroll bounce iOS — sem cortina branca ── */
  html, body {
    background: var(--bg, #f8fafc) !important;
    overscroll-behavior-y: none !important;
  }
  /* ── Main — largura total, sem margin-left ── */
  .main{
    margin-left:0!important;
    width:100%!important;
    max-width:100vw!important;
    overflow-x:hidden!important;
    min-height:100svh!important;
    background:var(--bg,#f8fafc)!important;
  }

  /* ── Content — padding seguro + espaco bottom-nav ── */
  .content{
    width:100%!important;
    max-width:100vw!important;
    padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))!important;
    box-sizing:border-box!important;
    overflow-x:hidden!important;
  }

  /* ── Header desktop oculto, mobile visivel ── */
  .header{display:none}
  .mobile-header{display:flex}
  .mobile-menu-btn{display:none!important}
  .header-search-kbd{display:none}
  .header-ajuda span{display:none}

  /* ── Bottom nav ── */
  .bottom-nav{display:flex!important}
  .bottom-nav.nav-hidden{display:none!important}
  .mob-menu-fab{display:none!important}
  .fab{display:none!important}

  /* ── Grids responsivos ── */
  .metrics{grid-template-columns:1fr 1fr!important;gap:10px}
  .metric-card{padding:14px}
  .metric-icon{width:42px;height:42px;font-size:1.1em}
  .metric-val{font-size:1.4em}
  .acoes-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important;width:100%!important}
  .acao-card{width:100%!important;min-width:0!important}
  .main-grid{grid-template-columns:1fr!important;gap:16px}
  .main-grid .right{display:flex;flex-direction:column}
  .stats-grid{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .page-grid-2,.page-grid-3{grid-template-columns:1fr!important}
  .page-grid-4{grid-template-columns:repeat(2,1fr)!important}
  [style*="grid-template-columns:repeat(4"]{grid-template-columns:1fr 1fr!important}
  [style*="grid-template-columns:repeat(3"]{grid-template-columns:1fr!important}
  .form-row.cols-2,.form-row.cols-3{grid-template-columns:1fr!important}
  .wpp-cfg-grid{grid-template-columns:1fr!important}

  /* ── Tela headers ── */
  .tela-header{flex-direction:column!important;gap:8px!important}
  .page-header{flex-direction:column;gap:12px}
  .page-date{align-self:flex-start}

  /* ── Tabelas ── */
  table{display:block!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;width:100%!important}
  .tabela-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;width:100%!important}
  .tabela td,.tabela th{font-size:0.78em!important}

  /* ── Modais ── */
  .modal-body{flex:1 1 auto!important;min-height:0!important;overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px)) 20px!important}

  /* ── Safe area iOS ── */
  .bottom-nav{
    padding-bottom:env(safe-area-inset-bottom,0px)!important;
  }
  .content{
    padding-left:max(16px,env(safe-area-inset-left))!important;
    padding-right:max(16px,env(safe-area-inset-right))!important;
  }
}

@media(max-width:480px){
  .metrics{grid-template-columns:1fr!important}
  .page-grid-4{grid-template-columns:1fr!important}
  .content{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))!important}
  .acoes-grid{grid-template-columns:1fr 1fr!important}
}

/* ─── LAYOUT GLOBAL PADRÃO ─── */
.page-container{max-width:100%;width:100%}
.page-section{background:#fff;border:1px solid var(--borda);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.page-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.page-grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.page-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}

/* ─── TELA PADRÃO ─── */
.tela{display:none;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.tela.ativa{display:block}
.tela > .page-container,
.tela > div[style*="max-width"]{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
.page-title{font-size:1.45em;font-weight:700;color:var(--texto);letter-spacing:-.02em;line-height:1.2}
.page-subtitle{font-size:.83em;color:var(--texto3);margin-top:3px;font-weight:400}
.page-date{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.83em;font-weight:600;color:var(--texto2);background:#fff;cursor:pointer}

/* ─── METRICS ─── */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.metric-card{background:#fff;border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);border:1px solid var(--borda);display:flex;align-items:center;gap:16px;transition:var(--transition-md)}
.metric-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.metric-icon{width:52px;height:52px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.metric-icon.laranja{background:#fff7ed}
.metric-icon.amarelo{background:#fef3c7}
.metric-icon.roxo{background:#f3e8ff}
.metric-icon.verde{background:#dcfce7}
.metric-info{flex:1}
.metric-label{font-size:.7em;font-weight:600;color:var(--texto4);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.metric-val{font-size:1.7em;font-weight:700;color:var(--texto);line-height:1;letter-spacing:-.03em}
.metric-sub{font-size:.75em;margin-top:5px;font-weight:500}
.metric-sub.up{color:var(--verde)}
.metric-sub.warn{color:var(--amarelo)}
.metric-sub.info{color:var(--azul)}

/* ─── LINK PÚBLICO ─── */
.link-publico-card{background:#fff;border:1.5px solid var(--borda);border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:24px;box-shadow:var(--shadow)}
.link-publico-icon{width:40px;height:40px;background:var(--cor3);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-publico-info{flex:1}
.link-publico-titulo{font-weight:700;font-size:.9em}
.link-publico-url{font-size:.8em;color:var(--texto3);margin-top:2px}
.link-publico-btns{display:flex;gap:8px}
.btn-sm{padding:7px 14px;border-radius:var(--radius-sm);font-size:.8em;font-weight:600;border:1.5px solid;display:flex;align-items:center;gap:6px;transition:.2s}
.btn-sm.outline{border-color:var(--borda);color:var(--texto2);background:#fff}
.btn-sm.outline:hover{border-color:var(--cor);color:var(--cor)}
.btn-sm.primary{border-color:var(--cor);background:var(--cor);color:#fff}
.btn-sm.primary:hover{background:var(--cor2);border-color:var(--cor2)}

/* ─── GRID MAIN ─── */
.main-grid{display:grid;grid-template-columns:1fr minmax(0,380px);gap:20px;margin-bottom:24px}
.main-grid .left{display:flex;flex-direction:column;gap:20px}
.main-grid .right{display:flex;flex-direction:column;gap:20px}

/* ─── CARDS ─── */
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--borda);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between}
.card-title{font-weight:700;font-size:.95em;display:flex;align-items:center;gap:8px}
.card-title svg{color:var(--cor)}
.card-action{font-size:.8em;font-weight:600;color:var(--cor);cursor:pointer;border:none;background:none;display:flex;align-items:center;gap:4px}
.card-action:hover{color:var(--cor2)}
.card-body{padding:0}

/* ─── AGENDAMENTOS ─── */
.agenda-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #f3f4f6;transition:.15s}
.agenda-row:last-child{border-bottom:none}
.agenda-row:hover{background:#fafafa}
.agenda-hora{font-size:.9em;font-weight:700;color:var(--texto);min-width:48px}
.agenda-cliente{display:flex;align-items:center;gap:10px;flex:1}
.agenda-avatar{width:34px;height:34px;border-radius:50%;background:var(--cinza-bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;color:var(--texto2);flex-shrink:0;overflow:hidden}
.agenda-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.agenda-nome{font-weight:600;font-size:.85em}
.agenda-servico{font-size:.75em;color:var(--texto3)}
.agenda-sep{color:var(--borda);font-size:.8em}
.agenda-prof{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:1}
.agenda-prof-avatar{width:26px;height:26px;border-radius:50%;background:var(--cinza-bg);display:flex;align-items:center;justify-content:center;font-size:.65em;font-weight:700;flex-shrink:0}
.agenda-prof-nome{font-size:.78em;color:var(--texto2);font-weight:500}
.agenda-status{margin-left:auto}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.72em;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.badge-confirmado{background:var(--verde-bg);color:var(--verde)}
.badge-pendente{background:var(--amarelo-bg);color:var(--amarelo)}
.badge-cancelado{background:var(--vermelho-bg);color:var(--vermelho)}
.badge-finalizado{background:var(--azul-bg);color:var(--azul)}
.badge-falta{background:#fff7ed;color:var(--cor2)}
.agenda-wpp{width:32px;height:32px;background:#dcfce7;border:none;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0}
.agenda-wpp:hover{background:#bbf7d0}
.agenda-footer{padding:14px 20px;background:#fafafa;display:flex;align-items:center;justify-content:between;gap:12px}
.agenda-footer-txt{font-size:.8em;color:var(--texto3);flex:1}
.btn-agenda{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#fff;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.8em;font-weight:600;color:var(--texto2);cursor:pointer;transition:.2s}
.btn-agenda:hover{border-color:var(--cor);color:var(--cor)}

/* ─── HORÁRIOS LIVRES ─── */
.horarios-wrap{padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px}
.horario-chip{padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--borda);font-size:.82em;font-weight:600;color:var(--texto2);cursor:pointer;transition:.2s;background:#fff}
.horario-chip:hover{border-color:var(--cor);color:var(--cor);background:var(--cor3)}
.horario-chip.destaque{border-color:var(--cor);background:var(--cor3);color:var(--cor)}

/* ─── DESEMPENHO ─── */
.desempenho-header{padding:16px 20px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between}
.desempenho-nums{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--borda)}
.desempenho-num{padding:16px 20px;background:#fff}
.desempenho-num-val{font-size:1.5em;font-weight:800}
.desempenho-num-label{font-size:.75em;color:var(--texto3);margin-top:2px}
.desempenho-num-sub{font-size:.72em;margin-top:4px;font-weight:600}
.desempenho-num-sub.up{color:var(--verde)}
.chart-wrap{padding:20px;height:180px;position:relative}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;transition:.3s;min-height:4px}
.chart-bar.laranja{background:var(--cor)}
.chart-bar.cinza{background:#e5e7eb}
.chart-label{font-size:.65em;color:var(--texto3);white-space:nowrap}
.chart-legend{display:flex;gap:16px;padding:0 20px 16px;justify-content:center}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:.72em;color:var(--texto3)}
.chart-legend-dot{width:10px;height:10px;border-radius:2px}

/* ─── PROFISSIONAIS ─── */
.prof-card{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6;transition:.15s}
.prof-card:last-child{border-bottom:none}
.prof-card:hover{background:#fafafa}
.prof-avatar{width:44px;height:44px;border-radius:50%;background:var(--cor3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cor);font-size:.9em;flex-shrink:0;overflow:hidden}
.prof-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.prof-info{flex:1}
.prof-nome{font-weight:700;font-size:.88em}
.prof-esp{font-size:.75em;color:var(--texto3)}
.prof-stars{display:flex;align-items:center;gap:3px;margin-top:3px;font-size:.72em;font-weight:600;color:var(--amarelo)}
.prof-btn{padding:6px 12px;background:var(--cor3);border:1.5px solid rgba(249,115,22,.2);border-radius:6px;font-size:.73em;font-weight:700;color:var(--cor);cursor:pointer;transition:.2s}
.prof-btn:hover{background:var(--cor);color:#fff}

/* ─── SERVIÇOS ─── */
.servico-row{padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #f3f4f6}
.servico-row:last-child{border-bottom:none}
.servico-rank{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:800;flex-shrink:0}
.servico-rank.r1{background:#fff7ed;color:var(--cor)}
.servico-rank.r2{background:#f3f4f6;color:var(--texto2)}
.servico-rank.r3{background:#fef3c7;color:var(--amarelo)}
.servico-icon{width:30px;height:30px;background:var(--cinza-bg);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:.9em;flex-shrink:0}
.servico-nome{flex:1;font-size:.85em;font-weight:600}
.servico-qtd{font-size:.8em;font-weight:700;color:var(--texto);min-width:40px;text-align:right}
.servico-bar-wrap{width:80px;height:4px;background:var(--borda);border-radius:2px;overflow:hidden}
.servico-bar{height:100%;background:var(--cor);border-radius:2px;transition:.3s}

/* ─── AÇÕES RÁPIDAS ─── */
.acoes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-bottom:24px}
.acao-btn{background:#fff;border:1.5px solid var(--borda);border-radius:var(--radius-lg);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.2s;font-size:.75em;font-weight:600;color:var(--texto2)}
.acao-btn:hover{border-color:var(--cor);color:var(--cor);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.acao-icon{width:44px;height:44px;background:var(--cor3);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.2em;transition:.2s}
.acao-btn:hover .acao-icon{background:var(--cor);filter:brightness(10)}

/* ─── Ocultar botao IA flutuante (rai-fab) ─── */
#rai-fab { display: none !important; } #rai-widget { display: none !important; } [class*="rai-"] { display: none !important; }

/* ─── FAB no bottom-nav ─── */





/* ─── Menu Mobile Gaveta ─── */
.menu-mobile-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1001}
.menu-mobile-drawer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:1002;padding:0 0 env(safe-area-inset-bottom,24px);transform:translateY(100%);transition:transform .3s ease;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.menu-mobile-drawer.aberto{transform:translateY(0)}
.menu-mobile-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:700;font-size:1em;border-bottom:1px solid var(--borda)}
.menu-mobile-header button{background:none;border:none;font-size:1.3em;cursor:pointer;color:var(--texto3)}
.menu-mobile-item{display:block;width:100%;text-align:left;padding:14px 20px;background:none;border:none;font-size:.95em;color:var(--texto);cursor:pointer;border-bottom:1px solid #f3f4f6}
.menu-mobile-item:hover{background:#f9fafb}

/* ─── FAB antigo (ocultar) ─── */
.fab{display:none!important}
/* ─── FAB ─── */
.fab{position:fixed;bottom:28px;right:28px;width:56px;height:56px;background:var(--cor);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(249,115,22,.4);cursor:pointer;z-index:200;transition:.2s;color:#fff;font-size:1.4em}
.fab:hover{background:var(--cor2);transform:scale(1.08)}
.fab-label{position:absolute;right:64px;background:var(--texto);color:#fff;padding:6px 12px;border-radius:var(--radius-sm);font-size:.78em;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}
.fab:hover .fab-label{opacity:1}

/* ─── TOAST ─── */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:.85em;z-index:9999;display:none;box-shadow:var(--shadow-lg)}

/* ─── TELAS SECUNDÁRIAS ─── */

.tela-header{padding:0 0 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tela-titulo{font-size:1.35em;font-weight:700;letter-spacing:-.02em;color:var(--texto);line-height:1.2}
.tela-sub{font-size:.82em;color:var(--texto3);margin-top:2px;font-weight:400}

/* ─── TABELA ─── */
.tabela-wrap{background:#fff;border:1px solid var(--borda);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.tabela{width:100%;border-collapse:collapse}
.tabela th{background:#f9fafb;padding:11px 16px;font-size:.75em;font-weight:700;color:var(--texto3);text-align:left;border-bottom:1px solid var(--borda);letter-spacing:.03em;text-transform:uppercase}
.tabela td{padding:12px 16px;font-size:.85em;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.tabela tr:last-child td{border-bottom:none}
.tabela tr:hover td{background:#fafafa}
.tabela-acoes{display:flex;gap:6px}
.btn-tabela{padding:5px 10px;border-radius:6px;font-size:.72em;font-weight:600;border:1.5px solid var(--borda);background:#fff;color:var(--texto2);cursor:pointer;transition:.2s}
.btn-tabela:hover{border-color:var(--cor);color:var(--cor)}
.btn-tabela.danger:hover{border-color:var(--vermelho);color:var(--vermelho)}
.btn-tabela.wpp{border-color:#dcfce7;background:#dcfce7;color:var(--verde)}
.btn-tabela.wpp:hover{background:#bbf7d0}

/* ─── FORMULÁRIOS ─── */
.form-card{background:#fff;border:1px solid var(--borda);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.form-section-title{font-size:.8em;font-weight:700;color:var(--texto3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--borda)}
.form-row{display:grid;gap:16px;margin-bottom:16px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-label{display:block;font-size:.8em;font-weight:600;color:var(--texto2);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 13px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.9em;outline:none;transition:.2s;background:#fff;color:var(--texto)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--cor);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.form-textarea{resize:vertical;min-height:80px}
.form-btns{display:flex;gap:10px;margin-top:8px}
.btn-primary{padding:10px 20px;background:var(--cor);color:#fff;border:none;border-radius:var(--radius-sm);font-size:.88em;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}
.btn-primary:hover{background:var(--cor2)}
.btn-secondary{padding:10px 20px;background:#fff;color:var(--texto2);border:1.5px solid var(--borda);border-radius:var(--radius-sm);font-size:.88em;font-weight:600;cursor:pointer;transition:.2s}
.btn-secondary:hover{border-color:var(--cor);color:var(--cor)}
.btn-danger{padding:10px 20px;background:#fff;color:var(--vermelho);border:1.5px solid var(--vermelho-bg);border-radius:var(--radius-sm);font-size:.88em;font-weight:600;cursor:pointer;transition:.2s}
.btn-danger:hover{background:var(--vermelho-bg)}

/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:48px 24px}
.empty-state-icon{font-size:3em;margin-bottom:16px;opacity:.4}
.empty-state-titulo{font-weight:700;font-size:1em;margin-bottom:8px}
.empty-state-sub{font-size:.85em;color:var(--texto3);margin-bottom:20px}

/* ─── LOADING ─── */
.skeleton{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ─── MODAL ─── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1010;align-items:flex-end;justify-content:flex-end;overflow:hidden;touch-action:none}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between}
.modal-titulo{font-weight:800;font-size:1.05em}
.modal-close{background:none;border:none;font-size:1.3em;color:var(--texto3);cursor:pointer;line-height:1}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--borda);display:flex;gap:10px;justify-content:flex-end}

/* ─── MOBILE ─── */
.mobile-header{display:none;height:56px;background:#fff;border-bottom:1px solid var(--borda);align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.mobile-logo{display:flex;align-items:center;gap:8px}
.mobile-logo-icon{width:34px;height:34px;background:var(--cor);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1em}
.mobile-logo-nome{font-weight:800;font-size:.9em}
.mobile-logo-sub{font-size:.65em;color:var(--texto3)}
.mobile-header-right{display:flex;align-items:center;gap:8px}
.mobile-notif{width:34px;height:34px;background:#f9fafb;border:1.5px solid var(--borda);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.mobile-notif-badge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;background:var(--vermelho);color:#fff;font-size:.6em;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mobile-avatar{width:34px;height:34px;background:var(--cor);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8em}

/* ─── MENU FLUTUANTE MOBILE ─── */
.mob-menu-fab{display:none;position:fixed;left:16px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:var(--cor);border:none;border-radius:50%;box-shadow:0 4px 16px rgba(249,115,22,.35);z-index:300;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.1em;transition:.2s}
.mob-menu-fab:hover{background:var(--cor2);transform:translateY(-50%) scale(1.05)}

/* ─── DRAWER MOBILE ─── */
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400}
.drawer-bg.open{display:block}
.drawer{position:fixed;left:0;top:0;width:var(--sidebar);height:100vh;background:#fff;z-index:401;display:none;flex-direction:column;transform:translateX(-110%);transition:transform .25s ease}
.drawer.open{display:flex!important;transform:translateX(0)}

/* ─── BOTTOM NAV MOBILE ─── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);padding:8px 0 env(safe-area-inset-bottom,16px);z-index:200;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bottom-nav-items{display:flex;width:100%;justify-content:space-around}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 4px;border:none;background:none;color:var(--texto3);font-size:.7em;font-weight:500;transition:color .2s;min-width:0}
.bottom-nav-item.ativo{color:var(--cor)}
.bottom-nav-item svg{width:22px;height:22px}

/* ─── RESPONSIVE ─── */
@media(max-width:1024px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .acoes-grid{grid-template-columns:repeat(3,1fr)}
  .main-grid{grid-template-columns:1fr}
  .main-grid .right{display:grid;grid-template-columns:1fr 1fr;gap:20px}
}


.fin-filtro{padding:6px 14px;background:var(--branco);border:1.5px solid var(--borda);border-radius:20px;font-size:.78em;font-weight:600;cursor:pointer;color:var(--texto2)}
.fin-filtro.ativo{background:var(--cor);border-color:var(--cor);color:#fff}

/* ── ALERTS DISMISSÍVEIS ─────────────────────────────────────────── */
.alert-dismissible{position:relative;display:flex;align-items:center;gap:12px;padding:12px 40px 12px 16px;border-radius:10px;font-size:.85em;font-weight:500;margin-bottom:12px;animation:alertIn .25s ease}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.alert-dismissible.fadeout{animation:alertOut .3s ease forwards}
@keyframes alertOut{to{opacity:0;transform:translateY(-6px)}}
.alert-dismissible .alert-close{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1em;opacity:.5;padding:4px 6px;border-radius:4px;line-height:1}
.alert-dismissible .alert-close:hover{opacity:1;background:rgba(0,0,0,.08)}
.alert-info{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1d4ed8}
.alert-warning{background:#fffbeb;border:1.5px solid #fde68a;color:#92400e}
.alert-success{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d}
.alert-security{background:#fefce8;border:1.5px solid #fef08a;color:#713f12}
/* SW update banner */
#sw-update-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#1e293b;color:#fff;padding:10px 48px 10px 20px;font-size:.84em;font-weight:600;display:none;align-items:center;gap:12px}
#sw-update-banner button.reload-btn{background:#f97316;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:.82em;font-weight:700;cursor:pointer;margin-left:8px}
#sw-update-banner .close-banner{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:1.1em;cursor:pointer;opacity:.7}
#sw-update-banner .close-banner:hover{opacity:1}

/* ── WPP conteudo — isolado ─────────────────────────────────────────────── */
#wpp-conteudo-147[style*="flex"], #wpp-conteudo-147[style*="block"] {
  flex-direction: column;
  gap: 16px;
}



/* ═══ WPP — CSS minimal, sem hacks ══════════════════════════════════════ */
.wpp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:20px}
.wpp-stat-card{padding:16px!important}
.wpp-stat-label{font-size:.7em;font-weight:600;color:var(--texto4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.wpp-stat-value{font-weight:700;font-size:1em}
.wpp-stat-num{font-size:1.4em;letter-spacing:-.02em}
.wpp-stat-alerta{color:var(--vermelho)}
.wpp-stat-sub{font-size:.72em;color:var(--texto3);margin-top:4px}
.wpp-upgrade-card{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fdba74;border-radius:var(--radius-lg);padding:32px;text-align:center;margin-bottom:20px}
.wpp-upgrade-icon{font-size:1.4em;margin-bottom:10px}
.wpp-upgrade-title{font-weight:800;font-size:1em;margin-bottom:6px}
.wpp-upgrade-desc{font-size:.83em;color:var(--texto2);margin-bottom:16px;max-width:400px;margin-inline:auto}
.wpp-upgrade-features{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wpp-feature-tag{background:var(--branco);border-radius:8px;padding:8px 14px;font-size:.8em;font-weight:700}
.wpp-conteudo{display:flex;flex-direction:column;gap:16px}
.wpp-bloco-title{font-weight:700;font-size:.9em;margin-bottom:4px}
.wpp-bloco-sub{font-size:.78em;color:var(--texto3);margin-bottom:16px}
.wpp-status-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.wpp-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.wpp-dot-off{background:#9ca3af}.wpp-dot-on{background:#22c55e}
.wpp-status-txt-bold{font-weight:700;font-size:.9em}
.wpp-status-num{font-size:.78em;color:var(--texto3)}
.wpp-rebeca-card{display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-radius:12px;padding:16px;margin-bottom:16px}
.wpp-rebeca-icon{width:48px;height:48px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3em;flex-shrink:0}
.wpp-rebeca-info{flex:1;min-width:0}
.wpp-rebeca-nome{font-weight:800;font-size:.88em;margin-bottom:2px}
.wpp-rebeca-num{font-size:.82em;color:#16a34a;font-weight:700;margin-bottom:4px}
.wpp-rebeca-desc{font-size:.75em;color:var(--texto3)}
.wpp-rebeca-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:1;min-width:0}
.btn-wpp-green{padding:8px 14px;background:#25d366;color:#fff;border-radius:8px;font-size:.78em;font-weight:700;text-decoration:none;text-align:center;white-space:nowrap;display:block}
.btn-wpp-outline{padding:8px 14px;background:var(--branco);border:1.5px solid #86efac;color:#16a34a;border-radius:8px;font-size:.78em;font-weight:700;text-decoration:none;text-align:center;white-space:nowrap;display:block}
.wpp-input-block{background:#f8fafc;border:1px solid var(--borda);border-radius:10px;padding:16px;margin-bottom:12px}
.wpp-input-title{font-size:.82em;font-weight:700;margin-bottom:6px}
.wpp-input-desc{font-size:.75em;color:var(--texto3);margin-bottom:10px}
.wpp-input-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wpp-input{flex:1;min-width:160px;padding:9px 12px;border:1.5px solid var(--borda);border-radius:8px;font-size:.85em}
.wpp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.wpp-step{background:#f8fafc;border-radius:8px;padding:12px;text-align:center}
.wpp-step-icon{font-size:1.3em;margin-bottom:4px}
.wpp-step-title{font-size:.72em;font-weight:700;margin-bottom:2px}
.wpp-step-desc{font-size:.68em;color:var(--texto3)}
.wpp-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wpp-section-title{font-weight:700;font-size:.9em}
.wpp-section-sub{font-size:.75em;color:var(--texto3);font-weight:500}
.wpp-empty{text-align:center;padding:24px;color:var(--texto3);font-size:.85em}
.wpp-logs-scroll{max-height:300px;overflow-y:auto}
.wpp-cfg-grid{display:grid;gap:14px}
.wpp-cfg-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.wpp-cfg-info{flex:1;min-width:0}
.wpp-cfg-nome{font-size:.85em;font-weight:600}
.wpp-cfg-desc{font-size:.75em;color:var(--texto3)}
.wpp-toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.wpp-toggle input{opacity:0;width:0;height:0}
.wpp-toggle-track{position:absolute;inset:0;background:#d1d5db;border-radius:12px;transition:background .2s}
.wpp-toggle input:checked + .wpp-toggle-track{background:var(--cor)}
.wpp-toggle-track::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.wpp-toggle input:checked + .wpp-toggle-track::after{transform:translateX(20px)}
@media(max-width:900px){.wpp-stats{grid-template-columns:repeat(2,1fr)}.wpp-rebeca-card{flex-wrap:wrap}.wpp-rebeca-btns{flex-direction:row;width:100%}}
@media(max-width:520px){.wpp-stats{grid-template-columns:1fr 1fr;gap:10px}.wpp-steps{grid-template-columns:1fr}.wpp-rebeca-btns{flex-direction:column}}

// ── SIDEBAR MOBILE DRAWER ──────────────────────────────────────────────────

// Toggle gráfico mobile
function toggleGraficoMobile() {
  const wrap = document.getElementById('chart-wrap');
  const legend = document.getElementById('chart-legend');
  const btn = document.getElementById('btn-ver-grafico');
  if (!wrap) return;
  const oculto = wrap.classList.toggle('mobile-oculto');
  if (legend) legend.classList.toggle('mobile-oculto');
  btn.textContent = oculto ? '📊 Ver gráfico completo ▼' : '📊 Ocultar gráfico ▲';
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}
// Fechar sidebar ao navegar no mobile
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar && sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
        overlay && overlay.classList.remove('show');
        document.body.style.overflow = '';
      }
    }
  });
});
</script>

<script>
// FIX SCROLL MODAL iOS Safari
(function(){
  // Intercepta touchmove no modal-bg e redireciona para modal-body
  document.addEventListener('touchstart', function(e){
    var bg = e.target.closest('.modal-bg.open');
    if(!bg) return;
    var body = bg.querySelector('.modal-body');
    if(!body) return;
    bg._touchY = e.touches[0].clientY;
    bg._body = body;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    var bg = e.target.closest('.modal-bg.open');
    if(!bg || !bg._body) return;
    var body = bg._body;
    var dy = bg._touchY - e.touches[0].clientY;
    bg._touchY = e.touches[0].clientY;

    // Verificar se pode rolar
    var atTop    = body.scrollTop <= 0;
    var atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 1;

    // Se está no limite e tenta sair, bloqueia propagação
    if((dy < 0 && atTop) || (dy > 0 && atBottom)){
      e.preventDefault();
      return;
    }
    // Rola o modal-body manualmente
    body.scrollTop += dy;
    e.preventDefault();
  }, {passive:false});

  // Garantir que modal-body recalcula após abrir
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-modal]');
    if(!btn) return;
    setTimeout(function(){
      var id = btn.getAttribute('data-modal');
      var mb = document.querySelector('#'+id+' .modal-body, [data-modal-id="'+id+'"] .modal-body');
      if(mb){ mb.scrollTop = 0; }
    }, 50);
  });
})();
</script>
