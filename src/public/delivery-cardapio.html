<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cardápio Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#f97316;--accent2:#fb923c;--bg:#0a0a0f;--surface:#13131f;
  --surface2:#1a1a2e;--surface3:#222238;--border:#2a2a40;
  --text:#ffffff;--text2:#c8c8d8;--text3:#7878a0;--green:#22c55e;--red:#ef4444;
  --radius:16px;--radius-sm:10px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:120px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */
.header{background:linear-gradient(135deg,#1a0a00,#2a1000);border-bottom:1px solid rgba(249,115,22,.2);padding:16px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.header-logo{width:44px;height:44px;border-radius:12px;object-fit:cover;border:2px solid var(--accent)}
.header-logo-ph{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.header-info{flex:1}
.header-name{font-size:1.1em;font-weight:800;color:var(--text)}
.header-sub{font-size:.75em;color:var(--text3);margin-top:2px}
.badge-status{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700}
.badge-aberto{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge-fechado{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.88em;font-family:inherit;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9em;pointer-events:none}

/* INFO BAR */
.info-bar{display:flex;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.info-bar::-webkit-scrollbar{display:none}
.info-item{display:flex;align-items:center;gap:6px;font-size:.75em;color:var(--text2);white-space:nowrap;flex-shrink:0}
.info-item strong{color:var(--text)}

/* CATEGORIAS */
.cats-nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90}
.cats-nav::-webkit-scrollbar{display:none}
.cat-btn{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.78em;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;font-family:inherit}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* SEÇÃO CATEGORIA */
.section{padding:16px}
.section-title{font-size:.7em;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}

/* CARD ITEM */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.item-card:hover,.item-card:active{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.15)}
.item-card.indisponivel{opacity:.45;pointer-events:none}
.item-img{width:100%;height:100px;object-fit:cover;background:var(--surface2)}
.item-img-ph{width:100%;height:100px;background:linear-gradient(135deg,var(--surface2),var(--surface3));display:flex;align-items:center;justify-content:center;font-size:2.2em}
.item-body{padding:10px}
.item-name{font-size:.82em;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.item-desc{font-size:.72em;color:var(--text3);margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-footer{display:flex;align-items:center;justify-content:space-between}
.item-price{font-size:.9em;font-weight:800;color:var(--accent)}
.item-add-btn{width:28px;height:28px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.item-add-btn:active{transform:scale(.9)}
.item-badge-cart{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.72em;font-weight:800;display:none;align-items:center;justify-content:center}
.item-badge-cart.show{display:flex}

/* MODAL ITEM */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.modal-item{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.modal-img{width:100%;height:200px;object-fit:cover}
.modal-img-ph{width:100%;height:140px;background:linear-gradient(135deg,var(--surface2),var(--surface3));display:flex;align-items:center;justify-content:center;font-size:4em}
.modal-body{padding:20px}
.modal-name{font-size:1.2em;font-weight:800;margin-bottom:6px}
.modal-desc{font-size:.85em;color:var(--text2);line-height:1.6;margin-bottom:12px}
.modal-price{font-size:1.1em;font-weight:800;color:var(--accent);margin-bottom:20px}
.modal-section{margin-bottom:18px}
.modal-section-title{font-size:.72em;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.ingr-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.ingr-item:last-child{border-bottom:none}
.ingr-nome{font-size:.85em;color:var(--text2)}
.btn-retirar{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:.72em;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-retirar.retirado{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:var(--red);text-decoration:line-through}
.obs-input{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.85em;resize:none;height:70px;outline:none;margin-bottom:20px}
.obs-input:focus{border-color:var(--accent)}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.qty-ctrl{display:flex;align-items:center;gap:14px}
.qty-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.qty-num{font-size:1.1em;font-weight:800;min-width:24px;text-align:center}
.btn-add-cart{width:100%;padding:14px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-weight:800;font-size:.95em;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-add-cart:hover{background:var(--accent2)}
.btn-add-cart:active{transform:scale(.98)}

/* CARRINHO FLUTUANTE */
.cart-fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:50px;padding:14px 24px;font-weight:800;font-size:.9em;cursor:pointer;font-family:inherit;display:none;align-items:center;gap:10px;z-index:400;box-shadow:0 8px 32px rgba(249,115,22,.4);white-space:nowrap;transition:all .2s}
.cart-fab.show{display:flex}
.cart-fab:hover{background:var(--accent2);transform:translateX(-50%) translateY(-2px)}
.cart-badge{background:#fff;color:var(--accent);border-radius:20px;padding:2px 10px;font-size:.82em;font-weight:900}

/* MODAL CARRINHO */
.overlay-cart{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:none;flex-direction:column;align-items:center;justify-content:flex-end;backdrop-filter:blur(8px)}
.overlay-cart.show{display:flex}
.cart-modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
.cart-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-header h3{font-size:1em;font-weight:800}
.btn-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.cart-items{flex:1;overflow-y:auto;padding:16px 20px}
.cart-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:none}
.cart-row-img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.cart-row-img-ph{width:52px;height:52px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0}
.cart-row-info{flex:1;min-width:0}
.cart-row-name{font-size:.85em;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-row-obs{font-size:.72em;color:var(--text3);margin-top:2px}
.cart-row-price{font-size:.85em;font-weight:800;color:var(--accent);flex-shrink:0}
.cart-row-qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cqty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9em}
.cqty-btn:hover{border-color:var(--accent);color:var(--accent)}
.cqty-num{font-size:.85em;font-weight:700;min-width:18px;text-align:center}

/* CHECKOUT */
.cart-footer{padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.checkout-tipo{display:flex;gap:8px;margin-bottom:14px}
.tipo-btn{flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.82em;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.tipo-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.checkout-fields{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.checkout-fields input,.checkout-fields textarea{padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.85em;outline:none;transition:border-color .2s;width:100%}
.checkout-fields input:focus,.checkout-fields textarea:focus{border-color:var(--accent)}
.checkout-fields textarea{resize:none;height:60px}
.tempo-retirada{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius-sm);padding:12px 14px;font-size:.82em;color:var(--accent);margin-bottom:14px;display:none}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cart-total-label{font-size:.85em;color:var(--text2)}
.cart-total-val{font-size:1.2em;font-weight:900;color:var(--green)}
.btn-finalizar{width:100%;padding:15px;border-radius:var(--radius);border:none;background:var(--green);color:#fff;font-weight:800;font-size:.95em;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-finalizar:hover{opacity:.9}
.btn-finalizar:disabled{opacity:.5;cursor:not-allowed}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;font-size:.85em;font-weight:600;color:var(--text);z-index:9000;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1}

/* RESULTADO */
.resultado-wrap{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.resultado-wrap.show{display:flex}
.resultado-icon{font-size:4em;margin-bottom:16px}
.resultado-titulo{font-size:1.4em;font-weight:900;margin-bottom:8px}
.resultado-sub{font-size:.88em;color:var(--text2);margin-bottom:24px;line-height:1.6}
.resultado-tempo{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);padding:16px 24px;margin-bottom:24px;font-size:.9em;color:var(--accent);font-weight:700}
.btn-novo-pedido{padding:14px 32px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-weight:800;font-size:.95em;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="loading">
  <div style="font-size:2.5em;margin-bottom:8px">🍔</div>
  <div class="spinner"></div>
  <div style="font-size:.85em;color:var(--text3);margin-top:8px">Carregando cardápio...</div>
</div>

<!-- HEADER -->
<div class="header" id="header" style="display:none">
  <div class="header-top">
    <div class="header-logo-ph" id="headerLogoWrap">🍽️</div>
    <div class="header-info">
      <div class="header-name" id="headerNome">Restaurante</div>
      <div class="header-sub" id="headerSub">Cardápio Digital</div>
    </div>
    <span class="badge-status badge-aberto" id="badgeStatus">● Aberto</span>
  </div>
  <div class="search-wrap">
    <span class="sicon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar no cardápio..." oninput="filtrarBusca(this.value)">
  </div>
</div>

<!-- INFO BAR -->
<div class="info-bar" id="infoBar" style="display:none">
  <div class="info-item">📍 <strong id="infoEndereco">—</strong></div>
  <div class="info-item">📞 <strong id="infoTelefone">—</strong></div>
  <div class="info-item">🕐 <strong id="infoHorario">—</strong></div>
</div>

<!-- CATEGORIAS -->
<div class="cats-nav" id="catsNav" style="display:none"></div>

<!-- CONTEÚDO -->
<div id="conteudo"></div>

<!-- FAB CARRINHO -->
<button class="cart-fab" id="cartFab" onclick="abrirCarrinho()">
  🛒 Ver pedido
  <span class="cart-badge" id="cartBadge">0</span>
  <span id="cartFabTotal">R$ 0,00</span>
</button>

<!-- MODAL ITEM -->
<div class="overlay" id="overlayItem" onclick="fecharItem(event)">
  <div class="modal-item" id="modalItem">
    <div class="modal-handle"></div>
    <div id="modalItemConteudo"></div>
  </div>
</div>

<!-- MODAL CARRINHO -->
<div class="overlay-cart" id="overlayCart">
  <div class="cart-modal">
    <div class="cart-header">
      <h3>🛒 Seu pedido</h3>
      <button class="btn-close" onclick="fecharCarrinho()">✕</button>
    </div>
    <div class="cart-items" id="cartItens"></div>
    <div class="cart-footer">
      <div class="checkout-tipo">
        <button class="tipo-btn active" id="btnEntrega" onclick="setTipo('entrega')">🛵 Entrega</button>
        <button class="tipo-btn" id="btnRetirada" onclick="setTipo('retirada')">🏪 Retirada</button>
      </div>
      <div class="checkout-fields" id="checkoutFields">
        <input type="text" id="campoNome" placeholder="Seu nome *">
        <input type="tel" id="campoTelefone" placeholder="WhatsApp *">
        <input type="text" id="campoEndereco" placeholder="Endereço completo *" id="campoEntrega">
        <textarea id="campoObs" placeholder="Observações do pedido (opcional)"></textarea>
      </div>
      <div class="tempo-retirada" id="tempoRetirada">
        ⏱️ Tempo estimado para retirada: <span id="tempoVal">—</span>
      </div>
      <div class="cart-total-row">
        <span class="cart-total-label">Total do pedido</span>
        <span class="cart-total-val" id="cartTotal">R$ 0,00</span>
      </div>
      <button class="btn-finalizar" id="btnFinalizar" onclick="finalizarPedido()">✅ Finalizar pedido</button>
    </div>
  </div>
</div>

<!-- RESULTADO -->
<div class="resultado-wrap" id="resultadoWrap">
  <div class="resultado-icon">🎉</div>
  <div class="resultado-titulo" id="resultTitulo">Pedido enviado!</div>
  <div class="resultado-sub" id="resultSub">Seu pedido foi recebido com sucesso.</div>
  <div class="resultado-tempo" id="resultTempo" style="display:none"></div>
  <button class="btn-novo-pedido" onclick="novoPedido()">🛒 Fazer novo pedido</button>
</div>

<div class="toast" id="toast"></div>

<script>
var adminId = location.pathname.split('/').filter(Boolean).pop();
var params = new URLSearchParams(location.search);
var tipoAtual = 'entrega';
var carrinho = [];
var cardapioData = null;
var itemAtual = null;
var ingrRetirados = [];
var qtyAtual = 1;

async function init() {
  try {
    var r = await fetch('/api/delivery/cardapio-publico/' + adminId);
    if (!r.ok) throw new Error('Erro ' + r.status);
    cardapioData = await r.json();
    // Buscar combos em paralelo
    try {
      var rc = await fetch('/api/delivery/combos-publicos/' + adminId);
      cardapioData.combos = rc.ok ? await rc.json() : [];
    } catch(ec) { cardapioData.combos = []; }
    renderizar();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div style="font-size:2em">😕</div><div style="color:var(--text3);margin-top:12px;font-size:.9em">Cardápio indisponível no momento.</div><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;border-radius:20px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-family:inherit">Tentar novamente</button>';
  }
}

function renderizar() {
  var d = cardapioData;
  var rest = d.restaurante || d;

  // Header
  document.getElementById('headerNome').textContent = rest.nomeComercio || rest.nome || 'Restaurante';
  document.getElementById('headerSub').textContent = rest.tipoNegocio || 'Cardápio Digital';
  if (rest.logo) {
    var img = document.createElement('img');
    img.src = rest.logo;
    img.className = 'header-logo';
    document.getElementById('headerLogoWrap').replaceWith(img);
  }
  var aberto = rest.aberto !== false;
  var badge = document.getElementById('badgeStatus');
  badge.textContent = aberto ? '● Aberto' : '● Fechado';
  badge.className = 'badge-status ' + (aberto ? 'badge-aberto' : 'badge-fechado');

  // Info bar
  if (rest.endereco) document.getElementById('infoEndereco').textContent = rest.endereco;
  if (rest.telefone) document.getElementById('infoTelefone').textContent = rest.telefone;
  if (rest.horarioFuncionamento) document.getElementById('infoHorario').textContent = rest.horarioFuncionamento;

  // Mostrar UI
  document.getElementById('loading').style.display = 'none';
  document.getElementById('header').style.display = 'block';
  document.getElementById('infoBar').style.display = 'flex';
  document.getElementById('catsNav').style.display = 'flex';

  // Categorias
  var cats = d.categorias || [];
  var itens = d.itens || d.cardapio || [];
  var catsNav = document.getElementById('catsNav');
  catsNav.innerHTML = '<button class="cat-btn active" data-cat="todas" onclick="filtrarCat(\'todas\',this)">🍽️ Todos</button>';
  // Botão combos
  if (cardapioData && cardapioData.combos && cardapioData.combos.length) {
    var btnC = document.createElement('button');
    btnC.className = 'cat-btn';
    btnC.dataset.cat = '_combos';
    btnC.textContent = '🎁 Combos';
    btnC.onclick = function(){ filtrarCat('_combos', btnC); };
    catsNav.appendChild(btnC);
  }
  cats.forEach(function(c) {
    var temItens = itens.some(function(i){ return i.categoria === c._id || i.categoria?._id === c._id; });
    if (!temItens) return;
    var btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = c._id;
    btn.textContent = (c.emoji||'') + ' ' + c.nome;
    btn.onclick = function(){ filtrarCat(c._id, btn); };
    catsNav.appendChild(btn);
  });

  renderItens(itens, cats);
}

function renderItens(itens, cats) {
  var d = cardapioData;
  cats = cats || d.categorias || [];
  itens = itens || d.itens || d.cardapio || [];
  var conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '';

  // Agrupar por categoria
  var grupos = {};
  var ordemCats = [];
  cats.forEach(function(c){ grupos[c._id] = {cat:c, itens:[]}; ordemCats.push(c._id); });

  itens.forEach(function(item) {
    var catId = item.categoria?._id || item.categoria;
    if (catId && grupos[catId]) grupos[catId].itens.push(item);
    else {
      if (!grupos['_sem']) { grupos['_sem'] = {cat:{nome:'Outros',emoji:'📦'},itens:[]}; ordemCats.push('_sem'); }
      grupos['_sem'].itens.push(item);
    }
  });

  ordemCats.forEach(function(catId) {
    var grupo = grupos[catId];
    if (!grupo || !grupo.itens.length) return;
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.cat = catId;
    sec.innerHTML = '<div class="section-title">' + (grupo.cat.emoji||'') + ' ' + grupo.cat.nome + '</div>' +
      '<div class="items-grid" id="grid-' + catId + '"></div>';
    conteudo.appendChild(sec);
    var grid = sec.querySelector('.items-grid');
    grupo.itens.forEach(function(item){ grid.appendChild(criarCard(item)); });
  });

  // Seção de combos
  var combos = (cardapioData && cardapioData.combos) || [];
  if (combos.length) {
    var secCombo = document.createElement('div');
    secCombo.className = 'section';
    secCombo.dataset.cat = '_combos';
    secCombo.innerHTML = '<div class="section-title">🎁 Combos Especiais</div>' +
      '<div class="items-grid" id="grid-combos"></div>';
    conteudo.appendChild(secCombo);
    var gridC = secCombo.querySelector('.items-grid');
    combos.forEach(function(combo) { gridC.appendChild(criarCardCombo(combo)); });
  }
}

function criarCard(item) {
  var div = document.createElement('div');
  div.className = 'item-card' + (item.disponivel === false ? ' indisponivel' : '');
  div.dataset.id = item._id;
  div.dataset.nome = item.nome;
  div.onclick = function(){ abrirItem(item); };

  var imgHtml = item.imagem
    ? '<img class="item-img" src="' + item.imagem + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=item-img-ph>🍽️</div>\'">'
    : '<div class="item-img-ph">' + (item.categoria?.emoji || '🍽️') + '</div>';

  var qtdNoCart = carrinho.filter(function(c){ return c.itemId === item._id; }).reduce(function(a,b){ return a+b.qty; }, 0);

  div.innerHTML = imgHtml +
    '<div class="item-badge-cart' + (qtdNoCart > 0 ? ' show' : '') + '" id="badge-' + item._id + '">' + (qtdNoCart||'') + '</div>' +
    '<div class="item-body">' +
      '<div class="item-name">' + item.nome + '</div>' +
      '<div class="item-desc">' + (item.descricao||'') + '</div>' +
      '<div class="item-footer">' +
        '<div class="item-price">R$ ' + Number(item.preco||0).toFixed(2).replace('.',',') + '</div>' +
        '<button class="item-add-btn" onclick="event.stopPropagation();adicionarRapido(event,\'' + item._id + '\')">+</button>' +
      '</div>' +
    '</div>';
  return div;
}

function criarCardCombo(combo) {
  var div = document.createElement('div');
  div.className = 'item-card';
  div.dataset.id = combo._id;
  div.dataset.nome = combo.nome;

  var imgHtml = combo.imagem
    ? '<img class="item-img" src="' + combo.imagem + '" loading="lazy" onerror=\"this.parentNode.style.display=\'none\'">'
    : '<div class="item-img-ph">🎁</div>';

  var itensList = (combo.itens||[]).map(function(i){ return i.quantidade + 'x ' + i.nome; }).join(' + ');
  var total = (combo.itens||[]).reduce(function(a,i){ return a + (i.preco||0)*(i.quantidade||1); }, 0);
  var economia = total > combo.preco ? '<span style="font-size:.68em;color:#22c55e;font-weight:700;"> -R$' + (total-combo.preco).toFixed(2).replace('.',',') + '</span>' : '';

  div.innerHTML = imgHtml +
    '<div class="item-body">' +
      '<div class="item-name">🎁 ' + combo.nome + economia + '</div>' +
      '<div class="item-desc">' + (combo.descricao || itensList) + '</div>' +
      '<div class="item-footer">' +
        '<div class="item-price">R$ ' + Number(combo.preco||0).toFixed(2).replace('.',',') + '</div>' +
        '<button class="item-add-btn" onclick="event.stopPropagation();adicionarComboRapido(\'' + combo._id + '\')">+</button>' +
      '</div>' +
    '</div>';

  div.onclick = function(){ abrirCombo(combo); };
  return div;
}

function adicionarComboRapido(comboId) {
  var combos = (cardapioData && cardapioData.combos) || [];
  var combo = combos.find(function(c){ return c._id === comboId; });
  if (!combo) return;
  carrinho.push({
    itemId: combo._id, nome: '🎁 ' + combo.nome,
    preco: Number(combo.preco||0), qty: 1, obs: '',
    imagem: combo.imagem||'', emoji: '🎁'
  });
  atualizarCartUI();
  showToast('✅ ' + combo.nome + ' adicionado!');
}

function abrirCombo(combo) {
  var itensList = (combo.itens||[]).map(function(i){ return '• ' + i.quantidade + 'x ' + i.nome; }).join('<br>');
  var total = (combo.itens||[]).reduce(function(a,i){ return a + (i.preco||0)*(i.quantidade||1); }, 0);
  var economia = total > combo.preco
    ? '<div style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.85em;color:#22c55e;font-weight:700;">✅ Economia de R$ ' + (total-combo.preco).toFixed(2).replace('.',',') + ' comprando o combo!</div>'
    : '';

  var imgHtml = combo.imagem
    ? '<img class="modal-img" src="' + combo.imagem + '">'
    : '<div class="modal-img-ph">🎁</div>';

  document.getElementById('modalItemConteudo').innerHTML =
    imgHtml +
    '<div class="modal-body">' +
      '<div class="modal-name">🎁 ' + combo.nome + '</div>' +
      '<div class="modal-desc">' + (combo.descricao||'') + '</div>' +
      '<div class="modal-price">R$ ' + Number(combo.preco||0).toFixed(2).replace('.',',') + '</div>' +
      economia +
      '<div style="background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:16px;">' +
        '<div style="font-size:.72em;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">📦 Incluso no combo</div>' +
        '<div style="font-size:.85em;color:var(--text2);line-height:1.8;">' + itensList + '</div>' +
      '</div>' +
      '<button class="btn-add-cart" onclick="adicionarComboRapido(\'' + combo._id + '\');fecharItem({target:document.getElementById('overlayItem')})">Adicionar Combo — R$ ' + Number(combo.preco||0).toFixed(2).replace('.',',') + '</button>' +
    '</div>';

  document.getElementById('overlayItem').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function abrirItem(item) {
  itemAtual = item;
  ingrRetirados = [];
  qtyAtual = 1;
  var ingrs = (item.ingredientes||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var imgHtml = item.imagem
    ? '<img class="modal-img" src="' + item.imagem + '">'
    : '<div class="modal-img-ph">' + (item.categoria?.emoji || '🍽️') + '</div>';

  var ingrsHtml = ingrs.length ? '<div class="modal-section"><div class="modal-section-title">🥗 Ingredientes (toque para retirar)</div>' +
    ingrs.map(function(ing){
      var key = ing.replace(/[^a-zA-Z0-9]/g,'_');
      return '<div class="ingr-item"><span class="ingr-nome">' + ing + '</span>' +
        '<button class="btn-retirar" id="ingr-' + key + '" data-ing="' + ing.replace(/"/g,'&quot;') + '" onclick="toggleIngr(this)">' +
        'Retirar</button></div>';
    }).join('') + '</div>' : '';

  document.getElementById('modalItemConteudo').innerHTML =
    imgHtml +
    '<div class="modal-body">' +
      '<div class="modal-name">' + item.nome + '</div>' +
      '<div class="modal-desc">' + (item.descricao||'Sem descrição') + '</div>' +
      '<div class="modal-price">R$ ' + Number(item.preco||0).toFixed(2).replace('.',',') + '</div>' +
      ingrsHtml +
      '<div class="modal-section"><div class="modal-section-title">📝 Observações</div>' +
        '<textarea class="obs-input" id="itemObs" placeholder="Ex: sem cebola, ponto da carne..."></textarea>' +
      '</div>' +
      '<div class="qty-row">' +
        '<span style="font-size:.85em;color:var(--text2)">Quantidade</span>' +
        '<div class="qty-ctrl">' +
          '<button class="qty-btn" onclick="mudarQty(-1)">−</button>' +
          '<span class="qty-num" id="qtyNum">1</span>' +
          '<button class="qty-btn" onclick="mudarQty(1)">+</button>' +
        '</div>' +
      '</div>' +
      '<button class="btn-add-cart" id="btnAddCart" onclick="adicionarAoCarrinho()">Adicionar — R$ ' + Number(item.preco||0).toFixed(2).replace('.',',') + '</button>' +
    '</div>';

  document.getElementById('overlayItem').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fecharItem(e) {
  if (e && e.target !== document.getElementById('overlayItem')) return;
  document.getElementById('overlayItem').classList.remove('show');
  document.body.style.overflow = '';
}

function toggleIngr(btn) {
  var ing = btn.dataset.ing;
  if (btn.classList.contains('retirado')) {
    btn.classList.remove('retirado');
    btn.textContent = 'Retirar';
    ingrRetirados = ingrRetirados.filter(function(i){ return i !== ing; });
  } else {
    btn.classList.add('retirado');
    btn.textContent = 'Retirado';
    ingrRetirados.push(ing);
  }
}

function mudarQty(delta) {
  qtyAtual = Math.max(1, qtyAtual + delta);
  document.getElementById('qtyNum').textContent = qtyAtual;
  var preco = Number(itemAtual.preco||0);
  document.getElementById('btnAddCart').textContent = 'Adicionar ' + qtyAtual + (qtyAtual>1?' itens':' item') + ' — R$ ' + (preco*qtyAtual).toFixed(2).replace('.',',');
}

function adicionarAoCarrinho() {
  if (!itemAtual) return;
  var obs = document.getElementById('itemObs').value;
  if (ingrRetirados.length) obs = 'Sem: ' + ingrRetirados.join(', ') + (obs ? '. ' + obs : '');
  carrinho.push({
    itemId: itemAtual._id,
    nome: itemAtual.nome,
    preco: Number(itemAtual.preco||0),
    qty: qtyAtual,
    obs: obs,
    imagem: itemAtual.imagem || '',
    emoji: itemAtual.categoria?.emoji || '🍽️'
  });
  atualizarCartUI();
  document.getElementById('overlayItem').classList.remove('show');
  document.body.style.overflow = '';
  showToast('✅ ' + itemAtual.nome + ' adicionado!');
  atualizarBadgesCards();
}

function adicionarRapido(e, itemId) {
  e.stopPropagation();
  var d = cardapioData;
  var itens = d.itens || d.cardapio || [];
  var item = itens.find(function(i){ return i._id === itemId; });
  if (!item) return;
  carrinho.push({
    itemId: item._id, nome: item.nome, preco: Number(item.preco||0),
    qty: 1, obs: '', imagem: item.imagem||'', emoji: item.categoria?.emoji||'🍽️'
  });
  atualizarCartUI();
  showToast('✅ ' + item.nome + ' adicionado!');
  atualizarBadgesCards();
}

function atualizarBadgesCards() {
  var d = cardapioData;
  var itens = d.itens || d.cardapio || [];
  itens.forEach(function(item) {
    var badge = document.getElementById('badge-' + item._id);
    if (!badge) return;
    var qty = carrinho.filter(function(c){ return c.itemId === item._id; }).reduce(function(a,b){ return a+b.qty; }, 0);
    badge.textContent = qty || '';
    badge.className = 'item-badge-cart' + (qty > 0 ? ' show' : '');
  });
}

function atualizarCartUI() {
  var total = carrinho.reduce(function(a,b){ return a + b.preco * b.qty; }, 0);
  var qtd = carrinho.reduce(function(a,b){ return a + b.qty; }, 0);
  var fab = document.getElementById('cartFab');
  if (qtd > 0) {
    fab.classList.add('show');
    document.getElementById('cartBadge').textContent = qtd;
    document.getElementById('cartFabTotal').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
  } else {
    fab.classList.remove('show');
  }
  document.getElementById('cartTotal').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
}

function abrirCarrinho() {
  renderCarrinho();
  document.getElementById('overlayCart').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fecharCarrinho() {
  document.getElementById('overlayCart').classList.remove('show');
  document.body.style.overflow = '';
}

function renderCarrinho() {
  var container = document.getElementById('cartItens');
  if (!carrinho.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)">🛒<br><br>Carrinho vazio</div>';
    return;
  }
  container.innerHTML = '';
  carrinho.forEach(function(item, idx) {
    var div = document.createElement('div');
    div.className = 'cart-row';
    var imgHtml = item.imagem
      ? '<img class="cart-row-img" src="' + item.imagem + '">'
      : '<div class="cart-row-img-ph">' + item.emoji + '</div>';
    div.innerHTML = imgHtml +
      '<div class="cart-row-info">' +
        '<div class="cart-row-name">' + item.nome + '</div>' +
        (item.obs ? '<div class="cart-row-obs">' + item.obs + '</div>' : '') +
      '</div>' +
      '<div class="cart-row-qty">' +
        '<button class="cqty-btn" onclick="alterarQtyCart(' + idx + ',-1)">−</button>' +
        '<span class="cqty-num">' + item.qty + '</span>' +
        '<button class="cqty-btn" onclick="alterarQtyCart(' + idx + ',1)">+</button>' +
      '</div>' +
      '<div class="cart-row-price">R$ ' + (item.preco * item.qty).toFixed(2).replace('.',',') + '</div>';
    container.appendChild(div);
  });
}

function alterarQtyCart(idx, delta) {
  carrinho[idx].qty = Math.max(0, carrinho[idx].qty + delta);
  if (carrinho[idx].qty === 0) carrinho.splice(idx, 1);
  atualizarCartUI();
  atualizarBadgesCards();
  renderCarrinho();
  if (!carrinho.length) fecharCarrinho();
}

function setTipo(tipo) {
  tipoAtual = tipo;
  document.getElementById('btnEntrega').className = 'tipo-btn' + (tipo==='entrega' ? ' active' : '');
  document.getElementById('btnRetirada').className = 'tipo-btn' + (tipo==='retirada' ? ' active' : '');
  var endRow = document.getElementById('campoEndereco').parentNode;
  if (tipo === 'entrega') {
    document.getElementById('campoEndereco').style.display = 'block';
    document.getElementById('tempoRetirada').style.display = 'none';
  } else {
    document.getElementById('campoEndereco').style.display = 'none';
    calcularTempoRetirada();
    document.getElementById('tempoRetirada').style.display = 'block';
  }
}

async function calcularTempoRetirada() {
  try {
    var r = await fetch('/api/delivery/tempo-espera/' + adminId);
    var d = await r.json();
    var tempo = d.tempoMinutos || 20;
    document.getElementById('tempoVal').textContent = tempo + ' minutos';
  } catch(e) {
    document.getElementById('tempoVal').textContent = '~20 minutos';
  }
}

async function finalizarPedido() {
  var nome = document.getElementById('campoNome').value.trim();
  var tel = document.getElementById('campoTelefone').value.trim();
  var end = document.getElementById('campoEndereco').value.trim();
  var obs = document.getElementById('campoObs').value.trim();

  if (!nome) { showToast('⚠️ Informe seu nome'); return; }
  if (!tel) { showToast('⚠️ Informe seu WhatsApp'); return; }
  if (tipoAtual === 'entrega' && !end) { showToast('⚠️ Informe o endereço de entrega'); return; }
  if (!carrinho.length) { showToast('⚠️ Carrinho vazio'); return; }

  document.getElementById('btnFinalizar').disabled = true;
  document.getElementById('btnFinalizar').textContent = 'Enviando...';

  try {
    var total = carrinho.reduce(function(a,b){ return a + b.preco * b.qty; }, 0);
    var body = {
      adminId: adminId,
      nomeCliente: nome,
      telefone: tel,
      tipo: tipoAtual,
      endereco: tipoAtual === 'entrega' ? end : '',
      observacoes: obs,
      itens: carrinho.map(function(c){ return { itemId: c.itemId, nome: c.nome, preco: c.preco, quantidade: c.qty, obs: c.obs }; }),
      total: total
    };
    var r = await fetch('/api/delivery/pedido-publico', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    var d = await r.json();
    if (d.sucesso || d._id) {
      fecharCarrinho();
      mostrarResultado(nome, tipoAtual, d.tempoEstimado);
    } else {
      throw new Error(d.erro || 'Erro ao enviar');
    }
  } catch(e) {
    showToast('❌ Erro: ' + e.message);
    document.getElementById('btnFinalizar').disabled = false;
    document.getElementById('btnFinalizar').textContent = '✅ Finalizar pedido';
  }
}

function mostrarResultado(nome, tipo, tempo) {
  carrinho = [];
  atualizarCartUI();
  atualizarBadgesCards();
  var wrap = document.getElementById('resultadoWrap');
  document.getElementById('resultTitulo').textContent = tipo === 'entrega' ? '🎉 Pedido recebido!' : '🎉 Pedido confirmado!';
  document.getElementById('resultSub').textContent = tipo === 'entrega'
    ? 'Olá ' + nome + '! Seu pedido foi enviado e está sendo preparado. Em breve sairá para entrega!'
    : 'Olá ' + nome + '! Seu pedido está sendo preparado. Venha buscar em breve!';
  var tempoEl = document.getElementById('resultTempo');
  if (tempo || tipo === 'retirada') {
    tempoEl.style.display = 'block';
    tempoEl.textContent = '⏱️ Tempo estimado: ' + (tempo || document.getElementById('tempoVal').textContent);
  }
  wrap.classList.add('show');
}

function novoPedido() {
  document.getElementById('resultadoWrap').classList.remove('show');
  document.getElementById('campoNome').value = '';
  document.getElementById('campoTelefone').value = '';
  document.getElementById('campoEndereco').value = '';
  document.getElementById('campoObs').value = '';
}

function filtrarCat(catId, btn) {
  document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.section').forEach(function(sec) {
    sec.style.display = (catId === 'todas' || sec.dataset.cat === catId) ? 'block' : 'none';
  });
}

function filtrarBusca(q) {
  var busca = q.toLowerCase().trim();
  document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('[data-cat="todas"]').classList.add('active');

  document.querySelectorAll('.section').forEach(function(sec){ sec.style.display = 'block'; });
  document.querySelectorAll('.item-card').forEach(function(card) {
    var nome = (card.dataset.nome||'').toLowerCase();
    card.style.display = (!busca || nome.includes(busca)) ? 'block' : 'none';
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

init();
</script>
</body>
</html>
