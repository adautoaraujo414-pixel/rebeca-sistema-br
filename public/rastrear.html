<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreando seu motorista</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  #mapa { flex: 1; }
  #painel {
    background: #1e293b;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid #334155;
  }
  #status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0ea5e9;
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    width: fit-content;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #motorista-info { display: flex; align-items: center; gap: 12px; }
  #motorista-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: #334155; display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  #motorista-nome { font-size: 16px; font-weight: 700; }
  #motorista-veiculo { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  #tempo-info { font-size: 13px; color: #64748b; text-align: center; }
  #origem-destino { font-size: 13px; color: #94a3b8; }
  #origem-destino span { color: #e2e8f0; }
  #erro { display: none; background: #dc2626; padding: 20px; text-align: center; border-radius: 12px; margin: 20px; }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #1e293b; padding: 24px 32px; border-radius: 16px;
    text-align: center; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .spinner { width: 36px; height: 36px; border: 3px solid #334155; border-top-color: #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #finalizado { display: none; position: absolute; inset: 0; background: #0f172a; z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-size: 18px; text-align: center; padding: 32px; }
  .emoji-big { font-size: 64px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Localizando motorista...</div>
</div>

<div id="finalizado">
  <div class="emoji-big" id="emoji-final">✅</div>
  <div id="msg-final">Corrida finalizada. Obrigado!</div>
</div>

<div id="mapa"></div>

<div id="painel">
  <div id="status-badge"><div class="dot"></div><span id="status-texto">Motorista a caminho</span></div>
  <div id="motorista-info">
    <div id="motorista-avatar">🚗</div>
    <div>
      <div id="motorista-nome">Carregando...</div>
      <div id="motorista-veiculo"></div>
    </div>
  </div>
  <div id="origem-destino"></div>
  <div id="tempo-info">Atualizando localização...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const _params = new URLSearchParams(location.search);
const codigo = _params.get('c') || location.pathname.split('/').pop();
const API = `/api/rebeca/rastrear/${codigo}`;

const mapa = L.map('mapa', { zoomControl: true, attributionControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

// Ícone do motorista
const iconeMotorista = L.divIcon({
  html: '<div style="font-size:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">🚗</div>',
  iconSize: [40, 40], iconAnchor: [20, 20], className: ''
});
const iconeOrigem = L.divIcon({
  html: '<div style="font-size:24px">📍</div>',
  iconSize: [28, 28], iconAnchor: [14, 28], className: ''
});

let marcadorMotorista = null;
let marcadorOrigem = null;
let primeiraVez = true;

function atualizarStatus(status) {
  const badges = {
    'pendente': { texto: 'Buscando motorista', cor: '#f59e0b' },
    'aceita': { texto: 'Motorista aceito', cor: '#0ea5e9' },
    'motorista_a_caminho': { texto: 'Motorista a caminho', cor: '#0ea5e9' },
    'em_andamento': { texto: 'Em corrida', cor: '#10b981' },
    'finalizada': { texto: 'Corrida finalizada', cor: '#6366f1' },
    'cancelada': { texto: 'Cancelada', cor: '#dc2626' }
  };
  const b = badges[status] || badges['aceita'];
  document.getElementById('status-texto').textContent = b.texto;
  document.getElementById('status-badge').style.background = b.cor;
}

async function atualizar() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';

    if (data.expirado || data.corrida?.status === 'finalizada') {
      const fin = document.getElementById('finalizado');
      fin.style.display = 'flex';
      document.getElementById('emoji-final').textContent = data.corrida?.status === 'cancelada' ? '❌' : '✅';
      document.getElementById('msg-final').textContent = data.mensagem || 'Corrida finalizada. Obrigado!';
      return;
    }

    const c = data.corrida;
    const m = data.motorista;

    atualizarStatus(c.status);

    // Info do motorista
    if (m) {
      document.getElementById('motorista-nome').textContent = m.nome || 'Motorista';
      document.getElementById('motorista-veiculo').textContent = [m.veiculo?.modelo, m.veiculo?.cor, m.veiculo?.placa].filter(Boolean).join(' · ');
    }

    // Origem/destino
    if (c.origem) {
      document.getElementById('origem-destino').innerHTML =
        `📍 <span>${c.origem}</span>` + (c.destino ? ` → <span>${c.destino}</span>` : '');
    }

    // GPS do motorista
    const lat = data.motorista?.gps?.latitude || data.motorista?.latitude;
    const lng = data.motorista?.gps?.longitude || data.motorista?.longitude;

    if (lat && lng) {
      const pos = [lat, lng];
      if (!marcadorMotorista) {
        marcadorMotorista = L.marker(pos, { icon: iconeMotorista }).addTo(mapa);
      } else {
        marcadorMotorista.setLatLng(pos);
      }
      if (primeiraVez) {
        mapa.setView(pos, 15);
        primeiraVez = false;
      }
      document.getElementById('tempo-info').textContent = 'Localização atualizada agora';
    } else if (c.origemLat && c.origemLng) {
      // Sem GPS do motorista — mostrar origem
      if (!marcadorOrigem) {
        marcadorOrigem = L.marker([c.origemLat, c.origemLng], { icon: iconeOrigem }).addTo(mapa);
        mapa.setView([c.origemLat, c.origemLng], 14);
        primeiraVez = false;
      }
      document.getElementById('tempo-info').textContent = 'Aguardando localização do motorista...';
    }

    // Tempo estimado
    if (c.tempoEstimado > 0) {
      document.getElementById('tempo-info').textContent = `Previsão de chegada: ~${c.tempoEstimado} min`;
    }

  } catch(e) {
    console.error('Erro ao atualizar:', e);
  }
}

atualizar();
setInterval(atualizar, 5000); // atualiza a cada 5s
</script>
</body>
</html>
